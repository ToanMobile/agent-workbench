# TẠM (phiên r19, #768): chạy npm test antigravity-pm-mcp trên ubuntu để kiểm bản sửa Linux. Commit sau gỡ file này trước khi review/merge.
name: tmp-r19-pm-mcp-linux
on:
  push:
    branches: [r19-768-pm-mcp-linux]
permissions:
  contents: read
jobs:
  pm-mcp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: node + ps
        run: node --version && ps --version
      - name: npm test
        run: cd mcp-servers/antigravity-pm-mcp && npm test
      - name: npm run test:coverage
        run: cd mcp-servers/antigravity-pm-mcp && npm run test:coverage
