# Cổng máy cho mọi PR: chạy cả bộ test DevKit (run_impacted.sh --all) trên macOS.
# 35 file test viết cho macOS (sed -i '', launchctl, cp -c, xcrun, stat -f) đỏ trên ubuntu (run 41209128293), nên job chạy trên
# macos-latest (phương án (a) của #781). Phút macOS đắt ~10x ubuntu: chỉ một job, có timeout (90 phút: bộ test chạy 50-58 phút, run 42803485149 bị cắt ở mốc 60).
# Các lớp quét khác (semgrep, gitleaks, OCR) sẽ vào workflow này bằng thẻ riêng; thẻ này không dựng lại theo trí nhớ.
name: pr-review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devkit-tests:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Git identity (the worktree and automerge tests commit; the runner has none)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"

      # macos-26 keeps Go in the tool cache, not on PATH. test_matrix_detect.sh runs a real `go test` (no stub, #781 R3).
      # cache: false — the suite does not restore a module cache, and this job's token is contents:read only.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: false

      - name: DevKit tests (whole suite)
        run: bash universal-agent-devkit/tests/run_impacted.sh --all
