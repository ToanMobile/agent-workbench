<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng agent</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('agent-office-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E4E9EF; --floor: #EEF1F5; --floor2: #E2E7EE; --wall: #F8F9FB; --rack: #D9CDBB; --desk: #EFE8DC;
    --ink: #1C2431; --muted: #5A6475; --faint: #6B7484; --line: #CDD4DE;
    --panel: rgba(250, 251, 253, 0.92); --panel-solid: #FAFBFD; --card: #FFFFFF; --paper: #FFFFFF; --skin: #F3EEE7; --screen: #0F1622;
    --c-backlog: #8C96A8; --c-ready: #3567D6; --c-building: #E58D0B; --c-qa: #8B5CF6; --c-review: #0E9A8A;
    --c-blocked: #D63E2C; --c-done: #4C9744; --c-you: #D2337A; --c-away: #A3ABB8;
    --t-ready: #2B58BD; --t-building: #8F5200; --t-qa: #6638D4; --t-review: #06705F; --t-blocked: #B02D1E; --t-done: #2C6E27; --t-you: #AD1E5E;
    --shadow: 0 10px 34px rgba(20, 32, 52, 0.13);
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0D1218; --floor: #1A212B; --floor2: #212935; --wall: #2E3846; --rack: #5A4E3F; --desk: #5C5247;
    --ink: #E6EBF2; --muted: #9AA5B5; --faint: #8792A3; --line: #2B3543;
    --panel: rgba(19, 25, 33, 0.92); --panel-solid: #131921; --card: #1F2732; --paper: #DDE3EB; --skin: #E2D9CD; --screen: #070B11;
    --c-backlog: #8792A6; --c-ready: #5B8BF2; --c-building: #F3A63A; --c-qa: #A27EFB; --c-review: #26B6A3;
    --c-blocked: #F05A47; --c-done: #69B35E; --c-you: #EE5197; --c-away: #4D5664;
    --t-ready: #86A9F6; --t-building: #F3A63A; --t-qa: #B99BFC; --t-review: #3FC4B1; --t-blocked: #F47B6B; --t-done: #7DC373; --t-you: #F270A9;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--c-ready); outline-offset: 2px; }
  a { color: var(--c-ready); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* top */
  .top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; z-index: 5; }
  .top > * { pointer-events: auto; }
  .brand { padding: 12px 16px 12px; width: 320px; flex: none; }
  .brand h1 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
  .brand .proj { margin-top: 4px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand .proj a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .sync { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-done); flex: none; }
  .dot.warn { background: var(--c-building); } .dot.err { background: var(--c-blocked); }
  .legend { margin-left: auto; padding: 8px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: min(760px, 60vw); }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
  button.chip { border: 0; background: transparent; cursor: pointer; font: inherit; color: inherit; }
  button.chip:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .chip.you { background: color-mix(in srgb, var(--c-you) 14%, transparent); color: var(--t-you); font-weight: 600; }
  .chip.working { background: color-mix(in srgb, var(--c-done) 14%, transparent); }

  .notices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .notices:empty { display: none; }
  .notice { padding: 8px 10px; border-radius: 10px; background: var(--floor2); font-size: 12.5px; line-height: 1.45; display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; }
  .notice.error { background: color-mix(in srgb, var(--c-blocked) 11%, var(--panel-solid)); }
  .notice.warn { background: color-mix(in srgb, var(--c-building) 12%, var(--panel-solid)); }
  .notice code { font-family: var(--mono); font-size: 12px; background: var(--floor2); padding: 3px 7px; border-radius: 6px; user-select: all; }
  .notice button { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 12px; }

  /* rail */
  .rail { position: fixed; left: 12px; top: calc(var(--top-h, 134px) + 12px); bottom: calc(var(--bot-h, 64px) + 10px); width: 300px; padding: 8px; overflow: auto; z-index: 4; }
  .rail h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 8px 8px; }
  .rail[hidden] { display: none; }
  .agents h2 { display: flex; justify-content: space-between; align-items: baseline; }
  #agentsCount { font-weight: 600; color: var(--t-done); }
  .ag { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px 10px; border-radius: 12px; cursor: pointer; }
  .ag + .ag { border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
  .ag:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .ag-top { display: flex; align-items: center; gap: 7px; font-size: 14px; }
  .ag-top i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ag-top b { white-space: nowrap; flex: none; }
  .ag-repo { flex: 1 1 auto; }
  .ag-repo { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ag-time { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 6px; }
  .ag-task { font-size: 12.5px; color: var(--muted); margin: 3px 0 0 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag-do { font-size: 13.5px; margin: 2px 0 0 16px; font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ag.away { opacity: .7; }
  .ag-group { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 10px 2px; }
  .ag-idle { font-size: 12.5px; color: var(--muted); margin: 10px 10px 4px; line-height: 1.45; }
  body.rail-open .board { left: 324px; }
  .lbl-repo { pointer-events: auto; cursor: pointer; }
  .lbl-repo:hover { border-color: var(--c-ready); }
  @media (max-width: 900px) { body.rail-open .board { left: 12px; } }
  .repo { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px; border-radius: 12px; cursor: pointer; }
  .repo:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .repo[aria-current="true"] { background: color-mix(in srgb, var(--c-ready) 11%, transparent); }
  .repo .r1 { display: flex; align-items: center; gap: 8px; }
  .repo .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--t-done); background: color-mix(in srgb, var(--c-done) 13%, transparent); }
  .pill.idle { color: var(--t-building); background: color-mix(in srgb, var(--c-building) 14%, transparent); }
  .pill.finished, .pill.none { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .pill.stale { color: var(--t-blocked); background: color-mix(in srgb, var(--c-blocked) 12%, transparent); }
  .pill.working { color: var(--t-done); background: color-mix(in srgb, var(--c-done) 13%, transparent); }
  .pill.away { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin: 9px 0 7px; background: var(--floor2); gap: 2px; }
  .bar span { display: block; height: 100%; min-width: 3px; }
  .repo .r3 { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; justify-content: space-between; }
  .repo .r3 .busy { color: var(--ink); font-weight: 500; }

  /* drawer */
  .drawer { position: fixed; right: 12px; top: calc(var(--top-r, 70px) + 12px); bottom: calc(var(--bot-h, 64px) + 10px); width: 388px; overflow: auto; z-index: 4; padding: 18px 18px 22px; }
  .drawer[hidden] { display: none; }
  .close { position: sticky; top: -6px; float: right; margin: -8px -8px 0 8px; width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); cursor: pointer; font-size: 18px; line-height: 1; z-index: 2; }
  .kicker { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .drawer h2 { font-size: 20px; line-height: 1.3; margin: 6px 0 4px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .drawer h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 0 8px; }
  .meta { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13.5px; }
  .meta dt { color: var(--muted); } .meta dd { margin: 0; overflow-wrap: anywhere; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .say { margin: 0; padding: 10px 12px; border-left: 3px solid var(--c-ready); background: color-mix(in srgb, var(--c-ready) 7%, transparent); border-radius: 0 10px 10px 0; font-size: 14px; }
  .say.blocked { border-left-color: var(--c-blocked); background: color-mix(in srgb, var(--c-blocked) 7%, transparent); }
  .say small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .feed li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed li:last-child { border-bottom: 0; }
  .feed .k { font-size: 11.5px; font-weight: 600; color: var(--muted); padding-top: 1px; }
  .feed .k.tool { color: var(--c-ready); }
  .feed .v { min-width: 0; overflow-wrap: anywhere; }
  .feed .v .mono { color: var(--ink); }
  .feed time { display: block; color: var(--faint); font-size: 11.5px; }
  .row-list { list-style: none; margin: 0; padding: 0; }
  .meta dd .more { text-align: left; }
  .row-list button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .row-list button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .row-list .num { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; white-space: nowrap; }
  .row-list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-list .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .colhead { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin: 12px 0 2px; }
  .colhead .sw { width: 10px; height: 10px; border-radius: 3px; }
  .colhead .n { color: var(--muted); font-weight: 500; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bars .b { display: grid; grid-template-columns: 96px 1fr 30px; gap: 10px; align-items: center; font-size: 13px; }
  .bars .track { height: 8px; background: var(--floor2); border-radius: 4px; overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 4px; }
  .bars .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lanes { display: flex; flex-direction: column; gap: 6px; }
  .lane { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--floor2); font-size: 13.5px; border: 0; text-align: left; cursor: pointer; width: 100%; }
  .lane .ln { font-weight: 700; white-space: nowrap; }
  .lane .lv { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane.busy .lv { color: var(--ink); }
  .labels { display: flex; flex-wrap: wrap; gap: 5px; }
  .gl { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .ghlink { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--panel-solid); text-decoration: none; font-weight: 600; font-size: 13.5px; }
  .empty { color: var(--muted); font-size: 13.5px; margin: 0; }
  .more { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; margin: 4px 8px; }
  .spark { width: 100%; height: 84px; display: block; }
  .spark-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .spark-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .spark-legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }

  /* controls */
  .controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 6px; z-index: 5; }
  .controls button { border: 0; background: transparent; padding: 8px 14px; border-radius: 11px; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .controls button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .controls { flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  .controls .sec { display: none; }
  .controls.more .sec { display: inline-block; }
  .controls .more-btn { color: var(--muted); }

  /* 3D labels */
  .lbl { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .lbl-col { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
  .lbl-col .sw { width: 10px; height: 10px; border-radius: 3px; }
  .lbl-col .n { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lbl-repo { flex-direction: column; align-items: flex-end !important; gap: 3px !important; display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; padding: 5px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .lbl-repo .you { color: var(--t-you); font-size: 12px; font-weight: 700; }
  .lbl-col { font-size: 15px; padding: 5px 12px; pointer-events: auto; cursor: pointer; color: var(--ink); }
  .lbl-col:hover { border-color: var(--muted); }
  .row-list.wrap .t { white-space: normal; }
  .why-line { font-size: 12px; color: var(--muted); margin: -2px 8px 6px 60px; border-left: 2px solid var(--c-blocked); padding-left: 7px; line-height: 1.4; overflow-wrap: anywhere; }
  .lbl-repo { font-size: 16px; padding: 7px 12px 8px; gap: 1px !important; border-right: 5px solid var(--st, var(--line)); }
  .lbl-repo .rs { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 700; color: var(--st-t, var(--st)); }
  .lbl-repo .rs i { width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
  .lbl-repo .rd { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .lbl-repo.st-working { --st: var(--c-done); --st-t: var(--t-done); background: color-mix(in srgb, var(--c-done) 9%, var(--panel-solid)); }
  .lbl-repo.st-idle { --st: var(--c-building); --st-t: var(--t-building); }
  .lbl-repo.st-stopped { --st: var(--muted); color: var(--muted); }
  .lbl-repo.st-stopped .rs i { border-radius: 2px; }
  .lbl-repo.st-stale { --st: var(--c-blocked); --st-t: var(--t-blocked); }
  .st-working .rs i { animation: livepulse 1.4s ease-in-out infinite; }
  @keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .lbl-idle { font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px dashed var(--faint); padding: 2px 9px; border-radius: 999px; }
  .far .lbl-idle { display: none; }
  .bubble { max-width: 280px; font-size: 13.5px; border-top: 3px solid var(--c-done); }
  .bubble .bt { font-size: 13.5px; }
  .bubble .bx .mono { font-size: 12px; }
  .bubble { pointer-events: auto; cursor: pointer; text-align: left; color: var(--ink); }
  .bubble:hover { border-color: var(--c-done); }
  .lbl-repo { text-align: right; color: var(--ink); }
  .lbl-repo { gap: 0 !important; font-size: 13px; line-height: 1.3; padding: 4px 9px 5px; border-right-width: 3px; border-radius: 8px; }
  .lbl-repo .rs { font-size: 11.5px; gap: 5px; }
  .lbl-repo .rs i { width: 7px; height: 7px; }
  .lbl-repo .rd { font-size: 11px; }
  .states { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 13.5px; font-weight: 600; }
  .states span { display: inline-flex; align-items: center; gap: 6px; }
  .states i { width: 9px; height: 9px; border-radius: 50%; }
  @media (prefers-reduced-motion: reduce) { .st-working .rs i { animation: none; } }
  .bubble { max-width: 250px; white-space: normal; padding: 7px 11px 8px; border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.38; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--panel-solid); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .bubble .bt { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; }
  .bubble .bt i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .far .bubble { padding: 5px 9px; max-width: 232px; } .far .bubble .bdo { -webkit-line-clamp: 1; }
  .bubble .bt { white-space: nowrap; }
  .bubble .bt > span:first-of-type { flex: none; }
  .bubble .bt .bwhen { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bubble.crowd { min-width: 230px; }
  .bubble.crowd .bdo { -webkit-line-clamp: 1; }
  .bubble .bwhen { margin-left: auto; padding-left: 8px; font-weight: 500; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .bubble .btask { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .bubble .bdo { font-size: 12.5px; font-weight: 600; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .bubble .bx { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .bubble .bx .mono { color: var(--ink); font-size: 11.5px; }
  .tip { position: fixed; left: 0; top: 0; z-index: 9; pointer-events: none; max-width: 320px; padding: 7px 10px; border-radius: 9px; background: var(--ink); color: var(--panel-solid); font-size: 12.5px; line-height: 1.4; opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 1; }
  .tip b { display: block; }
  .boot[hidden] { display: none; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; z-index: 3; pointer-events: none; }

  /* thao tác ghi */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }

<script>

const SKINS = ['#F2D3B6', '#E0B08A', '#C48A5E', '#9A6440', '#6B442C'];
const HAIRS = ['#2A221D', '#4B3427', '#7B5534', '#16181C'];
function hashStr(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function makePerson(g, P, w, T, parts) {
  const hsh = hashStr(w.id);
  const shirt = mat(workerColor(w), { roughness: 0.9 });

    const mm = new THREE.Mesh(geo, m); mm.position.set(x, y, z); if (sx) mm.scale.set(sx, sy, sz);

  };
  const X = P.x, hipY = P.standing ? 1.0 : P.seat + 0.08;
  [0.1, -0.1].forEach((zz) => { // chân: ngồi thì gập gối, đứng thì thẳng
    if (P.standing) {
      add(GEO.limb, pants, X, hipY / 2 + 0.03, zz, 1.25, (hipY - 0.06) / 0.5, 1.25);
      add(GEO.box, shoe, X + 0.05, 0.035, zz, 0.24, 0.07, 0.11);
    } else {
      const thigh = add(GEO.limb, pants, X + 0.2, hipY - 0.03, zz, 1.3, 0.84, 1.3); thigh.rotation.z = -Math.PI / 2;
      add(GEO.limb, pants, X + 0.4, (hipY - 0.03) / 2, zz, 1.15, (hipY - 0.06) / 0.5, 1.15);
      add(GEO.box, shoe, X + 0.45, 0.035, zz, 0.22, 0.07, 0.11);
    }
  });
  add(GEO.box, pants, X, hipY, 0, 0.3, 0.15, 0.36); // hông
  const torso = add(GEO.torso, shirt, X - 0.02, hipY + 0.29, 0, 0.72, 1, 1.12); torso.rotation.z = P.standing ? 0 : 0.07;
  const shY = hipY + 0.5;

  add(GEO.sphere1, skin, 0, 0, 0, 0.125, 0.145, 0.118, head);
  add(GEO.sphere1, eye, 0.108, 0.02, 0.045, 0.018, 0.022, 0.018, head);
  add(GEO.sphere1, eye, 0.108, 0.02, -0.045, 0.018, 0.022, 0.018, head);
  add(GEO.sphere1, hairM, -0.045, 0.06, 0, 0.13, 0.12, 0.128, head); // tóc phủ đỉnh và sau đầu
  const hairStyle = (hsh >>> 7) % 3;
  if (hairStyle === 1) add(GEO.box, hairM, -0.09, -0.08, 0, 0.08, 0.26, 0.22, head); // tóc dài sau gáy
  if (hairStyle === 2) add(GEO.sphere1, hairM, -0.13, 0.13, 0, 0.06, 0.06, 0.06, head); // búi tóc
  const arms = [];
  [0.205, -0.205].forEach((zz) => {
    add(GEO.sphere1, shirt, X - 0.03, shY, zz, 0.07, 0.07, 0.07); // vai
    const sh = new THREE.Group(); sh.position.set(X - 0.03, shY, zz); sh.rotation.z = 0.42; g.add(sh);

    add(GEO.limb, skin, 0, 0.13, 0, 0.8, 0.52, 0.8, el); // cẳng tay
    add(GEO.sphere1, skin, 0, 0.28, 0, 0.042, 0.03, 0.05, el); // bàn tay

function makeDesk(w, x, z, T, sc, opts) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = 0.85; g.scale.setScalar(sc || 1.3); world.add(g);
  const style = DESK_STYLES[deskStyle] || DESK_STYLES[0];
  const P = style.pose;
  const hipY = P.standing ? 1.0 : P.seat + 0.08;
  const bubbleY = hipY + 1.2, idleY = P.standing ? 1.5 : P.seat + 0.75;
  const parts = [];
  const scr = canvasTex(320, 200);
  drawScreen(scr, w, T);
  screens.set(w.id, scr);
  const screenFace = track(new THREE.MeshBasicMaterial({ map: scr.tex }));
  const K = {
    T, g, mat, accent: workerColor(w), working: w.status === 'working',
    desk: mat(T.desk), dark: mat(T.dark ? '#14181e' : '#3a4250'), chair: mat(T.dark ? '#4a5462' : '#c3cad4'),
    box: (wd, ht, dp, m, px, py, pz) => { const b = box(wd, ht, dp, m, px, py, pz, g); parts.push(b); return b; },
    mesh: (geo, m, px, py, pz) => { const o = new THREE.Mesh(geo, m); o.position.set(px, py, pz); o.castShadow = true; o.receiveShadow = true; g.add(o); parts.push(o); return o; },
    monitor: (px, py, pz, wd, ht, ry) => {
      const mon = new THREE.Mesh(GEO.box, [K.dark, screenFace, K.dark, K.dark, K.dark, K.dark]);
      mon.scale.set(0.06, ht || 0.6, wd || 0.96); mon.position.set(px, py, pz); if (ry) mon.rotation.y = ry;
      mon.castShadow = true; g.add(mon); parts.push(mon); return mon;
    },
  };
  style.build(K);
  const ring = new THREE.Mesh(GEO.ring, track(new THREE.MeshBasicMaterial({ color: workerColor(w), transparent: true, opacity: 0.9, side: THREE.DoubleSide })));
  ring.rotation.x = -Math.PI / 2; ring.position.set(P.x + 0.15, 0.03, 0); ring.scale.setScalar(1.25); ring.visible = false; g.add(ring);
  workerRings.set(w.id, ring);

  if (w.status !== 'idle') {
    const bodyCol = workerColor(w);
    const person = makePerson(g, P, w, T, parts);
    if (w.status === 'working') {
      rigs.push({ head: person.head, armL: person.armL, armR: person.armR, phase: Math.random() * 6.28, headY: person.headY, armRot: person.armRot });
      const halo = new THREE.Mesh(GEO.ring, track(new THREE.MeshBasicMaterial({ color: cssVar('--c-done'), transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false })));
      halo.rotation.x = -Math.PI / 2; halo.position.set(P.x, 0.08, 0); g.add(halo); halos.push({ mesh: halo, phase: Math.random() });
    }
    const it = itemFor(w.repo, w.issue);
    if (it && w.status === 'working' && !cardMeshes.has(it.id)) { // agent đã kéo thẻ về bàn
      const col = STATE.columns.find((c) => c.name === it.status) || { name: it.status };
      const color = colColor(col);
      const e = mat(T.card), bk = mat(color);
      const front = track(new THREE.MeshStandardMaterial({ map: cardTexture(it, color, w.lane, T), roughness: 0.9, emissive: new THREE.Color(color), emissiveIntensity: T.dark ? 0.22 : 0.06 }));
      const cm = new THREE.Mesh(GEO.card, [e, e, e, e, front, bk]);
      cm.scale.setScalar(0.48); cm.position.set(P.card[0], P.top + 0.3, P.card[2]); cm.rotation.set(-0.12, -0.85, 0, 'YXZ'); // cỡ tờ giấy trên bàn cm.castShadow = true; g.add(cm);
      cm.userData.baseY = cm.position.y;
      cardMeshes.set(it.id, cm); pick(cm, { type: 'item', id: it.id });
    }
    if (w.issue && !it) { // thẻ runner đang cầm nhưng không có trên project
      const tex = cardTexture({ number: w.issue, title: 'Không có trên Project', type: 'Issue' }, bodyCol, null, T);
      const e = mat(T.card);
      const cm = new THREE.Mesh(GEO.card, [e, e, e, e, track(new THREE.MeshStandardMaterial({ map: tex })), e]);
      cm.scale.setScalar(0.5); cm.rotation.x = -Math.PI / 2 + 0.25; cm.rotation.z = 0.1; cm.position.set(P.card[0], P.top + 0.04, 0.12); g.add(cm);
      parts.push(cm);
    }
    if (w.status === 'working' && !(opts && opts.noBubble)) {
      const el = h('button', 'bubble'); el.type = 'button';
      el.dataset.worker = w.id;
      el.addEventListener('click', () => select({ type: 'worker', id: w.id }));
      fillBubble(el, w);
      g.updateMatrixWorld(true);
      addLabel('bubble-l', new THREE.Vector3(P.x, bubbleY, 0).applyMatrix4(g.matrixWorld), el);
    }
  }
  if (w.status !== 'working') {
    g.updateMatrixWorld(true);
    const tag = h('div', null, w.status === 'idle' ? (w.lane || 'Lane') + ' rảnh' : 'Nghỉ, ' + ago(w.session && w.session.lastTs));
    tag.setAttribute('aria-hidden', 'true');
    addLabel('lbl-idle', new THREE.Vector3(P.x, w.status === 'idle' ? idleY : bubbleY + 0.05, 0).applyMatrix4(g.matrixWorld), tag);
  }
  parts.forEach((p) => pick(p, { type: 'worker', id: w.id }));
}

const TOOL_VERB = { Read: 'đọc', Edit: 'sửa', MultiEdit: 'sửa', Write: 'tạo', NotebookEdit: 'sửa notebook', Grep: 'tìm trong code', Glob: 'tìm file',
  Task: 'giao việc cho agent phụ', Agent: 'giao việc cho agent phụ', WebFetch: 'đọc trang web', WebSearch: 'tìm trên web', TodoWrite: 'cập nhật kế hoạch',
  EnterWorktree: 'vào worktree', ExitWorktree: 'rời worktree' };
const baseName = (p) => String(p || '').replace(/\/+$/, '').split('/').pop();
function describeCmd(cmd) {
  const c = String(cmd || '').trim().replace(/^(cd\s+[^&;]+(&&|;)\s*)+/, '');
  const first = c.split(/&&|;|\|/)[0].trim(); const w = first.split(/\s+/);
  const script = (first.match(/(?:bash|sh|python3?|node|npx|pytest)\s+([^\s"']+)/) || [])[1];
  if (/\bpytest\b|\btest\b/.test(first) || (script && /test/i.test(script))) return 'chạy test ' + baseName(script || w[1] || '');
  if (w[0] === 'git') return 'chạy git ' + (w[1] || '') + (w[2] && !w[2].startsWith('-') ? ' ' + baseName(w[2]) : '');
  if (w[0] === 'gh') return 'gọi GitHub (gh ' + w.slice(1, 3).join(' ') + ')';
  if (['grep', 'rg', 'sed', 'cat', 'head', 'tail', 'ls', 'find'].includes(w[0])) return 'xem code: ' + clip(first, 48);
  return 'chạy ' + clip(first, 52);
}
function describe(w) {
  const it = itemFor(w.repo, w.issue); const task = it ? it.title : null;
  const ev = latestEvent(w.session);
  if (!ev) return { task, ts: null, doing: w.status === 'working' ? 'Đang làm thẻ này, chưa thấy lệnh' : 'Rảnh' };
  let what;
  if (ev.kind === 'tool') {
    if (ev.name === 'Bash') what = describeCmd(ev.text);
    else if (['Read', 'Edit', 'MultiEdit', 'Write', 'NotebookEdit'].includes(ev.name)) what = TOOL_VERB[ev.name] + ' ' + baseName(ev.text);
    else what = (TOOL_VERB[ev.name] || ev.name) + (ev.text ? ': ' + clip(shortPath(ev.text, idx.repo.get(w.repo)), 44) : '');
  } else what = 'nói: ' + clip(ev.text.split(/(?<=[.!?:])\s/)[0], 96);
  const age = Date.now() / 1000 - (ev.ts || 0);
  const prefix = w.status !== 'working' ? 'Lần cuối ' : age < 180 ? 'Đang ' : 'Vừa ';
  return { task, ts: ev.ts, doing: prefix + what };
}
function fillBubble(el, w) {
  el.textContent = '';
  const d = describe(w);
  const t = h('div', 'bt'); const dot = h('i'); dot.style.background = workerColor(w);
  t.append(dot, h('span', null, workerName(w) + (w.issue ? ' #' + w.issue : '')));
  if (d.ts) t.append(h('span', 'bwhen', ago(d.ts)));
  el.append(t);
  if (d.task) el.append(h('div', 'btask', d.task));
  el.append(h('div', 'bdo', d.doing));
  el.setAttribute('aria-label', workerName(w) + (w.issue ? ' #' + w.issue : '') + ' ở ' + w.repo + ': ' + (d.task ? d.task + '. ' : '') + d.doing);
}

function refreshDynamic(S) {

function sparkline(hist) {
  const wrapEl = h('div');
  const keys = Object.keys(hist[hist.length - 1].counts);
  const max = Math.max(1, ...hist.flatMap((p) => keys.map((k) => p.counts[k] || 0)));
  const W = 320, H = 84, pad = 6;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'spark'); svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Số thẻ theo từng tick');
  const leg = h('div', 'spark-legend');
  keys.forEach((k) => {
    const col = cssVar('--c-' + (kindOf(k) === 'other' ? 'backlog' : kindOf(k)));
    const pts = hist.map((p, i) => `${pad + (i / (hist.length - 1)) * (W - 2 * pad)},${H - pad - ((p.counts[k] || 0) / max) * (H - 2 * pad)}`).join(' ');
    const pl = document.createElementNS(ns, 'polyline'); pl.setAttribute('points', pts); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', col);
    pl.setAttribute('stroke-width', '2'); pl.setAttribute('vector-effect', 'non-scaling-stroke'); pl.setAttribute('stroke-linejoin', 'round'); svg.append(pl);
    const s = h('span'); const i = h('i'); i.style.background = col; s.append(i, k + ' ' + (hist[hist.length - 1].counts[k] || 0)); leg.append(s);
  });
  wrapEl.append(h('h3', null, 'Diễn biến ' + hist.length + ' tick gần nhất (' + hist[0].time + ' đến ' + hist[hist.length - 1].time + ')'), svg, leg);
  return wrapEl;
}

    else if (l.align === 'up') l.x = Math.max(l.x, leftEdge + l.w / 2 + 8);
    if (l.align === 'up' && l.y > bottomEdge) { l.el.style.display = 'none'; l.shown = false; continue; } // agent nằm sau thanh nút: ẩn bóng thoại cụt
    vis.push(l);
  }
  // nhãn hàng/cột giữ chỗ; bóng thoại và nhãn "rảnh" nhích lên khi đè nhau
  const rect = (l) => l.align === 'left' ? [l.x - l.w, l.y - l.h / 2, l.x, l.y + l.h / 2]
    : l.align === 'down' ? [l.x - l.w / 2, l.y, l.x + l.w / 2, l.y + l.h] : [l.x - l.w / 2, l.y - l.h, l.x + l.w / 2, l.y];
  const hit = (p, q) => p[0] < q[2] - 1 && p[2] > q[0] + 1 && p[1] < q[3] - 1 && p[3] > q[1] + 1;
  const placed = vis.filter((l) => l.align !== 'up').map(rect);
  vis.filter((l) => l.align === 'up').sort((p, q) => q.y - p.y).forEach((l) => {
    for (let i = 0; i < 6; i++) { const r = rect(l); const o = placed.find((q) => hit(r, q)); if (!o) break; l.y = o[1] - 4; }
    placed.push(rect(l));
  });
  for (const l of vis) {
    l.el.style.transform = `translate(${l.x.toFixed(1)}px, ${l.y.toFixed(1)}px) ` + (l.align === 'left' ? 'translate(-100%, -50%)' : l.align === 'down' ? 'translate(-50%, 0)' : 'translate(-50%, -100%)');
    l.el.style.zIndex = String(Math.round((1 - l.z) * 10000));
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  if (flight) {
    const t = Math.min(1, (now - flight.start) / flight.dur), e = ease(t);
    camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (t >= 1) flight = null;
  }
  controls.update();
  if (!reduceMotion.matches) {
    const t = now / 1000;
    for (const r of rigs) {
      r.armL.rotation.z = r.armRot + Math.sin(t * 11 + r.phase) * 0.12;
      r.armR.rotation.z = r.armRot + Math.sin(t * 11 + r.phase + 1.7) * 0.12;
      r.head.position.y = r.headY + Math.sin(t * 2.2 + r.phase) * 0.025;
    }
    for (const l of lamps) if (l.pulse) l.mesh.material.emissiveIntensity = 0.55 + Math.sin(t * 3) * 0.35;
    for (const hl of halos) { const k = (t * 0.7 + hl.phase) % 1; hl.mesh.scale.setScalar(1 + k * 0.9); hl.mesh.material.opacity = 0.85 * (1 - k); }
  }
  if (hoverEvt && !(drag && drag.active)) { const p = hitAt(hoverEvt); setTip(p, hoverEvt); }
  updateLabels();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => poll()); // gọi không tham số: poll(once) chỉ dành cho lần hỏi lẻ
})();
</script>
