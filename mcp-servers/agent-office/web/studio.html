<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AAF Studio — Kanban đa repo &amp; Tài khoản</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233567D6' stroke-width='2'%3E%3Cpath d='M12 3 3.5 7.5v9L12 21l8.5-4.5v-9L12 3Z'/%3E%3C/svg%3E" />
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("agent-office-theme"); } catch (err) { console.warn("Không đọc được giao diện đã lưu:", err); }
      var dark = saved ? saved === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <style>
    /* ==================== SEMANTIC DESIGN TOKENS (LIGHT + DARK + TELEGRAM) ====================
       Unified visual language with /cc-switcher & Xưởng agent (index.html), 100% self-contained
       for both Mac local (:4317) and Telegram Mini App (:4318) strict CSP. */
    :root {
      color-scheme: light;
      --bg: #E4E9EF;
      --floor: #EEF1F5;
      --floor2: #DFE5EE;
      --panel: rgba(250, 251, 253, 0.94);
      --sidebar: #F2F5F9;
      --card: #FFFFFF;
      --subtle: #EDF1F7;
      --hover: rgba(23, 32, 46, 0.045);
      --border: #CDD4DE;
      --border-strong: #B4BFCE;
      --fg: #17202E;
      --fg-muted: #556072;
      --fg-faint: #6B7484;
      --code: #1E293B;
      --shadow: 0 8px 28px rgba(20, 32, 52, 0.09);
      --shadow-sm: 0 2px 8px rgba(20, 32, 52, 0.06);

      --c-primary: #3567D6;
      --t-primary: #254DB0;
      --fg-on-primary: #FFFFFF;
      --c-success: #4C9744;
      --t-success: #266422;
      --c-warn: #E58D0B;
      --t-warn: #8F5200;
      --c-err: #D63E2C;
      --t-err: #AD291A;
      --c-review: #0E9A8A;
      --t-review: #06705F;
      --c-qa: #7C3AED;
      --t-qa: #5B21B6;
      --c-away: #8F99A8;

      --tint-primary: rgba(53, 103, 214, 0.10);
      --tint-primary-b: rgba(53, 103, 214, 0.30);
      --tint-success: rgba(76, 151, 68, 0.13);
      --tint-success-b: rgba(76, 151, 68, 0.32);
      --tint-warn: rgba(229, 141, 11, 0.13);
      --tint-warn-b: rgba(229, 141, 11, 0.34);
      --tint-err: rgba(214, 62, 44, 0.11);
      --tint-err-b: rgba(214, 62, 44, 0.34);
      --tint-review: rgba(14, 154, 138, 0.12);
      --tint-review-b: rgba(14, 154, 138, 0.32);
      --tint-qa: rgba(124, 58, 237, 0.11);
      --tint-qa-b: rgba(124, 58, 237, 0.30);

      --repo-0: #2563EB;
      --repo-1: #0D9488;
      --repo-2: #D97706;
      --repo-3: #DB2777;
      --repo-4: #4F46E5;
      --repo-5: #0284C7;

      --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-display: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --app-h: 100dvh;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0D1218;
      --floor: #151C25;
      --floor2: #1E2734;
      --panel: rgba(19, 25, 33, 0.94);
      --sidebar: #131922;
      --card: #1A222D;
      --subtle: #202937;
      --hover: rgba(230, 235, 242, 0.055);
      --border: #2B3543;
      --border-strong: #3C495C;
      --fg: #E6EBF2;
      --fg-muted: #9AA5B5;
      --fg-faint: #8490A1;
      --code: #E2E8F0;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.30);

      --c-primary: #5B8BF2;
      --t-primary: #8DB2FA;
      --fg-on-primary: #FFFFFF;
      --c-success: #69B35E;
      --t-success: #86CF7B;
      --c-warn: #F3A63A;
      --t-warn: #F8BD63;
      --c-err: #F05A47;
      --t-err: #F7887A;
      --c-review: #26B6A3;
      --t-review: #4ED2C0;
      --c-qa: #A27EFB;
      --t-qa: #C1A7FD;
      --c-away: #586375;

      --tint-primary: rgba(91, 139, 242, 0.14);
      --tint-primary-b: rgba(91, 139, 242, 0.36);
      --tint-success: rgba(105, 179, 94, 0.14);
      --tint-success-b: rgba(105, 179, 94, 0.34);
      --tint-warn: rgba(243, 166, 58, 0.14);
      --tint-warn-b: rgba(243, 166, 58, 0.36);
      --tint-err: rgba(240, 90, 71, 0.14);
      --tint-err-b: rgba(240, 90, 71, 0.36);
      --tint-review: rgba(38, 182, 163, 0.14);
      --tint-review-b: rgba(38, 182, 163, 0.36);
      --tint-qa: rgba(162, 126, 251, 0.14);
      --tint-qa-b: rgba(162, 126, 251, 0.34);

      --repo-0: #60A5FA;
      --repo-1: #2DD4BF;
      --repo-2: #FBBF24;
      --repo-3: #F472B6;
      --repo-4: #818CF8;
      --repo-5: #38BDF8;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select, a { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--c-primary);
      outline-offset: 2px;
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .hidden { display: none !important; }
    .tnum { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); }
    .muted { color: var(--fg-muted); }
    .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .row-gap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Buttons (44px min touch targets) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: transform 130ms ease, border-color 140ms ease, background-color 140ms ease, opacity 140ms ease;
    }
    .btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--floor); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn-primary {
      background: var(--c-primary);
      border-color: var(--c-primary);
      color: var(--fg-on-primary);
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; background: var(--c-primary); border-color: var(--c-primary); }
    .btn-danger {
      background: var(--tint-err);
      border-color: var(--tint-err-b);
      color: var(--t-err);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(214, 62, 44, 0.18); border-color: var(--c-err); }
    .btn-danger-solid {
      background: var(--c-err);
      border-color: var(--c-err);
      color: #FFFFFF;
      font-weight: 600;
    }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-ghost:hover:not(:disabled) { background: var(--hover); border-color: transparent; }
    .btn-sm { min-height: 44px; padding: 6px 11px; font-size: 12.5px; }
    .btn-full { width: 100%; }

    /* Chips & Badges */
    .chip, .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      background: var(--subtle);
      color: var(--fg-muted);
      white-space: nowrap;
    }
    .chip-primary, .b-primary { background: var(--tint-primary); border-color: var(--tint-primary-b); color: var(--t-primary); }
    .chip-success, .b-active { background: var(--tint-success); border-color: var(--tint-success-b); color: var(--t-success); }
    .chip-warn, .b-fallback { background: var(--tint-warn); border-color: var(--tint-warn-b); color: var(--t-warn); }
    .chip-err, .b-frozen { background: var(--tint-err); border-color: var(--tint-err-b); color: var(--t-err); }
    .chip-review, .b-parallel { background: var(--tint-review); border-color: var(--tint-review-b); color: var(--t-review); }
    .chip-qa, .b-prio { background: var(--tint-qa); border-color: var(--tint-qa-b); color: var(--t-qa); }
    .b-ready { background: var(--floor2); color: var(--fg-muted); }
    .b-group { background: var(--floor2); color: var(--fg-muted); font-weight: 500; font-size: 11.5px; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-success); flex: none; display: inline-block; }
    .dot.warn { background: var(--c-warn); }
    .dot.err { background: var(--c-err); }
    .dot.off { background: var(--c-away); }
    .dot.live { animation: livepulse 1.5s ease-in-out infinite; }
    @keyframes livepulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.88); } }

    /* Shell */
    .app-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      height: var(--app-h);
      width: 100%;
      overflow: hidden;
    }

    /* Sticky Frosted Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 60px;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 15;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .back-office {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 8px;
      font-size: 12.5px;
      color: var(--fg-muted);
      text-decoration: none;
      border-radius: 8px;
    }
    .back-office:hover { color: var(--fg); background: var(--hover); }

    .nav-tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 12px;
      background: var(--floor2);
      border: 1px solid var(--border);
    }
    .nav-tab {
      min-height: 44px;
      min-width: 44px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-muted);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .nav-tab:hover { color: var(--fg); }
    .nav-tab[aria-selected="true"] {
      background: var(--card);
      border-color: var(--border);
      color: var(--fg);
      box-shadow: var(--shadow-sm);
    }
    .nav-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--floor2);
      color: var(--fg-muted);
    }
    .nav-count.alert { background: var(--c-err); color: #fff; }
    .nav-count.live { background: var(--tint-success); color: var(--t-success); }

    /* Active Account Pill in Topbar */
    .acc-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 4px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 12.5px;
      max-width: 290px;
    }
    .acc-pill:hover { border-color: var(--c-primary); }
    .acc-pill-name { font-weight: 600; color: var(--fg); }
    .acc-pill-quota { color: var(--fg-muted); font-size: 12px; }

    /* Stale / Warning Banners */
    .stale-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: var(--tint-warn);
      border-bottom: 1px solid var(--tint-warn-b);
      color: var(--t-warn);
      font-size: 13px;
      flex-shrink: 0;
    }
    .stale-banner.err {
      background: var(--tint-err);
      border-color: var(--tint-err-b);
      color: var(--t-err);
    }

    /* Form Fields */
    .field {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 14px;
    }
    .field.dirty { border-color: var(--c-primary); box-shadow: 0 0 0 1px var(--c-primary) inset; }
    textarea.field { min-height: 88px; resize: vertical; line-height: 1.5; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-muted);
      margin-bottom: 5px;
    }
    .field-err { margin: 6px 0 0; font-size: 12.5px; color: var(--t-err); font-weight: 500; }

    /* ==================== PAGE 1: WORKSPACE (KANBAN-FIRST + DRAWER) ==================== */
    .work-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .work-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .work-search { flex: 1 1 210px; max-width: 300px; }
    .work-repo-sel { width: auto; min-width: 165px; max-width: 240px; }
    .seg-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .seg-toggle button {
      border: 0;
      background: transparent;
      min-height: 44px;
      min-width: 44px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 500;
      color: var(--fg-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .seg-toggle button + button { border-left: 1px solid var(--border); }
    .seg-toggle button[aria-pressed="true"] {
      background: var(--c-primary);
      color: var(--fg-on-primary);
      font-weight: 600;
    }

    /* 6-Stage Workflow Pipeline KPI Strip */
    .work-kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 14px 4px;
      flex-shrink: 0;
    }
    .wkpi {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-align: left;
      transition: border-color 140ms ease, transform 120ms ease;
    }
    .wkpi:hover { border-color: var(--border-strong); }
    .wkpi[aria-pressed="true"] { border-color: var(--c-primary); box-shadow: 0 0 0 1px var(--c-primary) inset; }
    .wkpi-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .wkpi-sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
    .wkpi-lbl { font-size: 13px; font-weight: 700; color: var(--fg); line-height: 1.2; }
    .wkpi-sub { font-size: 11px; color: var(--fg-muted); line-height: 1.2; margin-top: 2px; }
    .wkpi-val { font-family: var(--font-display); font-size: 19px; font-weight: 700; flex: none; }

    /* /btw inline drawer */
    .btw-box {
      margin: 10px 14px 0;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--tint-primary-b);
      background: var(--card);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    /* Main Work Area: 6-Column Kanban / List + Optional Slide-Over Detail Drawer */
    .work-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .work-canvas {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 10px 14px 18px;
    }

    /* 6-Column Workflow Kanban Board */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(var(--col-n, 6), minmax(194px, 1fr));
      align-items: start;
      gap: 10px;
      min-height: 100%;
      width: 100%;
    }
    .kanban-board.single-col {
      grid-template-columns: minmax(280px, 520px);
    }
    .kanban-col {
      min-width: 0;
      display: flex;
      flex-direction: column;
      max-height: calc(var(--app-h) - 204px);
      background: var(--floor);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .kanban-col-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 11px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      border-top: 3px solid var(--col-accent, var(--border-strong));
      flex-shrink: 0;
    }
    .kanban-col-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      min-width: 0;
    }
    .kanban-col-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--fg-muted);
    }
    .kanban-col-sw { width: 9px; height: 9px; border-radius: 3px; background: var(--col-accent, var(--c-away)); flex: none; }
    .kanban-col-count {
      font-size: 11.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--floor2);
      color: var(--fg-muted);
      flex: none;
    }
    .kanban-col-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kanban-empty {
      padding: 18px 10px;
      text-align: center;
      color: var(--fg-muted);
      font-size: 12px;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      background: var(--hover);
    }

    /* Kanban Card */
    .k-card {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 120ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }
    .k-card:hover { border-color: var(--c-primary); transform: translateY(-1px); }
    .k-card.active {
      border-color: var(--c-primary);
      box-shadow: 0 0 0 2px var(--tint-primary-b), var(--shadow-sm);
    }
    .k-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
    }
    .k-card-repo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-weight: 600;
      color: var(--fg-muted);
    }
    .repo-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
    .k-card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--fg);
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .k-card-desc {
      font-size: 12px;
      color: var(--fg-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .k-card-why {
      font-size: 12px;
      color: var(--t-err);
      background: var(--tint-err);
      border-left: 3px solid var(--c-err);
      padding: 5px 8px;
      border-radius: 0 7px 7px 0;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .k-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--floor2);
      font-size: 11.5px;
      color: var(--fg-muted);
    }
    .k-card-meta { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .k-card-quick {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    /* List View (alternative to Kanban) */
    .list-view {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .list-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .list-group-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--floor);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }
    .task-row {
      width: 100%;
      min-height: 58px;
      padding: 11px 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) auto auto;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: var(--hover); }
    .task-row.active { background: var(--tint-primary); box-shadow: inset 3px 0 0 0 var(--c-primary); }

    /* Slide-Over / Docked Detail Drawer */
    .detail-drawer {
      width: min(560px, 46vw);
      min-width: 390px;
      background: var(--card);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 28px rgba(20, 32, 52, 0.10);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex-shrink: 0;
      z-index: 8;
    }
    .detail-drawer.closed { display: none; }
    .drawer-hero {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .task-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .meta-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 12px;
      color: var(--fg-muted);
    }
    .inspector-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .itab {
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--fg-muted);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .itab[aria-selected="true"] { border-bottom-color: var(--c-primary); color: var(--fg); }
    .drawer-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px; }
    .drawer-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Timeline & Structured Spec */
    .timeline-item {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 18px;
      bottom: -8px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot {
      position: absolute;
      left: 2px;
      top: 16px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: 2px solid var(--border-strong);
      background: var(--card);
    }
    .timeline-dot.live { border-color: var(--c-success); background: var(--c-success); }
    .timeline-btn {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--floor);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
    }
    .timeline-btn:hover { border-color: var(--border-strong); }
    .timeline-out {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--floor);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--code);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .spec-card {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--floor);
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .accept-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .accept-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
    }
    .accept-ic { color: var(--c-success); font-weight: 700; flex: none; }

    /* Diff Viewer */
    .diff-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--floor);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
    }
    .diff-table { width: 100%; border-collapse: collapse; }
    .diff-table td { padding: 2px 8px; vertical-align: top; }
    .diff-ln {
      width: 38px;
      text-align: right;
      color: var(--fg-muted);
      border-right: 1px solid var(--border);
      user-select: none;
    }
    .diff-code { white-space: pre; }
    .diff-wrap .diff-code { white-space: pre-wrap; word-break: break-word; }
    .diff-add { background: var(--tint-success); color: var(--t-success); }
    .diff-del { background: var(--tint-err); color: var(--t-err); }
    .diff-hdr { background: var(--tint-primary); color: var(--t-primary); font-weight: 600; }

    /* ==================== PAGE 2: ACCOUNTS (100% CC-SWITCHER PARITY) ==================== */
    .accounts-page {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px 48px;
    }
    .accounts-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .acc-sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 10px;
    }
    .acc-sec-head h3 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 700;
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .acc-sec-head small { color: var(--fg-muted); font-weight: 400; font-size: 12.5px; }

    .grid { display: grid; gap: 12px; }
    .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1023px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .g4, .g2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      min-width: 0;
      box-shadow: var(--shadow-sm);
    }
    .card.active {
      border-color: var(--c-success);
      box-shadow: 0 0 0 1px var(--c-success) inset, var(--shadow-sm);
    }
    .card.frozen { border-color: var(--tint-err-b); }

    .kpi .label { color: var(--fg-muted); font-size: 12.5px; }
    .kpi .value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .kpi .sub { color: var(--fg-muted); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }

    /* Account Cards (equal height blocks like /cc-switcher) */
    .acc-card { display: flex; flex-direction: column; }
    .acc-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .acc-head-info { order: 2; flex: 1 1 100%; min-width: 0; }
    .acc-head-badges { order: 1; display: inline-flex; gap: 5px; flex-wrap: wrap; }
    .acc-name { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
    .acc-mail { color: var(--fg-muted); font-size: 12.5px; overflow-wrap: anywhere; margin-top: 2px; }
    .claude-grid .acc-mail { min-height: 2.8em; }
    .acc-note { min-height: calc(2 * 3.7em + 12px); margin-top: 12px; color: var(--t-warn); font-size: 12.5px; line-height: 1.45; }

    .meter { margin-top: 12px; }
    .meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--fg-muted); }
    .meter .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
    .meter .sub { font-size: 12px; color: var(--fg-muted); min-height: 1.45em; font-variant-numeric: tabular-nums; }
    .bar { height: 8px; border-radius: 999px; background: var(--floor2); overflow: hidden; margin-top: 4px; }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c-success); transition: width 0.35s ease; }
    .bar > i.mid { background: var(--c-warn); }
    .bar > i.low { background: var(--c-err); }

    .facts {
      margin: 12px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 12.5px;
    }
    .facts dt { color: var(--fg-muted); }
    .facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .facts dd.two { white-space: pre-line; min-height: 2.8em; }
    .acc-actions { margin-top: auto; padding-top: 12px; display: flex; gap: 8px; }
    .acc-actions .btn { flex: 1; }

    /* Quick Actions & Cooldown */
    .cd-seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .cd-seg button {
      border: 0;
      background: transparent;
      padding: 7px 12px;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      font-size: 13px;
    }
    .cd-seg button + button { border-left: 1px solid var(--border); }
    .cd-seg button[aria-pressed="true"] { background: var(--c-primary); color: #fff; font-weight: 600; }
    .cd-custom { display: inline-flex; gap: 8px; align-items: center; }
    .cd-custom input { width: 102px; min-height: 44px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }

    /* Repo <-> Account Summary + Table + Add Form */
    ul.repos-mini { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    ul.repos-mini li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 7px 10px;
      background: var(--floor);
      border-radius: 10px;
      font-size: 12.5px;
    }
    .tag { font-size: 11.5px; color: var(--fg-muted); }
    .tag.warn { color: var(--t-warn); font-weight: 600; }

    .tablewrap { overflow-x: auto; }
    table.cc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.cc-table th, table.cc-table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.cc-table th { color: var(--fg-muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    table.cc-table tr:last-child td { border-bottom: 0; }
    table.cc-table tr.differs td { background: var(--tint-warn); }
    .rp-name { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .rp-path { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); overflow-wrap: anywhere; max-width: 340px; margin-top: 2px; }
    .rp-note { font-size: 12px; color: var(--t-warn); margin-top: 4px; max-width: 300px; }
    .rp-note.muted { color: var(--fg-muted); }
    .rp-assign { display: flex; gap: 8px; align-items: center; }
    .rp-assign select { min-width: 165px; width: auto; }

    .addform {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) minmax(140px, 1fr) minmax(150px, auto) auto;
      gap: 10px;
      align-items: end;
      margin-top: 12px;
    }
    @media (max-width: 820px) { .addform { grid-template-columns: 1fr; } }

    .warn-box {
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--tint-warn-b);
      background: var(--tint-warn);
      color: var(--t-warn);
      font-size: 13px;
    }

    /* Mobile Bottom Nav + Safe Area */
    .mob-bottom-nav {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      background: var(--panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mob-nav-btn {
      min-height: 48px;
      min-width: 44px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--fg-muted);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .mob-nav-btn[aria-current="page"] { color: var(--t-primary); font-weight: 700; }

    /* Native <dialog> Modal */
    dialog {
      width: min(520px, calc(100vw - 24px));
      max-height: 88dvh;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--fg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    dialog::backdrop { background: rgba(10, 14, 24, 0.55); backdrop-filter: blur(2px); }
    .dlg-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
    }
    .dlg-title { margin: 0; font-size: 15.5px; font-weight: 700; }
    .dlg-body { padding: 16px; overflow-y: auto; max-height: 72dvh; display: flex; flex-direction: column; gap: 14px; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--fg);
      color: var(--card);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 60;
      max-width: min(560px, calc(100vw - 32px));
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skel { border-radius: 14px; background: var(--floor2); animation: pulse 1.3s ease-in-out infinite; }
    .spin { animation: spin 0.8s linear infinite; }

    /* ==================== RESPONSIVE MOBILE (< 1024px — 390px Telegram Mini App / PWA) ==================== */
    @media (max-width: 1023px) {
      .desktop-only { display: none !important; }
      .field, input, textarea, select { font-size: 16px !important; }
      .work-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 12px 2px; gap: 8px; }
      .work-toolbar { padding: 10px 12px; }
      .work-canvas { padding: 10px 12px 16px; }
      .kanban-col { min-width: 286px; max-height: calc(var(--app-h) - 270px); }
      .detail-drawer {
        position: absolute;
        inset: 0;
        width: 100%;
        min-width: 0;
        border-left: 0;
      }
      .app-shell[data-mob-view="list"] .detail-drawer { display: none; }
      .app-shell[data-mob-view="detail"] .work-toolbar,
      .app-shell[data-mob-view="detail"] .work-kpis,
      .app-shell[data-mob-view="detail"] .work-canvas { display: none; }
      .mob-bottom-nav { display: grid; }
      .app-shell.ime-open .mob-bottom-nav { display: none !important; }
      .diff-old-col { display: none; }
      .accounts-page { padding: 12px 12px 28px; }
      .task-row { grid-template-columns: 1fr; gap: 6px; }
    }
    @media (max-width: 640px) {
      .work-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .mobile-only { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skel, .spin, .dot.live { animation: none !important; }
      .btn, .toast, .k-card, .bar > i { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell" data-mob-view="list">
    <!-- ==================== TOP HEADER ==================== -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btnMobBack" class="btn btn-ghost mobile-only hidden" data-act="mob-back" aria-label="Quay lại bảng công việc">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span>Quay lại</span>
        </button>
        <div id="brandWrap" class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2" aria-hidden="true">
            <path d="M12 3 3.5 7.5v9L12 21l8.5-4.5v-9L12 3Z"/>
            <path d="M12 12 20.5 7.5M12 12v9M12 12 3.5 7.5"/>
          </svg>
          <span>AAF Studio</span>
        </div>
        <a id="linkOffice" class="back-office desktop-only" href="/" title="Mở Xưởng 3D Agent Office">← Xưởng 3D</a>

        <nav class="nav-tabs desktop-only" role="tablist" aria-label="Điều hướng chính">
          <button id="navWork" class="nav-tab" role="tab" aria-selected="true" aria-controls="panelWork" data-act="page" data-page="work">
            <span>Công việc</span>
            <span id="navWorkBadge" class="nav-count tnum hidden">0</span>
          </button>
          <button id="navAccounts" class="nav-tab" role="tab" aria-selected="false" aria-controls="panelAccounts" data-act="page" data-page="accounts">
            <span>Tài khoản</span>
            <span id="navAccDot" class="dot off"></span>
          </button>
        </nav>
      </div>

      <div class="topbar-right">
        <button id="topAccPill" class="acc-pill desktop-only" data-act="page" data-page="accounts" title="Xem chi tiết quota 5 giờ & 7 ngày">
          <span id="topAccDot" class="dot off"></span>
          <span id="topAccName" class="acc-pill-name trunc">Đang tải tài khoản…</span>
          <span id="topAccQuota" class="acc-pill-quota tnum"></span>
        </button>
        <span id="connChip" class="chip chip-success tnum">Mac Online</span>
        <span id="slotChip" class="chip tnum desktop-only">Slots 0/3</span>
        <button id="btnAutoRun" class="btn desktop-only" data-act="toggle-autorun" aria-pressed="false">Tự chạy: TẮT</button>
        <button id="btnTheme" class="btn btn-ghost" data-act="toggle-theme" aria-label="Đổi giao diện Sáng / Tối">Ca đêm</button>
      </div>
    </header>

    <!-- Stale / Offline Banner (> 15s) -->
    <div id="staleBanner" class="stale-banner hidden" role="alert">
      <span id="staleText">Dữ liệu cũ hơn 15 giây</span>
      <button class="btn" data-act="refresh-now">Làm mới</button>
    </div>

    <!-- ==================== PAGE 1: WORKSPACE (KANBAN-FIRST + DRAWER) ==================== -->
    <div id="panelWork" class="work-shell" role="tabpanel">
      <!-- Compact Toolbar -->
      <div class="work-toolbar">
        <button class="btn btn-primary" data-act="open-add">+ Tạo task</button>
        <button class="btn" data-act="toggle-btw">/btw Hỏi nhanh</button>
        <input id="searchInput" class="field work-search" type="search" placeholder="Tìm task, ID, repo, nhánh… (⌘K)" autocomplete="off" aria-label="Tìm task hoặc repo" />
        <select id="repoFilter" class="field work-repo-sel" aria-label="Lọc theo repo">
          <option value="all">Tất cả repo</option>
        </select>
        <button id="btnToggleCancelled" class="btn" data-act="toggle-cancelled" aria-pressed="false">Hiện Đã huỷ (0)</button>
        <div class="seg-toggle desktop-only" role="group" aria-label="Chế độ xem" style="margin-left:auto;">
          <button type="button" id="btnViewKanban" data-act="view-mode" data-view="kanban" aria-pressed="true">Kanban</button>
          <button type="button" id="btnViewList" data-act="view-mode" data-view="list" aria-pressed="false">Danh sách</button>
        </div>
