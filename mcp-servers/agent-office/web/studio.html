  <!-- Always-mounted live region for VoiceOver / Screen Reader announcements -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      /* ==================== STATE & PERSISTENT DRAFTS ==================== */
      const state = {
        page: "work",          // work | accounts | ask (mobile)
        mobView: "list",       // list | detail
        mobSub: "stream",      // stream | diff | plan | proof
        mobAskMode: "add",     // add | btw
        rtab: "diff",          // diff | plan | proof
        filterSt: "all",
        search: "",
        diffWrap: false,
        studio: null,
        detail: null,
        accounts: null,
        selectedId: "",
        expandedSteps: new Set(),
        drafts: new Map(),     // Preserves typed text across polling updates
        lastSyncedMs: 0,
        lastError: "",
        loadingStudio: true,
        loadingAccounts: false,
        inFlightStudio: null,
        sessionToken: "",
        pinnedBottom: true,
        pendingRepoAssign: new Map(), // Explicit Save + Confirm (never instant onchange write)
        reworkOpen: false,
        stopConfirmRun: "",
        lastFocused: null,
      };

      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));

      /* ==================== THEME + TELEGRAM WEBAPP BRIDGE ==================== */
      function applyTheme(mode) {
        const dark = mode === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("agent-office-theme", dark ? "dark" : "light");
        } catch (err) {
          console.warn("theme storage unavailable:", err);
        }
      }

      function initThemeAndTelegram() {
        let saved = "";
        try {
          saved = localStorage.getItem("agent-office-theme") || "";
        } catch (err) {
          console.warn("read theme failed:", err);
        }
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          try {
            tg.ready();
            tg.expand();
            applyTelegramTheme(tg);
            tg.onEvent("themeChanged", () => applyTelegramTheme(tg));
            tg.onEvent("viewportChanged", syncViewportHeight);
            if (tg.BackButton) {
              tg.BackButton.onClick(() => {
                if ($("mainDialog").open) { closeDialog(); return; }
                if (state.mobView === "detail") {
                  state.mobView = "list";
                  syncMobileShell();
                }
              });
            }
          } catch (err) {
            console.warn("Telegram WebApp init warning:", err);
          }
        } else if (saved === "dark" || saved === "light") {
          applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          applyTheme("dark");
        }
      }

      function applyTelegramTheme(tg) {
        if (!tg) return;
        applyTheme(tg.colorScheme === "dark" ? "dark" : "light");
        const tp = tg.themeParams || {};
        const root = document.documentElement.style;
        if (tp.bg_color) root.setProperty("--bg", tp.bg_color);
        if (tp.secondary_bg_color) root.setProperty("--sidebar", tp.secondary_bg_color);
        if (tp.text_color) root.setProperty("--fg", tp.text_color);
        if (tp.hint_color) root.setProperty("--fg-muted", tp.hint_color);
        if (tp.button_color) root.setProperty("--c-primary", tp.button_color);
        if (tp.button_text_color) root.setProperty("--fg-on-primary", tp.button_text_color);
      }

      function syncViewportHeight() {
        const vv = window.visualViewport;
        const tg = window.Telegram && window.Telegram.WebApp;
        const h = (vv && vv.height) || (tg && tg.viewportStableHeight) || window.innerHeight;
        document.documentElement.style.setProperty("--app-h", `${Math.round(h)}px`);
        const imeOpen = vv ? (window.innerHeight - vv.height > 120) : false;
        $("app").classList.toggle("ime-open", imeOpen);
      }

      /* ==================== CENTRALIZED AUTH & FETCH ==================== */
      let _toastTimer = null;
      function showToast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
      }

      async function ensureRemoteSession() {
        if (state.sessionToken) return;
        const tg = window.Telegram && window.Telegram.WebApp;
        const initData = tg && tg.initData ? tg.initData : "";
        if (!initData) return;
        try {
          const resp = await fetch("/api/aaf/auth", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-AAF-Studio": "1",
              "X-Telegram-Init-Data": initData,
            },
            body: "{}",
            signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
          });
          if (resp.ok) {
            const d = await resp.json();
            if (d && d.sessionToken) state.sessionToken = d.sessionToken;
          }
        } catch (err) {
          console.warn("Telegram session exchange skipped:", err);
        }
      }

      async function apiFetch(url, opts = {}) {
        const method = (opts.method || "GET").toUpperCase();
        const headers = Object.assign({
          "X-AAF-Studio": "1",
          "X-Agent-Office": "1",
        }, opts.headers || {});
        const tg = window.Telegram && window.Telegram.WebApp;
        if (state.sessionToken) {
          headers["X-AAF-Session"] = state.sessionToken;
        } else if (tg && tg.initData) {
          headers["X-Telegram-Init-Data"] = tg.initData;
        }
        const fetchOpts = {
          method,
          headers,
          signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
        };
        if (method !== "GET" && opts.body !== undefined) {
          headers["Content-Type"] = "application/json";
          fetchOpts.body = typeof opts.body === "string" ? opts.body : JSON.stringify(opts.body);
        }
        const res = await fetch(url, fetchOpts);
        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch (err) {
          console.warn("Non-JSON response:", err);
          data = { ok: false, error: text.slice(0, 200) || `HTTP ${res.status}` };
        }
        if (!res.ok) {
          const e = new Error(data.error || `HTTP ${res.status}`);
          e.status = res.status;
          e.data = data;
          throw e;
        }
        return data;
      }

      /* Real async debounce guard (ui-ux-pro-max #2: immediate lock + >= 1000ms floor) */
      async function runLockedButton(btn, fn) {
        if (!btn || btn.disabled) return;
        const origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.setAttribute("aria-busy", "true");
        btn.innerHTML = `<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg><span>Đang xử lý...</span>`;
        try {
          await Promise.all([Promise.resolve().then(fn), sleep(1000)]);
        } finally {
          btn.disabled = false;
          btn.removeAttribute("aria-busy");
          btn.innerHTML = origHtml;
        }
      }

      async function copyText(txt, okMsg) {
        if (!txt) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(txt);
            showToast(okMsg || "Đã copy");
            return;
          }
        } catch (err) {
          console.warn("clipboard API fallback:", err);
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = txt;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(ok ? (okMsg || "Đã copy") : "Không thể copy tự động");
        } catch (err) {
          console.warn("execCommand copy failed:", err);
          showToast("Không thể copy — hãy bôi đen copy thủ công");
        }
      }

      /* ==================== STATUS GLYPHS (NEVER COLOR ALONE) ==================== */
      function statusChipHtml(st) {
        const map = {
          blocked: ["chip-err", "Bị chặn", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`],
          review: ["chip-warn", "Cần duyệt", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`],
          running: ["chip-primary", "Đang chạy", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="14 6"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>`],
          gating: ["chip-warn", "QA Gate", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>`],
          done: ["chip-success", "Hoàn tất", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>`],
          cancelled: ["", "Đã huỷ", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>`],
          ready: ["", "Chờ slot", `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`],
        };
        const [cls, lbl, ic] = map[st] || ["", st || "Chờ slot", map.ready[2]];
        return `<span class="chip ${cls}">${ic}<span>${lbl}</span></span>`;
      }

      function repoColor(repoId) {
        const list = (state.studio && state.studio.repos) || [];
        const idx = Math.max(0, list.findIndex(r => r.id === repoId));
        return `var(--repo-${idx % 6})`;
      }

      /* ==================== DATA LOADING & POLLING ==================== */
      async function loadStudio(silent = false) {
        if (state.inFlightStudio) return state.inFlightStudio;
        if (!silent) {
          state.loadingStudio = true;
          renderRail();
        }
        state.inFlightStudio = (async () => {
          try {
            await ensureRemoteSession();
            const data = await apiFetch("/api/aaf/studio");
            state.studio = data;
            state.lastSyncedMs = Date.now();
            state.lastError = "";
            state.loadingStudio = false;
            const tasks = data.tasks || [];
            if (!state.selectedId || !tasks.some(t => t.id === state.selectedId)) {
              state.selectedId = (data.attention && data.attention[0] && data.attention[0].id) || (tasks[0] && tasks[0].id) || "";
            }
            populateRepoSelects();
            renderHeader();
            renderRail();
            if (state.selectedId) {
              await loadTaskDetail(state.selectedId, true);
            } else {
              state.detail = null;
              renderCenterAndRight();
            }
          } catch (err) {
            console.warn("loadStudio error:", err);
            state.lastError = err.message || "Không kết nối được AAF Hub";
            state.loadingStudio = false;
            renderHeader();
            if (!state.studio) renderRail();
          } finally {
            state.inFlightStudio = null;
          }
        })();
        return state.inFlightStudio;
      }

      async function loadTaskDetail(taskId, silent = false) {
        if (!taskId || taskId.startsWith("manual-")) {
          const manual = ((state.studio && state.studio.tasks) || []).find(t => t.id === taskId) || null;
          state.detail = manual ? { ok: true, task: manual, stream: { events: [] }, diff: { available: false, reason: "Phiên mở tay Terminal (chỉ đọc)" }, handover: { available: false }, proof: { available: false, images: [] } } : null;
          renderCenterAndRight();
          return;
        }
        try {
          const det = await apiFetch(`/api/aaf/task/detail?id=${encodeURIComponent(taskId)}`);
          if (state.selectedId === taskId) {
            state.detail = det;
            renderCenterAndRight();
          }
        } catch (err) {
          console.warn("loadTaskDetail error:", err);
          if (!silent) showToast(`Không tải được chi tiết ${taskId}: ${err.message}`);
        }
      }

      async function loadAccounts(refresh = false) {
        state.loadingAccounts = true;
        renderAccounts();
        try {
          await ensureRemoteSession();
          const url = refresh ? "/api/aaf/accounts?refresh=1" : "/api/aaf/accounts";
          state.accounts = await apiFetch(url);
        } catch (err) {
          console.warn("loadAccounts error:", err);
          state.accounts = { ok: false, error: err.message };
        } finally {
          state.loadingAccounts = false;
          renderAccounts();
        }
      }

      /* ==================== RENDER: HEADER & STALE CHECK ==================== */
      function renderHeader() {
        const s = state.studio;
        const conn = $("connChip");
        const stale = $("staleBanner");
        const ageSec = state.lastSyncedMs ? Math.floor((Date.now() - state.lastSyncedMs) / 1000) : 0;

        if (state.lastError) {
          conn.className = "chip chip-err tnum";
          conn.textContent = "Offline";
          stale.className = "stale-banner err";
          $("staleText").textContent = `Mất kết nối máy Mac: ${state.lastError}`;
        } else if (state.lastSyncedMs && ageSec > 15) {
          conn.className = "chip chip-warn tnum";
          conn.textContent = `Cũ ${ageSec}s`;
          stale.className = "stale-banner";
          $("staleText").textContent = `Dữ liệu chưa cập nhật ${ageSec} giây trước`;
        } else {
          conn.className = "chip chip-success tnum";
          conn.textContent = "Mac Online";
          stale.className = "stale-banner hidden";
        }

        if (s && s.summary) {
          $("slotChip").textContent = `Slots ${s.summary.slotsHeld}/${s.summary.slotsMax}`;
          const ar = $("btnAutoRun");
          const on = Boolean(s.summary.autoRunEnabled);
          ar.setAttribute("aria-pressed", String(on));
          ar.textContent = on ? "Tự chạy: BẬT" : "Tự chạy: TẮT";
        }
      }

      function populateRepoSelects() {
        const repos = (state.studio && state.studio.repos) || [];
        const sel = $("btwRepo");
        if (!sel || !repos.length) return;
        const prev = sel.value;
        sel.innerHTML = repos.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
        if (prev && repos.some(r => r.id === prev)) sel.value = prev;
      }

      /* ==================== RENDER: LEFT RAIL (4 MANDATORY STATES) ==================== */
      function renderRail() {
        const body = $("railBody");
        if (state.loadingStudio && !state.studio) {
          body.innerHTML = `<div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
            <div class="skel" style="height:54px"></div>
            <div class="skel" style="height:54px"></div>
            <div class="skel" style="height:54px"></div>
            <div class="skel" style="height:54px"></div>
          </div>`;
          return;
        }
        if (state.lastError && !state.studio) {
          body.innerHTML = `<div style="padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <strong>Không kết nối được AAF Hub</strong>
            <span class="muted">${esc(state.lastError)}</span>
            <button class="btn btn-primary" data-act="refresh-now">Thử kết nối lại</button>
          </div>`;
          return;
        }

        const tasks = (state.studio && state.studio.tasks) || [];
        const attention = (state.studio && state.studio.attention) || [];
        if (!tasks.length) {
          body.innerHTML = `<div style="padding:32px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <strong>Chưa có task nào trên 6 repo</strong>
            <span class="muted">Hàng đợi aaf.db đang trống. Giao việc đầu tiên hoặc dùng /btw để hỏi nhanh codebase.</span>
            <button class="btn btn-primary" data-act="open-add">Tạo task đầu tiên</button>
          </div>`;
          return;
        }

        const q = state.search.trim().toLowerCase();
        const match = t => {
          if (state.filterSt === "urgent" && !(t.state === "blocked" || t.state === "review" || t.frozen)) return false;
          if (state.filterSt !== "all" && state.filterSt !== "urgent" && t.state !== state.filterSt) return false;
          if (q && !`${t.id} ${t.repo} ${t.title} ${t.branch}`.toLowerCase().includes(q)) return false;
          return true;
        };

        // Prevent duplicate double-highlight: pinned urgent tasks stay in Attention section only when filter === "all"
        const pinnedIds = new Set(state.filterSt === "all" && !q ? attention.map(a => a.id) : []);
        const attFiltered = state.filterSt === "all" && !q ? attention : [];
        const rest = tasks.filter(t => !pinnedIds.has(t.id) && match(t));

        let html = "";
        if (attFiltered.length) {
          html += `<div class="sec-hdr"><span>Cần xử lý ngay</span><span class="chip chip-err tnum">${attFiltered.length}</span></div>`;
          html += attFiltered.map(renderTaskRow).join("");
        }
        html += `<div class="sec-hdr"><span>Phiên theo dự án</span><span class="tnum">${rest.length}</span></div>`;
        html += rest.length
          ? rest.map(renderTaskRow).join("")
          : `<div style="padding:20px 14px;" class="muted">Không có task khớp bộ lọc.</div>`;

        body.innerHTML = html;
      }

      function renderTaskRow(t) {
        const active = t.id === state.selectedId ? " active" : "";
        return `<button class="task-row${active}" data-act="select-task" data-id="${esc(t.id)}">
          <span class="repo-dot" style="background:${repoColor(t.repo)}"></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
            <div class="row-gap" style="justify-content:space-between;flex-wrap:nowrap;">
              <span class="trunc" style="font-size:12px;color:var(--fg-muted);font-weight:500;">${esc(t.repo)} · <span class="mono">${esc(t.id)}</span></span>
              ${statusChipHtml(t.state)}
            </div>
            <div class="trunc" style="font-size:13px;font-weight:500;color:var(--fg);">${esc(t.title)}</div>
            <div class="trunc mono muted" style="font-size:12px;">
              ${esc(t.account || "auto")} · ${esc(t.elapsed || "—")}${t.kind === "manual" ? " · Manual" : ""}${t.parentLabel ? " · " + esc(t.parentLabel) : ""}
            </div>
          </div>
        </button>`;
      }

      /* ==================== RENDER: CENTER & RIGHT INSPECTOR ==================== */
      function renderCenterAndRight() {
        const tasks = (state.studio && state.studio.tasks) || [];
        const baseTask = tasks.find(t => t.id === state.selectedId) || null;
        const det = state.detail;
        const t = (det && det.task) ? Object.assign({}, baseTask || {}, det.task) : baseTask;

        if (!t) {
          $("taskHero").innerHTML = `<div class="muted">Chọn một task bên trái để xem diễn biến, Diff và Nghiệm thu.</div>`;
          $("streamBody").innerHTML = "";
          $("inspectorBody").innerHTML = "";
          $("inspectorFoot").innerHTML = "";
          return;
        }

        // 1. Task Hero (with copy ID/branch buttons)
        $("taskHero").innerHTML = `
          <div class="row-gap" style="justify-content:space-between;">
            <div class="row-gap" style="min-width:0;">
              <span class="repo-dot" style="background:${repoColor(t.repo)};margin-top:0;"></span>
              <strong style="font-size:13px;">${esc(t.repo)}</strong>
              <span class="muted">/</span>
              <span class="mono" style="font-size:12px;">${esc(t.id)}</span>
            </div>
            ${statusChipHtml(t.state)}
          </div>
          <h2 class="task-title">${esc(t.title)}</h2>
          <div class="meta-strip mono tnum">
            <span>Nhánh: ${esc(t.branch || "—")}</span>
            <span>Acc: ${esc(t.account || "auto")}</span>
            <span>${t.tokens ? Math.round(t.tokens / 1000) + "k tok" : "0 tok"}</span>
            <button class="btn btn-ghost" style="min-height:44px;padding:0 8px;font-size:12px;" data-act="copy-val" data-val="${esc(t.branch || t.id)}">Copy nhánh</button>
          </div>
          ${t.blockedReason ? `<div class="chip chip-err" style="white-space:normal;padding:8px 10px;">${esc(t.blockedReason)}</div>` : ""}
        `;

        // 2. Live Execution Stream (preserves scroll position unless pinned to bottom)
        const streamEl = $("streamScroll");
        const prevScroll = streamEl.scrollTop;
        const events = (det && det.stream && det.stream.events) || [];
        if (!events.length) {
          $("streamBody").innerHTML = `<div class="muted" style="padding:20px 0;">Chưa có log công cụ cho phiên này${t.contextNotes ? `<div class="timeline-out" style="margin-top:12px;">Ghi chú Steer:\n${esc(t.contextNotes)}</div>` : ""}.</div>`;
        } else {
          $("streamBody").innerHTML = events.map((ev, idx) => {
            const key = `${t.id}:${idx}`;
            const open = state.expandedSteps.has(key);
            const title = ev.title || ev.tool || ev.tool_name || (ev.type && ev.subtype ? `${ev.type}: ${ev.subtype}` : ev.type) || ev.kind || `Bước ${idx + 1}`;
            const dur = ev.dur || ev.duration_ms ? `${ev.dur || ev.duration_ms + "ms"}` : "";
            const out = ev.out || ev.output || ev.text || JSON.stringify(ev, null, 2);
            return `<div class="timeline-item">
              <span class="timeline-dot${idx === events.length - 1 && t.state === "running" ? " live" : ""}"></span>
              <button class="timeline-btn" aria-expanded="${open}" data-act="toggle-step" data-key="${esc(key)}">
                <span class="trunc" style="font-size:13px;font-weight:500;">${esc(title)}</span>
                <span class="mono muted tnum" style="font-size:12px;flex-shrink:0;">${esc(dur)} ${open ? "▾" : "▸"}</span>
              </button>
              ${open ? `<div class="timeline-out">${esc(out)}</div>` : ""}
            </div>`;
          }).join("");
        }
        if (state.pinnedBottom) {
          streamEl.scrollTop = streamEl.scrollHeight;
        } else {
          streamEl.scrollTop = prevScroll;
        }

        // 3. Composer lock state (WITHOUT wiping user's in-progress steer input!)
        const locked = t.kind === "manual" || t.state === "done" || t.state === "cancelled";
        $("steerInput").classList.toggle("hidden", locked);
        $("btnSteerSend").classList.toggle("hidden", locked);
        $("steerLabel").classList.toggle("hidden", locked);
        $("steerLockedNote").classList.toggle("hidden", !locked);
        if (locked) {
          $("steerLockedNote").textContent = t.kind === "manual"
            ? "Phiên mở tay Terminal — chỉ đọc, không gửi Steer từ web."
            : t.state === "cancelled"
              ? "Task đã huỷ — tạo task mới nếu muốn chạy lại."
              : "Task đã hoàn tất — muốn làm tiếp hãy tạo task mới.";
        }

        // 4. Right Inspector Tab Body
        renderInspectorTab(t, det);

        // 5. Bottom Context Actions (strictly matching real AAF CLI contract)
        renderContextActions(t);
      }

      function renderInspectorTab(t, det) {
        const body = $("inspectorBody");
        if (state.rtab === "diff") {
          const diff = (det && det.diff) || { available: false, reason: "Đang tải..." };
          if (!diff.available || !diff.patch) {
            body.innerHTML = `<div class="muted" style="padding:24px 0;text-align:center;">${esc(diff.reason || "Chưa có thay đổi git diff.")}</div>`;
            return;
          }
          const filesHtml = (diff.files || []).map(f => {
            const parts = String(f.path || "").split("/");
            const base = parts.pop() || f.path;
            const dir = parts.join("/");
            return `<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center;">
              <div style="min-width:0;">
                <div class="mono trunc" style="font-size:13px;font-weight:600;">${esc(base)}</div>
                ${dir ? `<div class="mono muted trunc" style="font-size:12px;">${esc(dir)}</div>` : ""}
              </div>
              <span class="mono tnum" style="font-size:12px;flex-shrink:0;"><span style="color:var(--t-success)">+${f.add}</span> <span style="color:var(--t-err)">-${f.del}</span></span>
            </div>`;
          }).join("");

          let oldLn = 0, newLn = 0;
          const rows = diff.patch.split("\n").slice(0, 600).map(ln => {
            let cls = "";
            let n1 = "", n2 = "";
            if (ln.startsWith("@@")) {
              cls = "diff-hdr";
              const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(ln);
              if (m) { oldLn = parseInt(m[1], 10); newLn = parseInt(m[2], 10); }
            } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
              cls = "diff-add"; n2 = String(newLn++);
            } else if (ln.startsWith("-") && !ln.startsWith("---")) {
              cls = "diff-del"; n1 = String(oldLn++);
            } else if (!ln.startsWith("diff ") && !ln.startsWith("index ") && !ln.startsWith("---") && !ln.startsWith("+++")) {
              n1 = String(oldLn++); n2 = String(newLn++);
            }
            return `<tr class="${cls}">
              <td class="diff-ln diff-old-col tnum">${n1}</td>
              <td class="diff-ln tnum">${n2}</td>
              <td class="diff-code">${esc(ln)}</td>
            </tr>`;
          }).join("");

          body.innerHTML = `
            <div class="row-gap" style="justify-content:space-between;margin-bottom:10px;">
              <span class="muted" style="font-size:12px;">${(diff.files || []).length} file${diff.truncated ? " (đã cắt ở 200KB)" : ""}</span>
              <button class="btn" data-act="toggle-wrap" aria-pressed="${state.diffWrap}">${state.diffWrap ? "Tắt xuống dòng" : "Xuống dòng (Wrap)"}</button>
            </div>
            ${filesHtml ? `<div style="margin-bottom:12px;">${filesHtml}</div>` : ""}
            <div class="diff-box${state.diffWrap ? " diff-wrap" : ""}">
              <table class="diff-table"><tbody>${rows}</tbody></table>
            </div>`;
          return;
        }

        if (state.rtab === "plan") {
          body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;">
            <div>
              <div class="field-label">Đặc tả (Spec)</div>
              <div class="timeline-out">${esc(t.spec || "Chưa có đặc tả.")}</div>
            </div>
            <div>
              <div class="field-label">Ghi chú Steer / Kế hoạch đã gửi</div>
              <div class="timeline-out">${esc(t.contextNotes || "Chưa có ghi chú bổ sung.")}</div>
            </div>
          </div>`;
          return;
        }

        // Tab: Nghiệm thu (Handover + Real Proof PNGs)
        const ho = (det && det.handover) || {};
        const pf = (det && det.proof) || { images: [] };
        const imgs = pf.images || [];
        body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:12px;">
            <div>
              <strong>Biên nhận aaf handover</strong>
              <div class="muted" style="font-size:12px;">${esc(ho.verdict || ho.status || ho.note || "Chưa có biên nhận")}</div>
            </div>
            <div class="tnum" style="font-size:20px;font-weight:700;">${ho.score != null ? esc(ho.score) + "/100" : "—"}</div>
          </div>
          ${imgs.length ? `<div style="display:flex;flex-direction:column;gap:10px;">
            <div class="field-label">Ảnh nghiệm thu thật (${imgs.length})</div>
            ${imgs.map(img => `<button class="btn" style="flex-direction:column;height:auto;padding:8px;" data-act="open-proof" data-url="${esc(img.url)}" data-name="${esc(img.name)}">
              <img src="${esc(img.url)}" alt="${esc(img.name)}" loading="lazy" style="max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--border);" />
              <span class="mono muted" style="font-size:12px;">${esc(img.name)}</span>
            </button>`).join("")}
          </div>` : `<div class="muted" style="font-size:13px;">Chưa có ảnh proof PNG gắn cho task này.</div>`}
        </div>`;
      }

      function renderContextActions(t) {
        const foot = $("inspectorFoot");
        if (t.kind === "manual") {
          foot.innerHTML = `<div class="muted" style="font-size:13px;">Phiên chạy tay trong Terminal — chỉ xem trạng thái.</div>`;
          return;
        }
        if (t.state === "blocked") {
          foot.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
            ${t.isHeadLock && t.ttyHint ? `<div class="timeline-out" style="margin:0;">${esc(t.ttyHint)}</div>` : ""}
            <div class="row-gap">
              ${t.isHeadLock && t.ttyHint ? `<button class="btn btn-primary" style="flex:1" data-act="copy-val" data-val="${esc(t.ttyHint)}">Copy lệnh TTY</button>` : ""}
              ${t.needsPlanApproval ? `<button class="btn btn-primary" style="flex:1" data-act="approve-plan" data-id="${esc(t.id)}">Duyệt kế hoạch</button>` : ""}
              <button class="btn" style="flex:1" data-act="unblock" data-id="${esc(t.id)}">Unblock → Ready</button>
            </div>
          </div>`;
          return;
        }
        if (t.state === "review") {
          if (state.reworkOpen) {
            const draft = state.drafts.get("rework:" + t.id) || "";
            foot.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
              <label for="reworkInput" class="field-label">Lý do yêu cầu sửa (--reason bắt buộc)</label>
              <div class="row-gap">
                <input id="reworkInput" class="field" style="flex:1" type="text" value="${esc(draft)}" placeholder="Mô tả điểm cần sửa..." />
                <button class="btn btn-primary" data-act="submit-rework" data-id="${esc(t.id)}">Gửi</button>
                <button class="btn" data-act="cancel-rework">Huỷ</button>
              </div>
            </div>`;
            return;
          }
          foot.innerHTML = `<div class="row-gap">
            <button class="btn" style="flex:1" data-act="open-rework">Yêu cầu sửa (Rework)</button>
          </div>`;
          return;
        }
        if (t.state === "running" && t.latestRunId) {
          foot.innerHTML = `<div class="row-gap" style="justify-content:space-between;">
            <span class="muted" style="font-size:12px;">Đang chạy trong worktree</span>
            <button class="btn btn-danger" data-act="confirm-stop" data-run="${esc(t.latestRunId)}" data-id="${esc(t.id)}">Dừng khẩn cấp</button>
          </div>`;
          return;
        }
        foot.innerHTML = `<div class="muted" style="font-size:13px;">Trạng thái hiện tại: <strong>${esc(t.state)}</strong></div>`;
      }

      /* ==================== RENDER: REAL CC-SWITCHER ACCOUNTS PAGE ==================== */
      function renderAccounts() {
        const root = $("accountsInner");
        if (state.loadingAccounts && !state.accounts) {
          root.innerHTML = `<div class="skel" style="height:80px"></div><div class="skel" style="height:240px"></div>`;
          return;
        }
        const d = state.accounts;
        if (!d || d.ok === false) {
          root.innerHTML = `<div class="hairline-box" style="padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <strong>Không đọc được trạng thái CC-Switcher</strong>
            <span class="muted">${esc((d && d.error) || "Chưa có dữ liệu")}</span>
            <button class="btn btn-primary" data-act="acc-refresh">Thử lại</button>
          </div>`;
          return;
        }

        const caps = d.capabilities || { allowOAuthLogin: true, isRemote: false };
        const profiles = d.profiles || [];
        const repos = d.repoAssignments || [];
        const history = d.history || [];

        root.innerHTML = `
          <div class="row-gap" style="justify-content:space-between;">
            <div>
              <h2 style="margin:0;font-size:18px;letter-spacing:-0.02em;">Quản lý Tài khoản (CC-Switcher)</h2>
              <p class="muted" style="margin:4px 0 0;font-size:13px;">${profiles.length} tài khoản thực · đồng bộ với <code>cc-switcher-mcp</code> &amp; <code>aaf accounts</code></p>
            </div>
            <div class="row-gap">
              <button class="btn" data-act="acc-refresh">Làm mới hạn mức</button>
              <button class="btn btn-primary" data-act="acc-confirm" data-cc="rotate">Xoay vòng Claude</button>
              <button class="btn" data-act="acc-confirm" data-cc="balance" data-mode="even">Cân bằng đều</button>
              <button class="btn" data-act="acc-confirm" data-cc="balance" data-mode="swap">Hoán đổi</button>
            </div>
          </div>

          ${!caps.allowOAuthLogin ? `<div class="chip chip-warn" style="padding:10px 12px;white-space:normal;">
            Chế độ từ xa (:4318): OAuth đăng nhập lại &amp; thêm/xoá repo được khoá để bảo vệ phiên — chỉ mở trên máy Mac (:4317).
          </div>` : ""}

          <div class="hairline-box">
            ${profiles.map(p => {
              const rem = typeof p.remainingPct === "number" ? p.remainingPct : null;
              const used = typeof p.usedPct === "number" ? p.usedPct : (rem != null ? 100 - rem : 0);
              const barColor = p.isFrozen ? "var(--c-err)" : used > 80 ? "var(--c-warn)" : "var(--c-primary)";
              const needLogin = Boolean(p.quotaStale || p.accountMismatch || p.quotaIssue);
              return `<div class="acc-row${p.isActive ? " is-active" : ""}">
                <div style="min-width:0;">
                  <div class="row-gap" style="flex-wrap:nowrap;">
                    <strong class="mono trunc">${esc(p.name || p.id)}</strong>
                    ${p.isActive ? `<span class="chip chip-primary">Mặc định</span>` : ""}
                    ${p.isFrozen ? `<span class="chip chip-err">Đóng băng ${p.freezeRemainMin ? p.freezeRemainMin + "p" : ""}</span>` : `<span class="chip chip-success">Sẵn sàng</span>`}
                  </div>
                  <div class="muted trunc" style="font-size:12px;margin-top:4px;">
                    ${esc(p.vendor || "")} · Reset 5h: ${esc(p.resetTimeFormatted || "—")} · Tuần: ${p.weeklyRemainingPct != null ? p.weeklyRemainingPct + "% còn" : "—"}
                  </div>
                  ${p.quotaIssue ? `<div style="font-size:12px;color:var(--t-warn);margin-top:4px;">${esc(p.quotaIssue)}</div>` : ""}
                </div>

                <div style="min-width:0;">
                  <div class="row-gap tnum" style="justify-content:space-between;font-size:12px;margin-bottom:6px;">
                    <span class="muted">Cửa sổ 5h</span>
                    <strong class="mono">${rem != null ? (100 - rem) + "% (" + rem + "% còn)" : "—"}</strong>
                  </div>
                  <div class="meter-track"><div class="meter-fill" style="width:${Math.min(100, Math.max(0, used))}%;background:${barColor}"></div></div>
                </div>

                <div class="row-gap" style="justify-content:flex-end;">
                  <button class="btn btn-primary" ${p.isActive ? "disabled" : ""} data-act="acc-switch" data-profile="${esc(p.id)}">${p.isActive ? "Đang dùng" : "Đặt mặc định"}</button>
                  ${p.isFrozen
                    ? `<button class="btn" data-act="acc-simple" data-cc="unfreeze" data-profile="${esc(p.id)}">Gỡ đóng băng</button>`
                    : `<button class="btn" data-act="acc-confirm" data-cc="limit" data-profile="${esc(p.id)}">Đánh dấu 429</button>`}
                  ${needLogin ? (caps.allowOAuthLogin
                    ? `<button class="btn" data-act="acc-simple" data-cc="login" data-profile="${esc(p.id)}">Đăng nhập lại</button>`
                    : `<button class="btn" disabled title="OAuth chỉ mở trên Mac :4317">OAuth khoá (:4318)</button>`) : ""}
                </div>
              </div>`;
            }).join("")}
          </div>

          ${repos.length ? `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <h3 style="margin:0;font-size:15px;">Phân bổ tài khoản cho từng Repo (bấm Lưu để xác nhận)</h3>
            <div class="hairline-box">
              ${repos.map((r, idx) => {
                const curAcc = (r.effective && r.effective.account) || r.pinnedInFile || "";
                const pending = state.pendingRepoAssign.get(r.path) || curAcc;
                const changed = pending !== curAcc;
                const claudeOnly = profiles.filter(p => (p.vendor || "").toLowerCase().includes("anthropic") || (p.vendor || "").toLowerCase().includes("claude"));
                const opts = claudeOnly.length ? claudeOnly : profiles;
                return `<div class="acc-row repo-row">
                  <div style="min-width:180px;">
                    <label for="ra-${idx}" style="font-weight:600;display:block;">${esc(r.name || r.path.split("/").pop())}</label>
                    <div class="mono muted trunc" style="font-size:12px;">${esc(r.path)}</div>
                  </div>
                  <div class="row-gap">
                    <select id="ra-${idx}" class="field" style="width:auto;min-width:160px;" data-act="ra-pick" data-repo="${esc(r.path)}">
                      ${opts.map(p => `<option value="${esc(p.id)}" ${pending === p.id ? "selected" : ""}>${esc(p.name || p.id)}</option>`).join("")}
                    </select>
                    <button class="btn btn-primary" ${changed ? "" : "disabled"} data-act="ra-save" data-repo="${esc(r.path)}">Lưu</button>
                  </div>
                </div>`;
              }).join("")}
            </div>
          </div>` : ""}

          ${history.length ? `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <h3 style="margin:0;font-size:15px;">Lịch sử đổi tài khoản gần đây</h3>
            <div class="hairline-box" style="padding:12px 16px;">
              ${history.slice(0, 8).map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;" class="mono muted">${esc(h.time || h.at || "")} · ${esc(h.summary || h.action || JSON.stringify(h))}</div>`).join("")}
            </div>
          </div>` : ""}
        `;
      }

      /* ==================== MOBILE QUICK ASK / ADD TAB ==================== */
      function renderMobAsk() {
        const repos = (state.studio && state.studio.repos) || [];
        const repoOpts = repos.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
        $("mobAskTabAdd").className = state.mobAskMode === "add" ? "btn btn-primary" : "btn";
        $("mobAskTabBtw").className = state.mobAskMode === "btw" ? "btn btn-primary" : "btn";
        $("mobAskTabAdd").setAttribute("aria-selected", String(state.mobAskMode === "add"));
        $("mobAskTabBtw").setAttribute("aria-selected", String(state.mobAskMode === "btw"));

        if (state.mobAskMode === "add") {
          $("mobAskForm").innerHTML = `
            <div>
              <label for="mAddRepo" class="field-label">Dự án đích</label>
              <select id="mAddRepo" class="field">${repoOpts}</select>
            </div>
            <div>
              <label for="mAddTitle" class="field-label">Tiêu đề task</label>
              <input id="mAddTitle" class="field" type="text" placeholder="vd: Chặn crash mở PDF trên Android 15" value="${esc(state.drafts.get("mAddTitle") || "")}" />
            </div>
            <div>
              <label for="mAddSpec" class="field-label">Mô tả chi tiết / Log lỗi</label>
              <textarea id="mAddSpec" class="field" placeholder="Dán Crashlytics log hoặc mô tả yêu cầu...">${esc(state.drafts.get("mAddSpec") || "")}</textarea>
            </div>
            <div>
              <label for="mAddAccept" class="field-label">Tiêu chí nghiệm thu (Accept)</label>
              <input id="mAddAccept" class="field" type="text" placeholder="vd: Unit test ĐỎ→XANH và không crash" value="${esc(state.drafts.get("mAddAccept") || "")}" />
            </div>
            <p id="mAddErr" class="field-err hidden"></p>
            <button class="btn btn-primary btn-full" data-act="mob-submit-add">Đẩy vào hàng đợi Ready</button>`;
        } else {
          $("mobAskForm").innerHTML = `
            <div>
              <label for="mBtwRepo" class="field-label">Dự án cần hỏi</label>
              <select id="mBtwRepo" class="field">${repoOpts}</select>
            </div>
            <div>
              <label for="mBtwQ" class="field-label">Câu hỏi read-only (/btw)</label>
              <textarea id="mBtwQ" class="field" placeholder="Hỏi nhanh codebase — không mở worktree, không sửa file...">${esc(state.drafts.get("mBtwQ") || "")}</textarea>
            </div>
            <p id="mBtwErr" class="field-err hidden"></p>
            <button class="btn btn-primary btn-full" data-act="mob-submit-btw">Hỏi ngay (Read-only)</button>
            <div id="mBtwAns" class="timeline-out hidden"></div>`;
        }
      }

      /* ==================== DIALOGS (NATIVE <dialog> WITH FOCUS RESTORE) ==================== */
      function openDialog(title, html, focusSelector = null) {
        state.lastFocused = document.activeElement;
        $("dlgTitle").textContent = title;
        $("dlgBody").innerHTML = html;
        const dlg = $("mainDialog");
        if (!dlg.open) dlg.showModal();
        const target = focusSelector ? dlg.querySelector(focusSelector) : dlg.querySelector("input, textarea, select, button");
        if (target) target.focus();
      }

      function closeDialog() {
        const dlg = $("mainDialog");
        if (dlg.open) dlg.close();
        if (state.lastFocused && typeof state.lastFocused.focus === "function") {
          state.lastFocused.focus();
        }
      }

      function openConfirmDialog(title, message, confirmLabel, danger, onConfirm) {
        openDialog(
          title,
          `<p style="margin:0;font-size:14px;">${esc(message)}</p>
           <div class="row-gap" style="justify-content:flex-end;">
             <button id="dlgCancelBtn" class="btn" data-act="close-dlg">Huỷ</button>
             <button id="dlgConfirmBtn" class="btn ${danger ? "btn-danger-solid" : "btn-primary"}">${esc(confirmLabel)}</button>
           </div>`,
          danger ? "#dlgCancelBtn" : "#dlgConfirmBtn"
        );
        $("dlgConfirmBtn").addEventListener("click", async e => {
          await runLockedButton(e.currentTarget, async () => {
            await onConfirm();
            closeDialog();
          });
        });
      }

      function openAddTaskDialog() {
        const repos = (state.studio && state.studio.repos) || [];
        const repoOpts = repos.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
        openDialog(
          "Tạo task mới cho AAF",
          `<div>
             <label for="dAddRepo" class="field-label">Dự án đích</label>
             <select id="dAddRepo" class="field">${repoOpts}</select>
           </div>
           <div class="row-gap">
             <div style="flex:1">
               <label for="dAddPri" class="field-label">Ưu tiên</label>
               <select id="dAddPri" class="field"><option value="P1">P1 · Cao</option><option value="P0">P0 · Khẩn</option><option value="P2">P2 · Thường</option></select>
             </div>
             <div style="flex:1">
               <label for="dAddScope" class="field-label">Phạm vi (tuỳ chọn)</label>
               <input id="dAddScope" class="field" type="text" placeholder="vd: libs/pdf-viewer" />
             </div>
           </div>
           <div>
             <label for="dAddTitle" class="field-label">Tiêu đề task</label>
             <input id="dAddTitle" class="field" type="text" placeholder="Ngắn gọn, rõ mục tiêu..." />
           </div>
           <div>
             <label for="dAddSpec" class="field-label">Mô tả kỹ thuật / Crashlytics log</label>
             <textarea id="dAddSpec" class="field" placeholder="Dán stack trace hoặc yêu cầu chi tiết..."></textarea>
           </div>
           <div>
             <label for="dAddAccept" class="field-label">Tiêu chí nghiệm thu (Accept)</label>
             <input id="dAddAccept" class="field" type="text" placeholder="vd: Unit test ĐỎ→XANH và aaf gate CLEAR" />
           </div>
           <p id="dAddErr" class="field-err hidden"></p>
           <button id="dAddSubmit" class="btn btn-primary btn-full">Đẩy vào hàng đợi Ready</button>`,
          "#dAddTitle"
        );
        $("dAddSubmit").addEventListener("click", async e => {
          const repo = $("dAddRepo").value;
          const priority = $("dAddPri").value;
          const scope = $("dAddScope").value.trim();
          const title = $("dAddTitle").value.trim();
          const spec = $("dAddSpec").value.trim();
          const accept = $("dAddAccept").value.trim();
          const errEl = $("dAddErr");
          if (!title || !spec || !accept) {
            errEl.textContent = "Cần nhập đủ Tiêu đề, Mô tả và Tiêu chí nghiệm thu.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(e.currentTarget, async () => {
            try {
              await apiFetch("/api/aaf/action", {
                method: "POST",
                body: { action: "add", repo, priority, scope, title, spec, accept },
              });
              closeDialog();
              showToast(`Đã tạo task mới trong ${repo}`);
              await loadStudio(true);
            } catch (err) {
              console.warn("add task failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        });
      }

      /* ==================== PAGE & MOBILE SHELL SYNC ==================== */
      function syncPages() {
        const isMob = window.innerWidth < 1024;
        $("panelWork").classList.toggle("hidden", state.page !== "work");
        $("panelAccounts").classList.toggle("hidden", state.page !== "accounts");
        $("panelMobAsk").classList.toggle("hidden", !(isMob && state.page === "ask"));

        $("navWork").setAttribute("aria-selected", String(state.page === "work"));
        $("navAccounts").setAttribute("aria-selected", String(state.page === "accounts"));
        $("mnavWork").setAttribute("aria-current", state.page === "work" ? "page" : "false");
        $("mnavAccounts").setAttribute("aria-current", state.page === "accounts" ? "page" : "false");
        $("mnavAsk").setAttribute("aria-current", state.page === "ask" ? "page" : "false");

        if (state.page === "accounts" && !state.accounts) loadAccounts(false);
        if (state.page === "ask") renderMobAsk();
        syncMobileShell();
      }

      function syncMobileShell() {
        const app = $("app");
        app.setAttribute("data-mob-view", state.mobView);
        app.setAttribute("data-mob-sub", state.mobSub === "stream" ? "stream" : "inspect");
        const inDet = window.innerWidth < 1024 && state.page === "work" && state.mobView === "detail";
        $("btnMobBack").classList.toggle("hidden", !inDet);
        $("brandWrap").classList.toggle("hidden", inDet);

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.BackButton) {
          try {
            if (inDet) tg.BackButton.show(); else tg.BackButton.hide();
          } catch (err) {
            console.warn("BackButton sync:", err);
          }
        }
      }

      /* ==================== DELEGATED EVENT HANDLER (ZERO INLINE HANDLERS) ==================== */
      document.addEventListener("click", async e => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const act = btn.getAttribute("data-act");

        if (act === "toggle-theme") {
          const cur = document.documentElement.getAttribute("data-theme") || "light";
          applyTheme(cur === "dark" ? "light" : "dark");
        } else if (act === "page") {
          state.page = btn.getAttribute("data-page");
          syncPages();
        } else if (act === "mob-tab") {
          state.page = btn.getAttribute("data-tab");
          state.mobView = "list";
          syncPages();
        } else if (act === "mob-back") {
          state.mobView = "list";
          syncMobileShell();
        } else if (act === "mob-sub") {
          state.mobSub = btn.getAttribute("data-sub");
          ["mobSubStream", "mobSubDiff", "mobSubPlan", "mobSubProof"].forEach(id => {
            $(id).setAttribute("aria-selected", String($(id).getAttribute("data-sub") === state.mobSub));
          });
          if (state.mobSub !== "stream") state.rtab = state.mobSub;
          syncMobileShell();
          renderCenterAndRight();
        } else if (act === "rtab") {
          state.rtab = btn.getAttribute("data-tab");
          ["tabDiff", "tabPlan", "tabProof"].forEach(id => {
            $(id).setAttribute("aria-selected", String($(id).getAttribute("data-tab") === state.rtab));
          });
          renderCenterAndRight();
        } else if (act === "filter-st") {
          state.filterSt = btn.getAttribute("data-st");
          document.querySelectorAll("#stateFilters .pill").forEach(p => {
            p.setAttribute("aria-pressed", String(p.getAttribute("data-st") === state.filterSt));
          });
          renderRail();
        } else if (act === "select-task") {
          state.selectedId = btn.getAttribute("data-id");
          state.reworkOpen = false;
          state.pinnedBottom = true;
          if (window.innerWidth < 1024) state.mobView = "detail";
          renderRail();
          syncMobileShell();
          await loadTaskDetail(state.selectedId);
        } else if (act === "toggle-step") {
          const k = btn.getAttribute("data-key");
          if (state.expandedSteps.has(k)) state.expandedSteps.delete(k); else state.expandedSteps.add(k);
          renderCenterAndRight();
        } else if (act === "toggle-wrap") {
          state.diffWrap = !state.diffWrap;
          renderCenterAndRight();
        } else if (act === "jump-latest") {
          state.pinnedBottom = true;
          $("streamScroll").scrollTop = $("streamScroll").scrollHeight;
          $("jumpLatestWrap").classList.add("hidden");
        } else if (act === "copy-val") {
          await copyText(btn.getAttribute("data-val"), "Đã copy vào clipboard");
        } else if (act === "open-add") {
          openAddTaskDialog();
        } else if (act === "close-dlg") {
          closeDialog();
        } else if (act === "toggle-btw") {
          $("btwDrawer").classList.toggle("hidden");
          if (!$("btwDrawer").classList.contains("hidden")) $("btwInput").focus();
        } else if (act === "refresh-now") {
          await runLockedButton(btn, () => loadStudio(true));
        } else if (act === "toggle-autorun") {
          const cur = Boolean(state.studio && state.studio.summary && state.studio.summary.autoRunEnabled);
          openConfirmDialog(
            cur ? "Tắt tự chạy đa repo?" : "Bật supervisor tự chạy đa repo?",
            cur ? "Các phiên đang chạy vẫn tiếp tục đến hết lượt, nhưng supervisor sẽ không nhận task mới."
                : "Supervisor sẽ tự chạy `aaf run --auto` trên các repo có task Ready.",
            cur ? "Tắt tự chạy" : "Bật tự chạy",
            false,
            async () => {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "supervisor_toggle", enabled: !cur } });
              showToast(!cur ? "Đã BẬT supervisor tự chạy" : "Đã TẮT supervisor tự chạy");
              await loadStudio(true);
            }
          );
        } else if (act === "send-steer") {
          const inp = $("steerInput");
          const errEl = $("steerErr");
          const note = inp.value.trim();
          if (!note) {
            errEl.textContent = "Nhập nội dung chỉ dẫn trước khi gửi.";
            errEl.classList.remove("hidden");
            inp.focus();
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "steer", taskId: state.selectedId, note } });
              inp.value = "";
              showToast("Đã gửi Steer cho lượt chạy kế tiếp");
              await loadTaskDetail(state.selectedId, true);
            } catch (err) {
              console.warn("steer failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "send-btw") {
          const inp = $("btwInput");
          const errEl = $("btwErr");
          const ansEl = $("btwAns");
          const q = inp.value.trim();
          if (!q) {
            errEl.textContent = "Nhập câu hỏi trước khi gửi.";
            errEl.classList.remove("hidden");
            inp.focus();
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              const res = await apiFetch("/api/aaf/ask", { method: "POST", body: { repo: $("btwRepo").value, question: q } });
              ansEl.textContent = `(${res.elapsedSec || "?"}s · Read-only)\n${res.answer || ""}`;
              ansEl.classList.remove("hidden");
            } catch (err) {
              console.warn("btw ask failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "unblock" || act === "approve-plan") {
          const tid = btn.getAttribute("data-id");
          const apiAct = act === "unblock" ? "unblock" : "approve_plan";
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: apiAct, taskId: tid } });
              showToast(act === "unblock" ? `Đã mở khoá ${tid}` : `Đã duyệt kế hoạch ${tid}`);
              await loadStudio(true);
            } catch (err) {
              console.warn(apiAct, err);
              showToast(`Lỗi: ${err.message}`);
            }
          });
        } else if (act === "open-rework") {
          state.reworkOpen = true;
          renderCenterAndRight();
          if ($("reworkInput")) $("reworkInput").focus();
        } else if (act === "cancel-rework") {
          state.reworkOpen = false;
          renderCenterAndRight();
        } else if (act === "submit-rework") {
          const tid = btn.getAttribute("data-id");
          const reason = ($("reworkInput") && $("reworkInput").value.trim()) || "";
          if (!reason) { showToast("Bắt buộc nhập lý do --reason"); return; }
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "rework", taskId: tid, reason, rerun: true } });
              state.reworkOpen = false;
              state.drafts.delete("rework:" + tid);
              showToast(`Đã đẩy ${tid} về Rework`);
              await loadStudio(true);
            } catch (err) {
              console.warn("rework failed:", err);
              showToast(`Lỗi rework: ${err.message}`);
            }
          });
        } else if (act === "confirm-stop") {
          const runId = btn.getAttribute("data-run");
          const tid = btn.getAttribute("data-id");
          openConfirmDialog(
            `Dừng khẩn cấp phiên ${tid}?`,
            `Gửi tín hiệu SIGTERM tới tiến trình agent đang chạy trong worktree của run ${runId}.`,
            "Dừng ngay (SIGTERM)",
            true,
            async () => {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "stop", runId, confirm: true } });
              showToast(`Đã gửi lệnh dừng tới ${tid}`);
              await loadStudio(true);
            }
          );
        } else if (act === "open-proof") {
          const url = btn.getAttribute("data-url");
          const name = btn.getAttribute("data-name");
          openDialog(name || "Ảnh nghiệm thu", `<img src="${esc(url)}" alt="${esc(name)}" style="width:100%;border-radius:10px;border:1px solid var(--border);" />`);
        } else if (act === "acc-refresh") {
          await runLockedButton(btn, () => loadAccounts(true));
        } else if (act === "acc-switch") {
          const profile = btn.getAttribute("data-profile");
          await runLockedButton(btn, async () => {
            try {
              const res = await apiFetch("/api/aaf/accounts/action", { method: "POST", body: { action: "switch", account: profile } });
              if (res && res.needsForce) {
                openConfirmDialog(
                  `Cưỡng bức chuyển sang ${profile}?`,
                  res.error || "Tài khoản đang có phiên hoạt động hoặc chưa hết anti-ban cooldown.",
                  "Chuyển cưỡng bức (force)",
                  true,
                  async () => {
                    await apiFetch("/api/aaf/accounts/action", { method: "POST", body: { action: "switch", account: profile, force: true } });
                    showToast(`Đã chuyển sang ${profile}`);
                    await loadAccounts(false);
                  }
                );
              } else {
                showToast(`Đã đặt ${profile} làm mặc định`);
                await loadAccounts(false);
              }
            } catch (err) {
              console.warn("switch failed:", err);
              showToast(`Lỗi đổi tài khoản: ${err.message}`);
            }
          });
        } else if (act === "acc-simple") {
          const cc = btn.getAttribute("data-cc");
          const profile = btn.getAttribute("data-profile");
          await runLockedButton(btn, async () => {
            try {
              const payload = cc === "login" ? { action: "login", target: profile } : { action: cc, account: profile };
              await apiFetch("/api/aaf/accounts/action", { method: "POST", body: payload });
              showToast(`Đã thực hiện ${cc} cho ${profile}`);
              await loadAccounts(false);
            } catch (err) {
              console.warn("cc action failed:", err);
              showToast(`Lỗi: ${err.message}`);
            }
          });
        } else if (act === "acc-confirm") {
          const cc = btn.getAttribute("data-cc");
          const mode = btn.getAttribute("data-mode");
          const profile = btn.getAttribute("data-profile");
          openConfirmDialog(
            `Xác nhận thao tác ${cc}?`,
            mode ? `Cân bằng lại danh sách repo theo chế độ "${mode}".` : `Thực thi thao tác "${cc}" trên pool CC-Switcher.`,
            "Xác nhận",
            cc === "limit",
            async () => {
              const body = { action: cc };
              if (mode) body.mode = mode;
              if (profile) body.account = profile;
              await apiFetch("/api/aaf/accounts/action", { method: "POST", body });
              showToast(`Hoàn tất ${cc}`);
              await loadAccounts(false);
            }
          );
        } else if (act === "ra-save") {
          const repo = btn.getAttribute("data-repo");
          const account = state.pendingRepoAssign.get(repo);
          if (!account) return;
          openConfirmDialog(
            "Lưu gán tài khoản cho repo?",
            `Gán repo ${repo.split("/").pop()} dùng tài khoản ${account}.`,
            "Lưu thay đổi",
            false,
            async () => {
              await apiFetch("/api/aaf/accounts/action", { method: "POST", body: { action: "repo_assign", repo, account } });
              state.pendingRepoAssign.delete(repo);
              showToast(`Đã gán ${account}`);
              await loadAccounts(false);
            }
          );
        } else if (act === "mob-ask-mode") {
          state.mobAskMode = btn.getAttribute("data-mode");
          renderMobAsk();
        } else if (act === "mob-submit-add") {
          const repo = $("mAddRepo").value;
          const title = $("mAddTitle").value.trim();
          const spec = $("mAddSpec").value.trim();
          const accept = $("mAddAccept").value.trim();
          const errEl = $("mAddErr");
          if (!title || !spec || !accept) {
            errEl.textContent = "Cần nhập đủ Tiêu đề, Mô tả và Tiêu chí nghiệm thu.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "add", repo, title, spec, accept, priority: "P1" } });
              ["mAddTitle", "mAddSpec", "mAddAccept"].forEach(k => state.drafts.delete(k));
              state.page = "work";
              syncPages();
              showToast(`Đã tạo task mới trong ${repo}`);
              await loadStudio(true);
            } catch (err) {
              console.warn("mob add failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "mob-submit-btw") {
          const repo = $("mBtwRepo").value;
          const q = $("mBtwQ").value.trim();
          const errEl = $("mBtwErr");
          const ansEl = $("mBtwAns");
          if (!q) {
            errEl.textContent = "Nhập câu hỏi trước khi gửi.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              const res = await apiFetch("/api/aaf/ask", { method: "POST", body: { repo, question: q } });
              ansEl.textContent = `(${res.elapsedSec || "?"}s · Read-only)\n${res.answer || ""}`;
              ansEl.classList.remove("hidden");
            } catch (err) {
              console.warn("mob btw failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        }
      });

      /* Delegated input/change listeners (draft preservation + explicit repo assign pick) */
      document.addEventListener("input", e => {
        const el = e.target;
        if (el.id === "searchInput") {
          state.search = el.value;
          renderRail();
        } else if (el.id === "reworkInput") {
          state.drafts.set("rework:" + state.selectedId, el.value);
        } else if (["mAddTitle", "mAddSpec", "mAddAccept", "mBtwQ"].includes(el.id)) {
          state.drafts.set(el.id, el.value);
        }
      });

      document.addEventListener("change", e => {
        const el = e.target;
        if (el.getAttribute("data-act") === "ra-pick") {
          state.pendingRepoAssign.set(el.getAttribute("data-repo"), el.value);
          renderAccounts();
        }
      });

      /* Keyboard shortcuts (⌘K = search, ⌘↵ = steer, WAI-ARIA tablist ArrowLeft/Right/Home/End) */
      document.addEventListener("keydown", e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          state.page = "work";
          syncPages();
          $("searchInput").focus();
        } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement === $("steerInput")) {
          e.preventDefault();
          $("btnSteerSend").click();
        } else if (e.target && e.target.getAttribute("role") === "tab") {
          const list = e.target.closest('[role="tablist"]');
          if (!list) return;
          const tabs = Array.from(list.querySelectorAll('[role="tab"]'));
          const idx = tabs.indexOf(e.target);
          let next = -1;
          if (e.key === "ArrowRight") next = (idx + 1) % tabs.length;
          else if (e.key === "ArrowLeft") next = (idx - 1 + tabs.length) % tabs.length;
          else if (e.key === "Home") next = 0;
          else if (e.key === "End") next = tabs.length - 1;
          if (next >= 0) {
            e.preventDefault();
            tabs[next].focus();
            tabs[next].click();
          }
        }
      });

      /* Stream auto-scroll tracking */
      $("streamScroll").addEventListener("scroll", () => {
        const el = $("streamScroll");
        state.pinnedBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 36;
        $("jumpLatestWrap").classList.toggle("hidden", state.pinnedBottom);
      });

      /* VisualViewport IME & resize sync */
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewportHeight);
      }
      window.addEventListener("resize", () => { syncViewportHeight(); syncPages(); });

      /* Lifecycle-aware polling (pauses when hidden, immediate refresh on return) */
      let pollId = setInterval(() => {
        if (document.hidden) return;
        renderHeader();
        loadStudio(true);
      }, 5000);
      let staleTickId = setInterval(() => {
        if (!document.hidden) renderHeader();
      }, 3000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadStudio(true);
      });
      window.addEventListener("beforeunload", () => {
        clearInterval(pollId);
        clearInterval(staleTickId);
      });

      /* Boot */
      initThemeAndTelegram();
      syncViewportHeight();
      syncPages();
      loadStudio(false);
    })();
  </script>
</body>
</html>
