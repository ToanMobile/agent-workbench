<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AAF Studio — Điều khiển đa repo &amp; Tài khoản</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2'%3E%3Cpath d='M12 3 3.5 7.5v9L12 21l8.5-4.5v-9L12 3Z'/%3E%3C/svg%3E" />
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <style>
    /* ==================== SELF-CONTAINED SEMANTIC TOKENS (LIGHT + DARK + TELEGRAM) ====================
       Separated fill (--c-*) and WCAG AA >= 4.5:1 text (--t-*) tokens per ui-ux-pro-max & impeccable.
       3–5% tinted warm-cool neutrals; zero bare #808080; zero purple-blue gradients. */
    :root {
      color-scheme: light;
      --bg: #f8f9fb;
      --sidebar: #f2f4f8;
      --card: #ffffff;
      --subtle: #eef1f6;
      --hover: rgba(15, 23, 42, 0.045);
      --border: #dfe4ec;
      --border-strong: #c8d1df;
      --fg: #111827;
      --fg-muted: #4b5563;
      --code: #1e293b;

      --c-primary: #1d4ed8;
      --t-primary: #1e40af;
      --fg-on-primary: #ffffff;
      --c-success: #15803d;
      --t-success: #166534;
      --c-warn: #b45309;
      --t-warn: #92400e;
      --c-err: #b91c1c;
      --t-err: #991b1b;

      --tint-primary: rgba(29, 78, 216, 0.075);
      --tint-primary-b: rgba(29, 78, 216, 0.24);
      --tint-success: rgba(21, 128, 61, 0.09);
      --tint-success-b: rgba(21, 128, 61, 0.25);
      --tint-warn: rgba(180, 83, 9, 0.095);
      --tint-warn-b: rgba(180, 83, 9, 0.28);
      --tint-err: rgba(185, 28, 28, 0.085);
      --tint-err-b: rgba(185, 28, 28, 0.26);

      --repo-0: #2563eb;
      --repo-1: #0d9488;
      --repo-2: #d97706;
      --repo-3: #db2777;
      --repo-4: #4f46e5;
      --repo-5: #0284c7;

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --app-h: 100dvh;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1016;
      --sidebar: #121620;
      --card: #161b26;
      --subtle: #1c2230;
      --hover: rgba(241, 245, 249, 0.055);
      --border: #252d3d;
      --border-strong: #364156;
      --fg: #f1f5f9;
      --fg-muted: #9aa7bd;
      --code: #e2e8f0;

      --c-primary: #3b82f6;
      --t-primary: #93c5fd;
      --fg-on-primary: #ffffff;
      --c-success: #22c55e;
      --t-success: #86efac;
      --c-warn: #f59e0b;
      --t-warn: #fcd34d;
      --c-err: #ef4444;
      --t-err: #fca5a5;

      --tint-primary: rgba(59, 130, 246, 0.13);
      --tint-primary-b: rgba(59, 130, 246, 0.34);
      --tint-success: rgba(34, 197, 94, 0.13);
      --tint-success-b: rgba(34, 197, 94, 0.32);
      --tint-warn: rgba(245, 158, 11, 0.14);
      --tint-warn-b: rgba(245, 158, 11, 0.34);
      --tint-err: rgba(239, 68, 68, 0.14);
      --tint-err-b: rgba(239, 68, 68, 0.34);

      --repo-0: #60a5fa;
      --repo-1: #2dd4bf;
      --repo-2: #fbbf24;
      --repo-3: #f472b6;
      --repo-4: #818cf8;
      --repo-5: #38bdf8;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Accessibility focus rings & tactile press (transform/opacity only) */
    button, input, textarea, select, a {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--c-primary);
      outline-offset: 2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 140ms cubic-bezier(0.2, 0, 0, 1), background-color 140ms ease, opacity 140ms ease;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn-primary {
      background: var(--c-primary);
      border-color: var(--c-primary);
      color: var(--fg-on-primary);
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; background: var(--c-primary); }
    .btn-danger {
      background: var(--tint-err);
      border-color: var(--tint-err-b);
      color: var(--t-err);
    }
    .btn-danger-solid {
      background: var(--c-err);
      border-color: var(--c-err);
      color: var(--fg-on-primary);
    }
    .btn-ghost {
      border-color: transparent;
      background: transparent;
    }
    .btn-full { width: 100%; }

    .tnum { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); }
    .muted { color: var(--fg-muted); }
    .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    /* Shell Architecture (100dvh, visualViewport IME responsive) */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: var(--app-h);
      width: 100%;
      overflow: hidden;
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab {
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-muted);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .nav-tab[aria-selected="true"] {
      background: var(--card);
      border-color: var(--border);
      color: var(--fg);
    }

    /* Stale Banner (> 15s) */
    .stale-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: var(--tint-warn);
      border-bottom: 1px solid var(--tint-warn-b);
      color: var(--t-warn);
      font-size: 13px;
      flex-shrink: 0;
    }
    .stale-banner.err {
      background: var(--tint-err);
      border-color: var(--tint-err-b);
      color: var(--t-err);
    }
    .hidden { display: none !important; }

    /* Status chips (ALWAYS icon + label) */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--subtle);
      color: var(--fg-muted);
      white-space: nowrap;
    }
    .chip-primary { background: var(--tint-primary); border-color: var(--tint-primary-b); color: var(--t-primary); }
    .chip-success { background: var(--tint-success); border-color: var(--tint-success-b); color: var(--t-success); }
    .chip-warn { background: var(--tint-warn); border-color: var(--tint-warn-b); color: var(--t-warn); }
    .chip-err { background: var(--tint-err); border-color: var(--tint-err-b); color: var(--t-err); }

    /* Main Workspace Grid (>= 1024px 3-pane hairline) */
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 410px;
      overflow: hidden;
    }
    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .pane-rail { background: var(--sidebar); border-right: 1px solid var(--border); }
    .pane-center { background: var(--bg); border-right: 1px solid var(--border); }
    .pane-right { background: var(--card); }
    .pane-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Left Rail Sections */
    .rail-controls {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .row-gap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .field {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 14px;
    }
    textarea.field { min-height: 88px; resize: vertical; line-height: 1.5; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-muted);
      margin-bottom: 6px;
    }
    .field-err {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--t-err);
    }

    /* Filter Pills */
    .pill-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .pill {
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill[aria-pressed="true"] {
      background: var(--c-primary);
      border-color: var(--c-primary);
      color: var(--fg-on-primary);
    }

    /* Hairline List Items (Zero card-in-card) */
    .sec-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-muted);
    }
    .task-row {
      width: 100%;
      min-height: 58px;
      padding: 10px 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: background-color 140ms ease;
    }
    .task-row:hover { background: var(--hover); }
    .task-row.active {
      background: var(--tint-primary);
      box-shadow: inset 3px 0 0 0 var(--c-primary);
    }
    .repo-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 6px;
    }

    /* Center Task Header & Timeline */
    .task-hero {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .task-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }
    .meta-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 12px;
      color: var(--fg-muted);
    }
    .timeline-wrap {
      padding: 16px 20px;
      position: relative;
    }
    .timeline-item {
      position: relative;
      padding-left: 20px;
      margin-bottom: 10px;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 18px;
      bottom: -10px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot {
      position: absolute;
      left: 2px;
      top: 16px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: 2px solid var(--border-strong);
      background: var(--bg);
    }
    .timeline-dot.live { border-color: var(--c-primary); background: var(--c-primary); }
    .timeline-btn {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
    }
    .timeline-btn:hover { background: var(--hover); }
    .timeline-out {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--subtle);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--code);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Composer & Sticky Action Footer */
    .composer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .inspector-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .itab {
      min-height: 44px;
      min-width: 44px;
      padding: 0 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--fg-muted);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .itab[aria-selected="true"] {
      border-bottom-color: var(--c-primary);
      color: var(--fg);
    }
    .inspector-body { padding: 16px; }
    .inspector-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
      flex-shrink: 0;
    }

    /* Diff Viewer (single-gutter & wrap toggle for 390px) */
    .diff-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
    }
    .diff-table { width: 100%; border-collapse: collapse; }
    .diff-table td { padding: 2px 8px; vertical-align: top; }
    .diff-ln {
      width: 38px;
      text-align: right;
      color: var(--fg-muted);
      border-right: 1px solid var(--border);
      user-select: none;
    }
    .diff-code { white-space: pre; }
    .diff-wrap .diff-code { white-space: pre-wrap; word-break: break-word; }
    .diff-add { background: var(--tint-success); color: var(--t-success); }
    .diff-del { background: var(--tint-err); color: var(--t-err); }
    .diff-hdr { background: var(--tint-primary); color: var(--t-primary); font-weight: 600; }

    /* Accounts (CC-Switcher) Page */
    .accounts-page {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
    }
    .accounts-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hairline-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      overflow: hidden;
    }
    .acc-row {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(190px, 250px) auto;
      align-items: center;
      gap: 14px;
    }
    .acc-row.repo-row { grid-template-columns: minmax(0, 1fr) auto; }
    @media (max-width: 900px) {
      .acc-row, .acc-row.repo-row { grid-template-columns: 1fr; }
    }
    .acc-row:last-child { border-bottom: 0; }
    .acc-row.is-active { background: var(--tint-primary); }
    .meter-track {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .meter-fill { height: 100%; border-radius: 999px; }

    /* Mobile Bottom Nav + Safe Area */
    .mob-bottom-nav {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      background: var(--sidebar);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mob-nav-btn {
      min-height: 48px;
      min-width: 44px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--fg-muted);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .mob-nav-btn[aria-current="page"] { color: var(--t-primary); font-weight: 600; }

    /* Native <dialog> Modal (Automatic Focus Trap + Esc + Backdrop) */
    dialog {
      width: min(500px, calc(100vw - 24px));
      max-height: 88dvh;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--fg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    dialog::backdrop { background: rgba(10, 14, 24, 0.55); backdrop-filter: blur(2px); }
    .dlg-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
    }
    .dlg-title { margin: 0; font-size: 15px; font-weight: 600; }
    .dlg-body { padding: 16px; overflow-y: auto; max-height: 70dvh; display: flex; flex-direction: column; gap: 14px; }

    /* Mounted Live-Region Toast (Never toggled via display:none) */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 60;
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    /* Skeleton & Spinner */
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skel { border-radius: 10px; background: var(--subtle); animation: pulse 1.4s ease-in-out infinite; }
    .spin { animation: spin 0.8s linear infinite; }

    /* ==================== RESPONSIVE MOBILE (< 1024px — 390px Telegram Mini App / PWA) ==================== */
    @media (max-width: 1023px) {
      .desktop-only { display: none !important; }
      .field, input, textarea, select { font-size: 16px !important; } /* Prevents iOS Safari auto-zoom */
      .workspace {
        display: block;
        position: relative;
      }
      .pane-rail, .pane-center, .pane-right {
        border-right: 0;
        height: 100%;
      }
      .app-shell[data-mob-view="list"] .pane-center,
      .app-shell[data-mob-view="list"] .pane-right { display: none; }
      .app-shell[data-mob-view="detail"] .pane-rail { display: none; }
      .app-shell[data-mob-view="detail"][data-mob-sub="stream"] .pane-right { display: none; }
      .app-shell[data-mob-view="detail"][data-mob-sub="inspect"] .pane-center { display: none; }
      .mob-bottom-nav { display: grid; }
      .app-shell.ime-open .mob-bottom-nav { display: none !important; }
      .diff-old-col { display: none; } /* Single gutter on 390px */
      .accounts-page { padding: 12px; }
      .task-hero { padding: 12px 14px; }
      .timeline-wrap { padding: 12px 14px; }
      .composer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
      .inspector-foot { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (min-width: 1024px) {
      .mobile-only { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skel, .spin { animation: none !important; }
      .btn, .toast, .task-row { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell" data-mob-view="list" data-mob-sub="stream">
    <!-- ==================== TOP HEADER ==================== -->
    <header class="topbar">
      <div class="topbar-left">

  <!-- Native Accessible <dialog> for Create Task / Confirm / Proof Lightbox -->
  <dialog id="mainDialog" aria-labelledby="dlgTitle">
