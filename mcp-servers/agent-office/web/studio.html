      /* ==================== NATIVE <dialog> MODALS ==================== */
      function openDialog(title, html, focusSelector = null) {
        state.lastFocused = document.activeElement;
        $("dlgTitle").textContent = title;
        $("dlgBody").innerHTML = html;
        const dlg = $("mainDialog");
        if (!dlg.open) dlg.showModal();
        const target = focusSelector ? dlg.querySelector(focusSelector) : dlg.querySelector("input, textarea, select, button");
        if (target) target.focus();
      }

      function closeDialog() {
        const dlg = $("mainDialog");
        if (dlg.open) dlg.close();
        if (state.lastFocused && typeof state.lastFocused.focus === "function") {
          state.lastFocused.focus();
        }
      }

      function openConfirmDialog(title, message, confirmLabel, danger, onConfirm) {
        openDialog(
          title,
          `<p style="margin:0;font-size:14px;white-space:pre-line;color:var(--fg-muted);">${esc(message)}</p>
           <div class="row-gap" style="justify-content:flex-end;">
             <button type="button" id="dlgCancelBtn" class="btn" data-act="close-dlg">Huỷ</button>
             <button type="button" id="dlgConfirmBtn" class="btn ${danger ? "btn-danger-solid" : "btn-primary"}">${esc(confirmLabel)}</button>
           </div>`,
          danger ? "#dlgCancelBtn" : "#dlgConfirmBtn"
        );
        $("dlgConfirmBtn").addEventListener("click", async e => {
          await runLockedButton(e.currentTarget, async () => {
            await onConfirm();
            closeDialog();
          });
        });
      }

      function openAddTaskDialog() {
        const repos = (state.studio && state.studio.repos) || [];
        const repoOpts = repos.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
        openDialog(
          "Tạo task mới cho AAF",
          `<div><label for="dAddRepo" class="field-label">Dự án đích</label><select id="dAddRepo" class="field">${repoOpts}</select></div>
           <div class="row-gap">
             <div style="flex:1"><label for="dAddPri" class="field-label">Ưu tiên</label><select id="dAddPri" class="field"><option value="P1">P1 · Cao</option><option value="P0">P0 · Khẩn</option><option value="P2">P2 · Thường</option></select></div>
             <div style="flex:1"><label for="dAddScope" class="field-label">Phạm vi (tuỳ chọn)</label><input id="dAddScope" class="field" type="text" placeholder="vd: libs/pdf-viewer" /></div>
           </div>
           <div><label for="dAddTitle" class="field-label">Tiêu đề task</label><input id="dAddTitle" class="field" type="text" placeholder="Ngắn gọn, rõ mục tiêu…" /></div>
           <div><label for="dAddSpec" class="field-label">Mô tả kỹ thuật / Crashlytics log</label><textarea id="dAddSpec" class="field" placeholder="Dán stack trace hoặc yêu cầu chi tiết…"></textarea></div>
           <div><label for="dAddAccept" class="field-label">Tiêu chí nghiệm thu (Accept)</label><input id="dAddAccept" class="field" type="text" placeholder="vd: Unit test ĐỎ→XANH và aaf gate CLEAR" /></div>
           <p id="dAddErr" class="field-err hidden"></p>
           <button type="button" id="dAddSubmit" class="btn btn-primary btn-full">Đẩy vào hàng đợi Ready</button>`,
          "#dAddTitle"
        );
        $("dAddSubmit").addEventListener("click", async e => {
          const repo = $("dAddRepo").value;
          const priority = $("dAddPri").value;
          const scope = $("dAddScope").value.trim();
          const title = $("dAddTitle").value.trim();
          const spec = $("dAddSpec").value.trim();
          const accept = $("dAddAccept").value.trim();
          const errEl = $("dAddErr");
          if (!title || !spec || !accept) {
            errEl.textContent = "Cần nhập đủ Tiêu đề, Mô tả và Tiêu chí nghiệm thu.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(e.currentTarget, async () => {
            try {
              await apiFetch("/api/aaf/action", {
                method: "POST",
                body: { action: "add", repo, priority, scope, title, spec, accept },
              });
              closeDialog();
              showToast(`Đã tạo task mới trong ${repo}`);
              await loadStudio(true);
            } catch (err) {
              console.warn("add task failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        });
      }

      /* ==================== ACCOUNT ACTION RUNNER ==================== */
      async function runAccountAction(body) {
        const res = await apiFetch("/api/aaf/accounts/action", { method: "POST", body });
        if (res && res.state) {
          const caps = (state.accounts && state.accounts.capabilities) || { allowOAuthLogin: true, isRemote: false };
          state.accounts = Object.assign({}, res.state, { capabilities: caps });
          state.accountsLoadedAt = Date.now();
          renderHeader();
          if (state.page === "accounts") renderAccounts();
        }
        return res;
      }

      /* ==================== PAGE & MOBILE SHELL SYNC ==================== */
      function syncPages() {
        const isMob = window.innerWidth < 1024;
        $("panelWork").classList.toggle("hidden", state.page !== "work");
        $("panelAccounts").classList.toggle("hidden", state.page !== "accounts");
        $("panelMobAsk").classList.toggle("hidden", !(isMob && state.page === "ask"));

        $("navWork").setAttribute("aria-selected", String(state.page === "work"));
        $("navAccounts").setAttribute("aria-selected", String(state.page === "accounts"));
        $("mnavWork").setAttribute("aria-current", state.page === "work" ? "page" : "false");
        $("mnavAccounts").setAttribute("aria-current", state.page === "accounts" ? "page" : "false");
        $("mnavAsk").setAttribute("aria-current", state.page === "ask" ? "page" : "false");

        if (state.page === "accounts") {
          if (!state.accounts) loadAccounts(false);
          else renderAccounts();
        }
        if (state.page === "ask") renderMobAsk();
        syncMobileShell();
      }

      function syncMobileShell() {
        const app = $("app");
        app.setAttribute("data-mob-view", state.mobView);
        const inDet = window.innerWidth < 1024 && state.page === "work" && state.mobView === "detail";
        $("btnMobBack").classList.toggle("hidden", !inDet);
        $("brandWrap").classList.toggle("hidden", inDet);

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.BackButton) {
          try {
            if (inDet) tg.BackButton.show(); else tg.BackButton.hide();
          } catch (err) {
            console.warn("BackButton sync:", err);
          }
        }
      }

      /* ==================== DELEGATED EVENT HANDLERS (ZERO INLINE HANDLERS) ==================== */
      document.addEventListener("click", async e => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const act = btn.getAttribute("data-act");

        // Prevent card select when clicking quick action button inside card
        if (["approve-plan", "unblock"].includes(act)) {
          e.stopPropagation();
        }

        if (act === "toggle-theme") {
          const cur = document.documentElement.getAttribute("data-theme") || "light";
          applyTheme(cur === "dark" ? "light" : "dark");
        } else if (act === "page") {
          state.page = btn.getAttribute("data-page");
          syncPages();
        } else if (act === "mob-tab") {
          state.page = btn.getAttribute("data-tab");
          state.mobView = "list";
          syncPages();
        } else if (act === "mob-back" || act === "close-drawer") {
          closeDetailDrawer();
        } else if (act === "view-mode") {
          state.viewMode = btn.getAttribute("data-view") || "kanban";
          renderWorkArea();
        } else if (act === "toggle-cancelled") {
          state.showCancelled = !state.showCancelled;
          populateRepoSelects();
          renderWorkArea();
        } else if (act === "filter-bucket") {
          const b = btn.getAttribute("data-bucket");
          state.filterBucket = state.filterBucket === b ? "all" : b;
          renderWorkArea();
        } else if (act === "dtab") {
          state.dtab = btn.getAttribute("data-tab");
          renderDetailDrawer();
        } else if (act === "select-task") {
          state.selectedId = btn.getAttribute("data-id");
          state.drawerOpen = true;
          state.reworkOpen = false;
          state.pinnedBottom = true;
          if (window.innerWidth < 1024) state.mobView = "detail";
          renderWorkArea();
          renderDetailDrawer();
          syncMobileShell();
          await loadTaskDetail(state.selectedId);
        } else if (act === "toggle-step") {
          const k = btn.getAttribute("data-key");
          if (state.expandedSteps.has(k)) state.expandedSteps.delete(k); else state.expandedSteps.add(k);
          renderDetailDrawer();
        } else if (act === "toggle-wrap") {
          state.diffWrap = !state.diffWrap;
          renderDetailDrawer();
        } else if (act === "jump-latest") {
          state.pinnedBottom = true;
          $("drawerScroll").scrollTop = $("drawerScroll").scrollHeight;
          $("jumpLatestWrap").classList.add("hidden");
        } else if (act === "copy-val") {
          await copyText(btn.getAttribute("data-val"), "Đã copy vào clipboard");
        } else if (act === "open-add") {
          openAddTaskDialog();
        } else if (act === "close-dlg") {
          closeDialog();
        } else if (act === "toggle-btw") {
          $("btwDrawer").classList.toggle("hidden");
          if (!$("btwDrawer").classList.contains("hidden")) $("btwInput").focus();
        } else if (act === "refresh-now") {
          await runLockedButton(btn, () => loadStudio(true));
        } else if (act === "toggle-autorun") {
          const cur = Boolean(state.studio && state.studio.summary && state.studio.summary.autoRunEnabled);
          openConfirmDialog(
            cur ? "Tắt tự chạy đa repo?" : "Bật supervisor tự chạy đa repo?",
            cur ? "Các phiên đang chạy vẫn tiếp tục đến hết lượt, nhưng supervisor sẽ không nhận task mới."
                : "Supervisor sẽ tự chạy `aaf run --auto` trên các repo có task Ready.",
            cur ? "Tắt tự chạy" : "Bật tự chạy",
            false,
            async () => {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "supervisor_toggle", enabled: !cur } });
              showToast(!cur ? "Đã BẬT supervisor tự chạy" : "Đã TẮT supervisor tự chạy");
              await loadStudio(true);
            }
          );
        } else if (act === "send-steer") {
          const inp = $("steerInput");
          const errEl = $("steerErr");
          const note = inp.value.trim();
          if (!note) {
            errEl.textContent = "Nhập nội dung chỉ dẫn trước khi gửi.";
            errEl.classList.remove("hidden");
            inp.focus();
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "steer", taskId: state.selectedId, note } });
              inp.value = "";
              showToast("Đã gửi Steer cho lượt chạy kế tiếp");
              await loadTaskDetail(state.selectedId, true);
            } catch (err) {
              console.warn("steer failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "send-btw") {
          const inp = $("btwInput");
          const errEl = $("btwErr");
          const ansEl = $("btwAns");
          const q = inp.value.trim();
          if (!q) {
            errEl.textContent = "Nhập câu hỏi trước khi gửi.";
            errEl.classList.remove("hidden");
            inp.focus();
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              const res = await apiFetch("/api/aaf/ask", { method: "POST", body: { repo: $("btwRepo").value, question: q } });
              ansEl.textContent = `(${res.elapsedSec || "?"}s · Read-only)\n${res.answer || ""}`;
              ansEl.classList.remove("hidden");
            } catch (err) {
              console.warn("btw ask failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "unblock" || act === "approve-plan") {
          const tid = btn.getAttribute("data-id");
          const apiAct = act === "unblock" ? "unblock" : "approve_plan";
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: apiAct, taskId: tid } });
              showToast(act === "unblock" ? `Đã mở khoá ${tid}` : `Đã duyệt kế hoạch ${tid}`);
              await loadStudio(true);
            } catch (err) {
              console.warn(apiAct, err);
              showToast(`Lỗi: ${err.message}`);
            }
          });
        } else if (act === "open-rework") {
          state.reworkOpen = true;
          renderDetailDrawer();
          if ($("reworkInput")) $("reworkInput").focus();
        } else if (act === "cancel-rework") {
          state.reworkOpen = false;
          renderDetailDrawer();
        } else if (act === "submit-rework") {
          const tid = btn.getAttribute("data-id");
          const reason = ($("reworkInput") && $("reworkInput").value.trim()) || "";
          if (!reason) { showToast("Bắt buộc nhập lý do --reason"); return; }
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "rework", taskId: tid, reason, rerun: true } });
              state.reworkOpen = false;
              state.drafts.delete("rework:" + tid);
              showToast(`Đã đẩy ${tid} về Rework`);
              await loadStudio(true);
            } catch (err) {
              console.warn("rework failed:", err);
              showToast(`Lỗi rework: ${err.message}`);
            }
          });
        } else if (act === "confirm-stop") {
          const runId = btn.getAttribute("data-run");
          const tid = btn.getAttribute("data-id");
          openConfirmDialog(
            `Dừng khẩn cấp phiên ${tid}?`,
            `Gửi tín hiệu SIGTERM tới tiến trình agent đang chạy trong worktree của run ${runId}.`,
            "Dừng ngay (SIGTERM)",
            true,
            async () => {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "stop", runId, confirm: true } });
              showToast(`Đã gửi lệnh dừng tới ${tid}`);
              await loadStudio(true);
            }
          );
        } else if (act === "open-proof") {
          const url = btn.getAttribute("data-url");
          const name = btn.getAttribute("data-name");
          openDialog(name || "Ảnh nghiệm thu", `<img src="${esc(url)}" alt="${esc(name)}" style="width:100%;border-radius:10px;border:1px solid var(--border);" />`);
        } else if (act === "acc-refresh") {
          await runLockedButton(btn, () => loadAccounts(true, true));
        } else if (act === "acc-switch") {
          const profile = btn.getAttribute("data-profile");
          const pName = pShort(profile, (state.accounts && state.accounts.profiles) || []);
          openConfirmDialog(
            `Chuyển sang ${pName}?`,
            "CC Switch sẽ dùng tài khoản này cho phiên Claude Code / Antigravity mới. Phiên đang mở giữ nguyên tài khoản cũ.",
            "Chuyển",
            false,
            async () => {
              try {
                const res = await runAccountAction({ action: "switch", target: profile });
                if (res && res.needsForce) {
                  const cl = res.code === "CLAUDE_COOLDOWN_ACTIVE";
                  setTimeout(() => {
                    openConfirmDialog(
                      `Ép chuyển sang ${pName}?`,
                      `${cl ? "Đang trong thời gian nghỉ chống ban giữa hai tài khoản Claude." : "Tài khoản này đang đóng băng vì chạm 429."}\n\n${res.hint || res.error || ""}\n\nÉp chuyển ngay sẽ bỏ qua bảo vệ này.`,
                      "Ép chuyển ngay",
                      true,
                      async () => {
                        await runAccountAction({ action: "switch", target: profile, force: true });
                        showToast(`Đã chuyển sang ${pName}`);
                        await loadAccounts(false, true);
                      }
                    );
                  }, 50);
                } else {
                  showToast((res && res.message) || `Đã chuyển sang ${pName}`);
                  await loadAccounts(false, true);
                }
              } catch (err) {
                console.warn("switch failed:", err);
                showToast(`Lỗi đổi tài khoản: ${err.message}`);
              }
            }
          );
        } else if (act === "acc-login") {
          const profile = btn.getAttribute("data-profile");
          await runLockedButton(btn, async () => {
            try {
              const res = await runAccountAction({ action: "login", target: profile });
              showToast((res && res.message) || `Đã mở đăng nhập cho ${profile}`);
              await loadAccounts(false, true);
            } catch (err) {
              console.warn("login failed:", err);
              showToast(`Lỗi đăng nhập: ${err.message}`);
            }
          });
        } else if (act === "acc-cooldown") {
          const minutes = Number(btn.getAttribute("data-min"));
          await runLockedButton(btn, async () => {
            try {
              const res = await runAccountAction({ action: "cooldown", minutes });
              showToast((res && res.message) || (minutes === 0 ? "Đã tắt thời gian nghỉ chống ban" : `Đã đặt thời gian nghỉ ${minutes} phút`));
            } catch (err) {
              console.warn("cooldown failed:", err);
              showToast(`Lỗi đặt cooldown: ${err.message}`);
            }
          });
        } else if (act === "acc-confirm") {
          const cc = btn.getAttribute("data-cc");
          const mode = btn.getAttribute("data-mode");
          const activeName = state.accounts && state.accounts.activeProfile ? splitName(state.accounts.activeProfile.name).title : "";
          const freezeHrs = state.accounts && state.accounts.antiBan ? Math.round((state.accounts.antiBan.rateLimitFreezeSec || 18000) / 3600 * 10) / 10 : 5;
          const cfg = {
            rotate: ["Đổi sang tài khoản kế tiếp?", "Xoay vòng qua các tài khoản Claude theo thứ tự 1 → 2 → 3 → 7 (không sang Antigravity), bỏ qua tài khoản đang đóng băng.", "Đổi", false],
            limit: ["Báo tài khoản hiện tại chạm 429?", `Đóng băng "${activeName}" ${freezeHrs} giờ và chuyển ngay sang tài khoản an toàn kế tiếp.`, "Đóng băng & đổi", true],
            unfreeze: ["Mở khóa toàn bộ?", "Xóa mọi đóng băng 429 và đặt lại thời gian nghỉ chống ban về 0. Chỉ làm khi chắc quota đã hồi.", "Mở khóa", true],
            balance: mode === "swap"
              ? ["Đảo nhóm repo?", "Repo đang gán FinOS chuyển sang FinOS Team và ngược lại; repo gán tài khoản khác giữ nguyên.", "Đảo nhóm", false]
              : ["Chia đều repo 3/3?", "Gán lại 3 repo cho FinOS và 3 repo cho FinOS Team theo mặc định.", "Chia đều", false],
          }[cc];
          if (!cfg) return;
          openConfirmDialog(cfg[0], cfg[1], cfg[2], cfg[3], async () => {
            try {
              const body = mode ? { action: cc, mode } : { action: cc };
              const res = await runAccountAction(body);
              showToast((res && res.message) || `Hoàn tất ${cc}`);
              await loadAccounts(false, true);
            } catch (err) {
              console.warn("cc action failed:", err);
              showToast(`Lỗi: ${err.message}`);
            }
          });
        } else if (act === "ra-save") {
          const repo = btn.getAttribute("data-repo");
          const account = state.pendingRepoAssign.get(repo);
          if (!account) return;
          const rp = ((state.accounts && state.accounts.repoAssignments) || []).find(x => x.path === repo);
          const profiles = (state.accounts && state.accounts.profiles) || [];
          openConfirmDialog(
            `Gán ${(rp && rp.name) || repo.split("/").pop()} → ${pShort(account, profiles)}?`,
            `${repo}\n\nGhi "account" vào .claude/settings.local.json (giữ nguyên các khóa khác). Phiên mới trong repo và worktree sẽ dùng tài khoản này.`,
            "Gán tài khoản",
            false,
            async () => {
              try {
                const res = await runAccountAction({ action: "repo_assign", repo, account });
                state.pendingRepoAssign.delete(repo);
                showToast((res && res.message) || `Đã gán ${pShort(account, profiles)}`);
                await loadAccounts(false, true);
              } catch (err) {
                console.warn("repo_assign failed:", err);
                showToast(`Lỗi gán repo: ${err.message}`);
              }
            }
          );
        } else if (act === "ra-remove") {
          const repo = btn.getAttribute("data-repo");
          const rp = ((state.accounts && state.accounts.repoAssignments) || []).find(x => x.path === repo);
          openConfirmDialog(
            `Gỡ ${(rp && rp.name) || repo.split("/").pop()} khỏi cc-switcher?`,
            `${repo}\n\nBỏ repo khỏi danh sách và xóa khóa "account" trong .claude/settings.local.json (quay về ~/.claude mặc định).`,
            "Gỡ repo",
            true,
            async () => {
              try {
                const res = await runAccountAction({ action: "repo_remove", repo });
                state.pendingRepoAssign.delete(repo);
                showToast((res && res.message) || "Đã gỡ repo");
                await loadAccounts(false, true);
              } catch (err) {
                console.warn("repo_remove failed:", err);
                showToast(`Lỗi gỡ repo: ${err.message}`);
              }
            }
          );
        } else if (act === "mob-ask-mode") {
          state.mobAskMode = btn.getAttribute("data-mode");
          renderMobAsk();
        } else if (act === "mob-submit-add") {
          const repo = $("mAddRepo").value;
          const title = $("mAddTitle").value.trim();
          const spec = $("mAddSpec").value.trim();
          const accept = $("mAddAccept").value.trim();
          const errEl = $("mAddErr");
          if (!title || !spec || !accept) {
            errEl.textContent = "Cần nhập đủ Tiêu đề, Mô tả và Tiêu chí nghiệm thu.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              await apiFetch("/api/aaf/action", { method: "POST", body: { action: "add", repo, title, spec, accept, priority: "P1" } });
              ["mAddTitle", "mAddSpec", "mAddAccept"].forEach(k => state.drafts.delete(k));
              state.page = "work";
              syncPages();
              showToast(`Đã tạo task mới trong ${repo}`);
              await loadStudio(true);
            } catch (err) {
              console.warn("mob add failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        } else if (act === "mob-submit-btw") {
          const repo = $("mBtwRepo").value;
          const q = $("mBtwQ").value.trim();
          const errEl = $("mBtwErr");
          const ansEl = $("mBtwAns");
          if (!q) {
            errEl.textContent = "Nhập câu hỏi trước khi gửi.";
            errEl.classList.remove("hidden");
            return;
          }
          errEl.classList.add("hidden");
          await runLockedButton(btn, async () => {
            try {
              const res = await apiFetch("/api/aaf/ask", { method: "POST", body: { repo, question: q } });
              ansEl.textContent = `(${res.elapsedSec || "?"}s · Read-only)\n${res.answer || ""}`;
              ansEl.classList.remove("hidden");
            } catch (err) {
              console.warn("mob btw failed:", err);
              errEl.textContent = err.message;
              errEl.classList.remove("hidden");
            }
          });
        }
      });

      document.addEventListener("submit", async e => {
        if (e.target && e.target.id === "cdCustomForm") {
          e.preventDefault();
          const inp = $("cdInput");
          const v = inp.value.trim();
          const n = Number(v);
          if (v === "" || !Number.isInteger(n) || n < 0 || n > 1440) {
            showToast("Nhập số phút nguyên từ 0 đến 1440.");
            inp.focus();
            return;
          }
          const subBtn = e.submitter || e.target.querySelector('button[type="submit"]');
          await runLockedButton(subBtn, async () => {
            try {
              const res = await runAccountAction({ action: "cooldown", minutes: n });
              inp.value = "";
              showToast((res && res.message) || `Đã đặt thời gian nghỉ ${n} phút`);
            } catch (err) {
              console.warn("custom cooldown failed:", err);
              showToast(`Lỗi: ${err.message}`);
            }
          });
        } else if (e.target && e.target.id === "repoAddForm") {
          e.preventDefault();
          const path = $("raPath").value.trim().replace(/\/+$/, "");
          const name = $("raName").value.trim();
          const acc = $("raAcc").value;
          if (!path.startsWith("/")) {
            showToast("Nhập đường dẫn tuyệt đối, bắt đầu bằng /.");
            $("raPath").focus();
            return;
          }
          const profiles = (state.accounts && state.accounts.profiles) || [];
          openConfirmDialog(
            `Thêm repo → ${pShort(acc, profiles)}?`,
            `${path}${name ? `\nTên: ${name}` : ""}\n\nThêm vào danh sách cc-switcher và ghi "account": "${acc}" vào .claude/settings.local.json.`,
            "Thêm repo",
            false,
            async () => {
              try {
                const body = { action: "repo_add", repo: path, account: acc };
                if (name) body.name = name;
                const res = await runAccountAction(body);
                $("raPath").value = "";
                $("raName").value = "";
                showToast((res && res.message) || "Đã thêm repo");
                await loadAccounts(false, true);
              } catch (err) {
                console.warn("repo_add failed:", err);
                showToast(`Lỗi thêm repo: ${err.message}`);
              }
            }
          );
        }
      });

      document.addEventListener("input", e => {
        const el = e.target;
        if (el.id === "searchInput") {
          state.search = el.value;
          renderWorkArea();
        } else if (el.id === "reworkInput") {
          state.drafts.set("rework:" + state.selectedId, el.value);
        } else if (["mAddTitle", "mAddSpec", "mAddAccept", "mBtwQ"].includes(el.id)) {
          state.drafts.set(el.id, el.value);
        }
      });

      document.addEventListener("change", e => {
        const el = e.target;
        if (el.id === "repoFilter") {
          state.repoFilter = el.value;
          renderWorkArea();
        } else if (el.getAttribute("data-act") === "ra-pick") {
          const repo = el.getAttribute("data-repo");
          const rp = ((state.accounts && state.accounts.repoAssignments) || []).find(x => x.path === repo);
          const cur = rp && rp.pinnedInFile ? (rp.account || "") : "";
          if (el.value === cur) state.pendingRepoAssign.delete(repo);
          else state.pendingRepoAssign.set(repo, el.value);
          renderAccounts();
        }
      });

      /* Keyboard shortcuts (⌘K search, ⌘↵ steer, Esc close drawer, Enter on Kanban card, Tablist arrows) */
      document.addEventListener("keydown", e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          state.page = "work";
          syncPages();
          $("searchInput").focus();
        } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement === $("steerInput")) {
          e.preventDefault();
          $("btnSteerSend").click();
        } else if (e.key === "Escape" && !$("mainDialog").open && state.drawerOpen) {
          closeDetailDrawer();
        } else if ((e.key === "Enter" || e.key === " ") && e.target && e.target.classList && e.target.classList.contains("k-card")) {
          e.preventDefault();
          e.target.click();
        } else if (e.target && e.target.getAttribute("role") === "tab") {
          const list = e.target.closest('[role="tablist"]');
          if (!list) return;
          const tabs = Array.from(list.querySelectorAll('[role="tab"]'));
          const idx = tabs.indexOf(e.target);
          let next = -1;
          if (e.key === "ArrowRight") next = (idx + 1) % tabs.length;
          else if (e.key === "ArrowLeft") next = (idx - 1 + tabs.length) % tabs.length;
          else if (e.key === "Home") next = 0;
          else if (e.key === "End") next = tabs.length - 1;
          if (next >= 0) {
            e.preventDefault();
            tabs[next].focus();
            tabs[next].click();
          }
        }
      });

      $("drawerScroll").addEventListener("scroll", () => {
        if (state.dtab !== "stream") return;
        const el = $("drawerScroll");
        state.pinnedBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 36;
        $("jumpLatestWrap").classList.toggle("hidden", state.pinnedBottom);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewportHeight);
      }
      window.addEventListener("resize", () => { syncViewportHeight(); syncPages(); renderWorkArea(); });

      /* Lifecycle-aware polling + live 1s anti-ban countdown */
      const pollStudioId = setInterval(() => {
        if (document.hidden) return;
        renderHeader();
        loadStudio(true);
      }, 6000);
      const pollAccId = setInterval(() => {
        if (document.hidden) return;
        loadAccounts(false, true);
      }, 20000);
      const cdTickId = setInterval(() => {
        if (document.hidden) return;
        const n = $("cdLive");
        if (n && state.accounts && state.accounts.antiBan) {
          const cl = cooldownLeftSec();
          n.textContent = cl > 0 ? `Chờ ${fmtDur(cl)}` : "Đổi ngay được";
        }
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          loadStudio(true);
          loadAccounts(false, true);
        }
      });
      window.addEventListener("beforeunload", () => {
        clearInterval(pollStudioId);
        clearInterval(pollAccId);
        clearInterval(cdTickId);
      });

      /* Boot: load both Studio tasks and CC-Switcher accounts (for header pill & instant tab switch) */
      initThemeAndTelegram();
      syncViewportHeight();
      syncPages();
      loadStudio(false);
      loadAccounts(false, true);
    })();
  </script>
</body>
</html>
