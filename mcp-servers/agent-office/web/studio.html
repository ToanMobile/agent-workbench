  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const TZ = "Asia/Ho_Chi_Minh";
      const REASONS = {
        web_ui_switch: "Web",
        web_ui_force_switch: "Web (ép chuyển)",
        web_ui_rotate: "Web: xoay vòng",
        web_ui_limit_429: "Web: báo 429",
        log_detected_429: "Tự động: phát hiện 429 trong log",
        auto_rotate: "Tự động xoay",
        manual_switch: "MCP / CLI",
        mcp_tool_switch: "MCP Tool",
        telegram_ui_switch: "Telegram (cũ)",
        telegram_ui_force_switch: "Telegram (cũ, ép)",
        telegram_ui_rotate: "Telegram (cũ)",
        telegram_ui_limit_429: "Telegram (cũ): báo 429",
        telegram_remote_switch: "Telegram (cũ)",
        telegram_rotate: "Telegram (cũ)",
        telegram_reported_429: "Telegram (cũ): báo 429",
      };

      const state = {
        page: "work",          // work | accounts | ask (mobile)
        viewMode: "kanban",    // kanban | list
        mobView: "list",       // list | detail
        mobAskMode: "add",     // add | btw
        dtab: "stream",        // stream | diff | plan | proof
        filterBucket: "all",   // all | urgent | running | ready | done
        repoFilter: "all",
        showCancelled: false,
        search: "",
        diffWrap: false,
        studio: null,
        detail: null,
        accounts: null,
        accountsLoadedAt: 0,
        selectedId: "",
        drawerOpen: false,
        expandedSteps: new Set(),
        drafts: new Map(),
        lastSyncedMs: 0,
        lastError: "",
        loadingStudio: true,
        loadingAccounts: false,
        inFlightStudio: null,
        inFlightAccounts: null,
        sessionToken: "",
        pinnedBottom: true,
        pendingRepoAssign: new Map(),
        reworkOpen: false,
        lastFocused: null,
      };

      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));

      /* ==================== TIME & FORMAT HELPERS ==================== */
      function fmtTime(ms, withDate = false) {
        if (!ms || !Number.isFinite(Number(ms))) return "—";
        const o = { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false };
        if (withDate) { o.day = "2-digit"; o.month = "2-digit"; }
        try {
          return new Intl.DateTimeFormat("vi-VN", o).format(new Date(Number(ms)));
        } catch (err) {
          console.warn("fmtTime failed:", err);
          return "—";
        }
      }

      function fmtClockSec(ms) {
        if (!ms) return "—";
        try {
          return new Intl.DateTimeFormat("vi-VN", {
            timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
          }).format(new Date(Number(ms)));
        } catch (err) {
          console.warn("fmtClockSec failed:", err);
          return "—";
        }
      }

      function fmtDur(sec) {
        sec = Math.max(0, Math.round(Number(sec) || 0));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        if (h) return `${h} giờ ${m} phút`;
        if (m) return `${m} phút ${s < 10 ? "0" : ""}${s} giây`;
        return `${s} giây`;
      }

      function ago(ms) {
        if (!ms) return "chưa có";
        const d = Math.max(0, (Date.now() - Number(ms)) / 1000);
        if (d < 60) return "vừa xong";
        if (d < 3600) return `${Math.floor(d / 60)} phút trước`;
        if (d < 86400) return `${Math.floor(d / 3600)} giờ trước`;
        return fmtTime(ms, true);
      }

      function splitName(name) {
        const parts = String(name || "").split(" — ");
        return { title: parts[0] || "", detail: parts.slice(1).join(" — ") };
      }

      function accDriftMs() {
        return state.accountsLoadedAt ? (Date.now() - state.accountsLoadedAt) : 0;
      }

      function cooldownLeftSec() {
        const ab = state.accounts && state.accounts.antiBan;
        if (!ab) return 0;
        return Math.max(0, (Number(ab.claudeCooldownRemainSec) || 0) - accDriftMs() / 1000);
      }

      /* ==================== STRUCTURED PARSERS (NO RAW JSON LEAKS) ==================== */
      function parseSpec(raw) {
        if (!raw) return { description: "", acceptance: [], extra: null };
        const txt = String(raw).trim();
        if (txt.startsWith("{")) {
          try {
            const obj = JSON.parse(txt);
            if (obj && typeof obj === "object" && !Array.isArray(obj)) {
              const description = String(obj.description || obj.summary || obj.goal || "").trim();
              const accRaw = obj.acceptance || obj.criteria || obj.checks || [];
              const acceptance = Array.isArray(accRaw) ? accRaw.map(x => String(x)).filter(Boolean) : (accRaw ? [String(accRaw)] : []);
              const extra = {};
              Object.keys(obj).forEach(k => {
                if (!["description", "summary", "goal", "acceptance", "criteria", "checks"].includes(k)) {
                  extra[k] = obj[k];
                }
              });
              return { description, acceptance, extra: Object.keys(extra).length ? extra : null };
            }
          } catch (err) {
            console.warn("Spec JSON parse fallback to text:", err);
          }
        }
        return { description: txt, acceptance: [], extra: null };
      }

      function parseNotes(raw) {
        if (!raw) return [];
        const txt = String(raw).trim();
        if (!txt || txt === "[]") return [];
        if (txt.startsWith("[")) {
          try {
            const arr = JSON.parse(txt);
            if (Array.isArray(arr)) {
              return arr.map(item => typeof item === "string" ? item : (item && (item.note || item.text || item.message) ? String(item.note || item.text || item.message) : JSON.stringify(item))).filter(Boolean);
            }
          } catch (err) {
            console.warn("Notes JSON parse fallback:", err);
          }
        }
        return [txt];
      }

      function formatStreamEvent(ev, idx) {
        const rawTs = ev && (ev.ts || ev.timestamp || ev.time);
        const tsMs = rawTs ? (Number(rawTs) < 1e12 ? Number(rawTs) * 1000 : Number(rawTs)) : 0;
        const clock = tsMs ? fmtClockSec(tsMs) : "";
        const type = String((ev && ev.type) || "").toLowerCase();
        const tool = String((ev && (ev.tool || ev.tool_name)) || "");
        let label = ev && ev.title ? String(ev.title) : "";
        if (!label) {
          if (type === "start" && tool) label = `Khởi chạy ${tool}`;
          else if (type === "assistant") label = "Phản hồi của agent";
          else if (type === "result") label = "Kết thúc lượt chạy";
          else if (type === "tool_use" && tool) label = `Dùng công cụ: ${tool}`;
          else if (tool) label = tool;
          else if (type) label = ev.subtype ? `${type}: ${ev.subtype}` : type;
          else label = `Bước ${idx + 1}`;
        }
        let summary = "";
        if (typeof ev.text === "string" && ev.text.trim()) summary = ev.text.trim();
        else if (typeof ev.message === "string" && ev.message.trim()) summary = ev.message.trim();
        else if (typeof ev.result === "string" && ev.result.trim()) summary = ev.result.trim();
        else if (typeof ev.out === "string" && ev.out.trim()) summary = ev.out.trim();
        else if (typeof ev.output === "string" && ev.output.trim()) summary = ev.output.trim();
        else if (ev && ev.message && Array.isArray(ev.message.content)) {
          summary = ev.message.content.map(c => (c && (c.text || c.name)) || "").filter(Boolean).join(" ").trim();
        }
        const dur = ev && (ev.dur || ev.duration_ms) ? String(ev.dur || (ev.duration_ms + "ms")) : "";
        const detail = summary || JSON.stringify(ev, null, 2);
        return { label, clock, dur, preview: summary.slice(0, 120), detail };
      }

      /* ==================== THEME + TELEGRAM WEBAPP BRIDGE ==================== */
      function syncThemeBtn() {
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        const btn = $("btnTheme");
        if (btn) btn.textContent = dark ? "Ca ngày" : "Ca đêm";
      }

      function applyTheme(mode) {
        const dark = mode === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("agent-office-theme", dark ? "dark" : "light");
        } catch (err) {
          console.warn("theme storage unavailable:", err);
        }
        syncThemeBtn();
      }

      function applyTelegramTheme(tg) {
        if (!tg) return;
        applyTheme(tg.colorScheme === "dark" ? "dark" : "light");
        const tp = tg.themeParams || {};
        const root = document.documentElement.style;
        if (tp.bg_color) root.setProperty("--bg", tp.bg_color);
        if (tp.secondary_bg_color) root.setProperty("--sidebar", tp.secondary_bg_color);
        if (tp.text_color) root.setProperty("--fg", tp.text_color);
        if (tp.hint_color) root.setProperty("--fg-muted", tp.hint_color);
        if (tp.button_color) root.setProperty("--c-primary", tp.button_color);
        if (tp.button_text_color) root.setProperty("--fg-on-primary", tp.button_text_color);
      }

      function initThemeAndTelegram() {
        syncThemeBtn();
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initData) {
          try {
            tg.ready();
            tg.expand();
            applyTelegramTheme(tg);
            tg.onEvent("themeChanged", () => applyTelegramTheme(tg));
            tg.onEvent("viewportChanged", syncViewportHeight);
            if (tg.BackButton) {
              tg.BackButton.onClick(() => {
                if ($("mainDialog").open) { closeDialog(); return; }
                if (state.drawerOpen || state.mobView === "detail") {
                  closeDetailDrawer();
                }
              });
            }
          } catch (err) {
            console.warn("Telegram WebApp init warning:", err);
          }
        }
      }

      function syncViewportHeight() {
        const vv = window.visualViewport;
        const tg = window.Telegram && window.Telegram.WebApp;
        const h = (vv && vv.height) || (tg && tg.viewportStableHeight) || window.innerHeight;
        document.documentElement.style.setProperty("--app-h", `${Math.round(h)}px`);
        const imeOpen = vv ? (window.innerHeight - vv.height > 120) : false;
        $("app").classList.toggle("ime-open", imeOpen);
      }

      /* ==================== AUTH, FETCH & LOCKED BUTTONS ==================== */
      let _toastTimer = null;
      function showToast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
      }

      async function ensureRemoteSession() {
        if (state.sessionToken) return;
        const tg = window.Telegram && window.Telegram.WebApp;
        const initData = tg && tg.initData ? tg.initData : "";
        if (!initData) return;
        try {
          const resp = await fetch("/api/aaf/auth", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-AAF-Studio": "1",
              "X-Telegram-Init-Data": initData,
            },
            body: "{}",
            signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
          });
          if (resp.ok) {
            const d = await resp.json();
            if (d && d.sessionToken) state.sessionToken = d.sessionToken;
          }
        } catch (err) {
          console.warn("Telegram session exchange skipped:", err);
        }
      }

      async function apiFetch(url, opts = {}) {
        const method = (opts.method || "GET").toUpperCase();
        const headers = Object.assign({
          "X-AAF-Studio": "1",
          "X-Agent-Office": "1",
        }, opts.headers || {});
        const tg = window.Telegram && window.Telegram.WebApp;
        if (state.sessionToken) {
          headers["X-AAF-Session"] = state.sessionToken;
        } else if (tg && tg.initData) {
          headers["X-Telegram-Init-Data"] = tg.initData;
        }
        const fetchOpts = {
          method,
          headers,
          cache: "no-store",
          signal: AbortSignal.timeout ? AbortSignal.timeout(35000) : undefined,
        };
        if (method !== "GET" && opts.body !== undefined) {
          headers["Content-Type"] = "application/json";
          fetchOpts.body = typeof opts.body === "string" ? opts.body : JSON.stringify(opts.body);
        }
        const res = await fetch(url, fetchOpts);
        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch (err) {
          console.warn("Non-JSON response:", err);
          data = { ok: false, error: text.slice(0, 200) || `HTTP ${res.status}` };
        }
        if (!res.ok && !data.needsForce) {
          const e = new Error(data.error || `HTTP ${res.status}`);
          e.status = res.status;
          e.data = data;
          throw e;
        }
        return data;
      }

      async function runLockedButton(btn, fn) {
        if (!btn || btn.disabled) return;
        const origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.setAttribute("aria-busy", "true");
        btn.innerHTML = `<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg><span>Đang xử lý…</span>`;
        try {
          await Promise.all([Promise.resolve().then(fn), sleep(1000)]);
        } finally {
          btn.disabled = false;
          btn.removeAttribute("aria-busy");
          btn.innerHTML = origHtml;
        }
      }

      async function copyText(txt, okMsg) {
        if (!txt) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(txt);
            showToast(okMsg || "Đã copy");
            return;
          }
        } catch (err) {
          console.warn("clipboard API fallback:", err);
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = txt;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(ok ? (okMsg || "Đã copy") : "Không thể copy tự động");
        } catch (err) {
          console.warn("execCommand copy failed:", err);
          showToast("Không thể copy — hãy bôi đen copy thủ công");
        }
      }

      /* ==================== STATUS HELPERS (6-STAGE GITHUB / AAF WORKFLOW) ==================== */
      function taskBucket(t) {
        const st = String(t.state || "").toLowerCase();
        if (st === "cancelled") return "cancelled";
        if (st === "blocked" || t.frozen) return "blocked";
        if (st === "done") return "done";
        if (st === "review") return "review";
        if (st === "gating" || st === "qa") return "qa";
        if (st === "running" || st === "building") return "building";
        return "ready"; // ready | backlog
      }

      function statusChipHtml(st, kind) {
        if (kind === "manual" && st === "running") {
          return `<span class="chip chip-warn"><span class="dot live" style="background:var(--c-warn)"></span><span>Terminal</span></span>`;
        }
        const map = {
          blocked: ["chip-err", "Blocked", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`],
          review: ["chip-review", "Review", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`],
          running: ["chip-warn", "Building", `<span class="dot live" style="background:var(--c-warn)"></span>`],
          building: ["chip-warn", "Building", `<span class="dot live" style="background:var(--c-warn)"></span>`],
          gating: ["chip-qa", "QA Gate", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>`],
          qa: ["chip-qa", "QA", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>`],
          done: ["chip-success", "Done", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>`],
          cancelled: ["", "Đã huỷ", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>`],
          backlog: ["", "Backlog", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`],
          ready: ["chip-primary", "Ready", `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`],
        };
        const [cls, lbl, ic] = map[st] || ["", st || "Ready", map.ready[2]];
        return `<span class="chip ${cls}">${ic}<span>${lbl}</span></span>`;
      }

      function priorityBadgeHtml(pri) {
        if (!pri || pri === "—") return "";
        const cls = pri === "P0" ? "chip-err" : pri === "P1" ? "chip-warn" : "";
        return `<span class="chip ${cls} mono" style="padding:1px 7px;font-size:11px;">${esc(pri)}</span>`;
      }

      function repoColor(repoId) {
        const list = (state.studio && state.studio.repos) || [];
        const idx = Math.max(0, list.findIndex(r => r.id === repoId));
        return `var(--repo-${idx % 6})`;
      }

      /* ==================== DATA LOADING & POLLING ==================== */
      async function loadStudio(silent = false) {
        if (state.inFlightStudio) return state.inFlightStudio;
        if (!silent) {
          state.loadingStudio = true;
          renderWorkArea();
        }
        state.inFlightStudio = (async () => {
          try {
            await ensureRemoteSession();
            const data = await apiFetch("/api/aaf/studio");
            state.studio = data;
            state.lastSyncedMs = Date.now();
            state.lastError = "";
            state.loadingStudio = false;
            const tasks = data.tasks || [];
            if (state.selectedId && !tasks.some(t => t.id === state.selectedId)) {
              state.selectedId = "";
              state.drawerOpen = false;
              state.detail = null;
            }
            populateRepoSelects();
            renderHeader();
            renderWorkArea();
            if (state.drawerOpen && state.selectedId) {
              await loadTaskDetail(state.selectedId, true);
            }
          } catch (err) {
            console.warn("loadStudio error:", err);
            state.lastError = err.message || "Không kết nối được AAF Hub";
            state.loadingStudio = false;
            renderHeader();
            if (!state.studio) renderWorkArea();
          } finally {
            state.inFlightStudio = null;
          }
        })();
        return state.inFlightStudio;
      }

      async function loadTaskDetail(taskId, silent = false) {
        if (!taskId || taskId.startsWith("manual-")) {
          const manual = ((state.studio && state.studio.tasks) || []).find(t => t.id === taskId) || null;
          state.detail = manual ? {
            ok: true,
            task: manual,
            stream: { events: [] },
            diff: { available: false, reason: "Phiên mở tay Terminal (chỉ đọc)" },
            handover: { available: false },
            proof: { available: false, images: [] },
          } : null;
          renderDetailDrawer();
          return;
        }
        try {
          const det = await apiFetch(`/api/aaf/task/detail?id=${encodeURIComponent(taskId)}`);
          if (state.selectedId === taskId) {
            state.detail = det;
            renderDetailDrawer();
          }
        } catch (err) {
          console.warn("loadTaskDetail error:", err);
          if (!silent) showToast(`Không tải được chi tiết ${taskId}: ${err.message}`);
        }
      }

      async function loadAccounts(refresh = false, silent = false) {
        if (state.inFlightAccounts && !refresh) return state.inFlightAccounts;
        if (!silent) {
          state.loadingAccounts = true;
          if (state.page === "accounts") renderAccounts();
        }
        state.inFlightAccounts = (async () => {
          try {
            await ensureRemoteSession();
            const url = refresh ? "/api/aaf/accounts?refresh=1" : "/api/aaf/accounts";
            state.accounts = await apiFetch(url);
            state.accountsLoadedAt = Date.now();
          } catch (err) {
            console.warn("loadAccounts error:", err);
            if (!state.accounts) state.accounts = { ok: false, error: err.message };
            else showToast(`Không làm mới được quota: ${err.message}`);
          } finally {
            state.loadingAccounts = false;
            state.inFlightAccounts = null;
            renderHeader();
            if (state.page === "accounts") renderAccounts();
          }
        })();
        return state.inFlightAccounts;
      }

      /* ==================== RENDER: HEADER & TOP ACCOUNT PILL ==================== */
      function renderHeader() {
        const s = state.studio;
        const conn = $("connChip");
        const stale = $("staleBanner");
        const ageSec = state.lastSyncedMs ? Math.floor((Date.now() - state.lastSyncedMs) / 1000) : 0;

        if (state.lastError) {
          conn.className = "chip chip-err tnum";
          conn.textContent = "Offline";
          stale.className = "stale-banner err";
          $("staleText").textContent = `Mất kết nối máy Mac: ${state.lastError}`;
        } else if (state.lastSyncedMs && ageSec > 15) {
          conn.className = "chip chip-warn tnum";
          conn.textContent = `Cũ ${ageSec}s`;
          stale.className = "stale-banner";
          $("staleText").textContent = `Dữ liệu chưa cập nhật ${ageSec} giây trước`;
        } else {
          conn.className = "chip chip-success tnum";
          conn.textContent = "Mac Online";
          stale.className = "stale-banner hidden";
        }

        if (s) {
          const isRemote = Boolean(s.capabilities && s.capabilities.isRemote);
          $("linkOffice").classList.toggle("hidden", isRemote);
        }

        if (s && s.summary) {
          $("slotChip").textContent = `Slots ${s.summary.slotsHeld}/${s.summary.slotsMax}`;
          const ar = $("btnAutoRun");
          const on = Boolean(s.summary.autoRunEnabled);
          ar.setAttribute("aria-pressed", String(on));
          ar.textContent = on ? "Tự chạy: BẬT" : "Tự chạy: TẮT";

          const tasks = s.tasks || [];
          const urgentN = tasks.filter(t => { const b = taskBucket(t); return b === "blocked" || b === "review"; }).length;
          const activeN = tasks.filter(t => { const b = taskBucket(t); return b === "building" || b === "qa"; }).length;
          const badge = $("navWorkBadge");
          if (urgentN > 0) {
            badge.textContent = String(urgentN);
            badge.className = "nav-count alert tnum";
          } else if (activeN > 0) {
            badge.textContent = String(activeN);
            badge.className = "nav-count live tnum";
          } else {
            badge.className = "nav-count hidden";
          }
        }

        // Topbar active account + 5h/7d pill
        const acc = state.accounts;
        const dotTop = $("topAccDot");
        const dotNav = $("navAccDot");
        if (acc && acc.ok !== false && acc.activeProfile) {
          const ap = acc.activeProfile;
          const title = splitName(ap.name).title || ap.id;
          $("topAccName").textContent = title;
          const qParts = [];
          if (ap.vendor === "anthropic") {
            if (ap.remainingPct != null) qParts.push(`5h ${ap.remainingPct}%`);
            if (ap.weeklyRemainingPct != null) qParts.push(`7d ${ap.weeklyRemainingPct}%`);
          } else {
            qParts.push("Chọn tay");
          }
          $("topAccQuota").textContent = qParts.join(" · ");
          const low = ap.isFrozen || (ap.remainingPct != null && ap.remainingPct <= 15) || (ap.weeklyRemainingPct != null && ap.weeklyRemainingPct <= 15);
          const warn = !low && ((ap.remainingPct != null && ap.remainingPct <= 40) || (ap.weeklyRemainingPct != null && ap.weeklyRemainingPct <= 40) || (acc.health && !acc.health.daemon.running));
          const cls = "dot" + (low ? " err" : warn ? " warn" : "");
          dotTop.className = cls;
          dotNav.className = cls;
        } else if (acc && acc.ok === false) {
          $("topAccName").textContent = "Lỗi CC-Switcher";
          $("topAccQuota").textContent = "";
          dotTop.className = "dot err";
          dotNav.className = "dot err";
        }
      }

      function populateRepoSelects() {
        const repos = (state.studio && state.studio.repos) || [];
        const tasks = (state.studio && state.studio.tasks) || [];
        const btwSel = $("btwRepo");
        if (btwSel && repos.length) {
          const prev = btwSel.value;
          btwSel.innerHTML = repos.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
          if (prev && repos.some(r => r.id === prev)) btwSel.value = prev;
        }
        const rf = $("repoFilter");
        if (rf) {
          const counts = new Map();
          tasks.forEach(t => {
            if (!state.showCancelled && t.state === "cancelled") return;
            counts.set(t.repo, (counts.get(t.repo) || 0) + 1);
          });
          const repoIds = Array.from(new Set([...repos.map(r => r.id), ...tasks.map(t => t.repo)])).filter(Boolean);
          const opts = [`<option value="all">Tất cả repo (${repoIds.length})</option>`]
            .concat(repoIds.map(id => {
              const n = counts.get(id) || 0;
              return `<option value="${esc(id)}"${state.repoFilter === id ? " selected" : ""}>${esc(id)}${n ? ` (${n})` : ""}</option>`;
            }));
          rf.innerHTML = opts.join("");
          if (state.repoFilter !== "all" && !repoIds.includes(state.repoFilter)) state.repoFilter = "all";
          rf.value = state.repoFilter;
        }
      }

      /* ==================== RENDER: WORKSPACE (KANBAN + LIST + KPI) ==================== */
      function getFilteredTasks() {
        const tasks = (state.studio && state.studio.tasks) || [];
        const q = state.search.trim().toLowerCase();
        return tasks.filter(t => {
          if (state.repoFilter !== "all" && t.repo !== state.repoFilter) return false;
          if (q && !`${t.id} ${t.repo} ${t.title} ${t.branch} ${t.account}`.toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function renderWorkArea() {
        const canvas = $("workCanvas");
        if (state.loadingStudio && !state.studio) {
          $("workKpis").innerHTML = Array(6).fill('<div class="skel" style="height:50px"></div>').join("");
          canvas.innerHTML = `<div class="kanban-board" style="--col-n:6">${Array(6).fill('<div class="skel" style="height:360px"></div>').join("")}</div>`;
          return;
        }
        if (state.lastError && !state.studio) {
          $("workKpis").innerHTML = "";
          canvas.innerHTML = `<div class="card" style="max-width:480px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <strong>Không kết nối được AAF Hub</strong>
            <span class="muted">${esc(state.lastError)}</span>
            <button class="btn btn-primary" data-act="refresh-now">Thử kết nối lại</button>
          </div>`;
          return;
        }

        const all = getFilteredTasks();
        const buckets = { ready: [], building: [], qa: [], review: [], blocked: [], done: [], cancelled: [] };
        all.forEach(t => buckets[taskBucket(t)].push(t));

        // Update cancelled toggle label
        const btnCan = $("btnToggleCancelled");
        btnCan.textContent = state.showCancelled ? `Ẩn Đã huỷ (${buckets.cancelled.length})` : `Hiện Đã huỷ (${buckets.cancelled.length})`;
        btnCan.setAttribute("aria-pressed", String(state.showCancelled));

        // 6-Stage Workflow Pipeline KPI Tiles (matches GitHub Project Board & AAF TaskState)
        const kpiDefs = [
          { key: "ready", lbl: "Ready", sub: "Chờ slot", color: "var(--c-primary)", n: buckets.ready.length },
          { key: "building", lbl: "Building", sub: "Đang build", color: "var(--c-warn)", n: buckets.building.length },
          { key: "qa", lbl: "QA", sub: "QA Gate", color: "var(--c-qa)", n: buckets.qa.length },
          { key: "review", lbl: "Review", sub: "Cần duyệt", color: "var(--c-review)", n: buckets.review.length },
          { key: "blocked", lbl: "Blocked", sub: "Bị chặn", color: "var(--c-err)", n: buckets.blocked.length },
          { key: "done", lbl: "Done", sub: "Hoàn tất", color: "var(--c-success)", n: buckets.done.length },
        ];
        $("workKpis").innerHTML = kpiDefs.map(k => {
          const pressed = state.filterBucket === k.key;
          return `<button type="button" class="wkpi" data-act="filter-bucket" data-bucket="${k.key}" aria-pressed="${pressed}">
            <div class="wkpi-left">
              <span class="wkpi-sw" style="background:${k.color}"></span>
              <div style="min-width:0;">
                <div class="wkpi-lbl trunc">${k.lbl}</div>
                <div class="wkpi-sub trunc">${k.sub}</div>
              </div>
            </div>
            <div class="wkpi-val tnum">${k.n}</div>
          </button>`;
        }).join("");

        // Empty DB state
        const rawTotal = ((state.studio && state.studio.tasks) || []).length;
        if (!rawTotal) {
          canvas.innerHTML = `<div class="card" style="max-width:520px;margin:36px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px;">
            <strong style="font-size:16px;">Chưa có task nào trong hàng đợi</strong>
            <span class="muted">Giao task đầu tiên để đưa lên bảng Kanban hoặc dùng <code>/btw</code> để hỏi nhanh codebase.</span>
            <div class="row-gap">
              <button class="btn btn-primary" data-act="open-add">+ Tạo task đầu tiên</button>
              <button class="btn" data-act="toggle-btw">/btw Hỏi nhanh</button>
            </div>
          </div>`;
          return;
        }

        const isMob = window.innerWidth < 1024;
        const effectiveMode = isMob ? "list" : state.viewMode;
        $("btnViewKanban").setAttribute("aria-pressed", String(state.viewMode === "kanban"));
        $("btnViewList").setAttribute("aria-pressed", String(state.viewMode === "list"));

        if (effectiveMode === "kanban") {
          renderKanbanBoard(buckets);
        } else {
          renderListView(buckets);
        }
      }

      function renderKanbanCard(t) {
        const active = t.id === state.selectedId && state.drawerOpen ? " active" : "";
        const specParsed = parseSpec(t.spec);
        const snippet = t.blockedReason
          ? `<div class="k-card-why">${esc(t.blockedReason)}</div>`
          : (specParsed.description ? `<div class="k-card-desc">${esc(specParsed.description)}</div>` : "");
        const quickActs = [];
        if (t.state === "blocked" && t.needsPlanApproval) {
          quickActs.push(`<button type="button" class="btn btn-primary btn-sm" data-act="approve-plan" data-id="${esc(t.id)}">Duyệt kế hoạch</button>`);
        }
        if (t.state === "blocked") {
          quickActs.push(`<button type="button" class="btn btn-sm" data-act="unblock" data-id="${esc(t.id)}">Unblock</button>`);
        }
        return `<article class="k-card${active}" data-act="select-task" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.repo)} ${esc(t.title)}">
          <div class="k-card-top">
            <span class="k-card-repo">
              <span class="repo-dot" style="background:${repoColor(t.repo)}"></span>
              <span class="trunc" title="${esc(t.repo)}">${esc(t.repo)}</span>
            </span>
            <div class="row-gap" style="gap:4px;flex-wrap:nowrap;">
              ${priorityBadgeHtml(t.priority)}
              ${statusChipHtml(t.state, t.kind)}
            </div>
          </div>
          <div class="k-card-title">${esc(t.title)}</div>
          ${snippet}
          ${quickActs.length ? `<div class="k-card-quick">${quickActs.join("")}</div>` : ""}
          <div class="k-card-foot mono tnum">
            <span class="k-card-meta">
              <span class="trunc" style="max-width:110px;" title="${esc(t.account || "auto")}">${esc(t.account || "auto")}</span>
              <span>·</span>
              <span class="trunc" title="${esc(t.id)}">${esc(t.id)}</span>
            </span>
            <span style="flex:none;">${esc(t.elapsed || "—")}${t.tokens ? ` · ${Math.round(t.tokens / 1000)}k` : ""}</span>
          </div>
        </article>`;
      }

      function renderKanbanBoard(buckets) {
        const cols = [
          { key: "ready", title: "Ready", sub: "Chờ slot", accent: "var(--c-primary)", items: buckets.ready, empty: "Chưa có task Ready." },
          { key: "building", title: "Building", sub: "Đang build", accent: "var(--c-warn)", items: buckets.building, empty: "Chưa có agent đang build." },
          { key: "qa", title: "QA", sub: "QA Gate", accent: "var(--c-qa)", items: buckets.qa, empty: "Chưa có task đang chạy QA." },
          { key: "review", title: "Review", sub: "Cần duyệt", accent: "var(--c-review)", items: buckets.review, empty: "Chưa có task chờ duyệt." },
          { key: "blocked", title: "Blocked", sub: "Bị chặn", accent: "var(--c-err)", items: buckets.blocked, empty: "Không có task bị chặn." },
          { key: "done", title: "Done", sub: "Hoàn tất", accent: "var(--c-success)", items: buckets.done, empty: "Chưa có task hoàn tất." },
        ];
        if (state.showCancelled) {
          cols.push({ key: "cancelled", title: "Đã huỷ", sub: "Cancelled", accent: "var(--c-away)", items: buckets.cancelled, empty: "Không có task đã huỷ." });
        }
        const visibleCols = state.filterBucket === "all" ? cols : cols.filter(c => c.key === state.filterBucket);
        const activeTotal = buckets.ready.length + buckets.building.length + buckets.qa.length + buckets.review.length + buckets.blocked.length + buckets.done.length;
        const hiddenCancelledBanner = !state.showCancelled && buckets.cancelled.length > 0 && activeTotal <= 2
          ? `<div class="row-gap" style="margin-bottom:10px;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:12.5px;">
              <span class="muted">Đang ẩn <strong>${buckets.cancelled.length}</strong> task đã huỷ để 6 cột workflow gọn gàng.</span>
              <button type="button" class="btn btn-sm" data-act="toggle-cancelled">Hiện task đã huỷ</button>
            </div>`
          : "";

        const singleCls = visibleCols.length === 1 ? " single-col" : "";
        $("workCanvas").innerHTML = `${hiddenCancelledBanner}<div class="kanban-board${singleCls}" style="--col-n:${visibleCols.length}">
          ${visibleCols.map(c => `<section class="kanban-col" style="--col-accent:${c.accent}" aria-label="${c.title}">
            <div class="kanban-col-hdr">
              <span class="kanban-col-title">
                <span class="kanban-col-sw"></span>
                <span class="trunc">${c.title}</span>
                <span class="kanban-col-sub trunc">${c.sub}</span>
              </span>
              <span class="kanban-col-count tnum">${c.items.length}</span>
            </div>
            <div class="kanban-col-list">
              ${c.items.length ? c.items.map(renderKanbanCard).join("") : `<div class="kanban-empty">${c.empty}</div>`}
            </div>
          </section>`).join("")}
        </div>`;
      }

      function renderListView(buckets) {
        const groups = [
          { key: "blocked", title: "Blocked · Bị chặn", items: buckets.blocked },
          { key: "review", title: "Review · Cần duyệt", items: buckets.review },
          { key: "building", title: "Building · Đang build", items: buckets.building },
          { key: "qa", title: "QA · QA Gate", items: buckets.qa },
          { key: "ready", title: "Ready · Chờ slot", items: buckets.ready },
          { key: "done", title: "Done · Hoàn tất", items: buckets.done },
        ];
        if (state.showCancelled) groups.push({ key: "cancelled", title: "Đã huỷ · Cancelled", items: buckets.cancelled });

        const visible = state.filterBucket === "all" ? groups : groups.filter(g => g.key === state.filterBucket);
        const nonEmpty = visible.filter(g => g.items.length > 0);
        if (!nonEmpty.length) {
          $("workCanvas").innerHTML = `<div class="card" style="max-width:480px;margin:24px auto;text-align:center;">
            <p class="muted" style="margin:0 0 12px;">Không có task nào khớp bộ lọc hiện tại.</p>
            ${!state.showCancelled && buckets.cancelled.length ? `<button class="btn" data-act="toggle-cancelled">Hiện ${buckets.cancelled.length} task đã huỷ</button>` : ""}
          </div>`;
          return;
        }

        $("workCanvas").innerHTML = `<div class="list-view">
          ${nonEmpty.map(g => `<div class="list-group">
            <div class="list-group-hdr"><span>${g.title}</span><span class="tnum muted">${g.items.length}</span></div>
            ${g.items.map(t => {
              const active = t.id === state.selectedId && state.drawerOpen ? " active" : "";
              return `<button type="button" class="task-row${active}" data-act="select-task" data-id="${esc(t.id)}">
                <div style="min-width:0;display:flex;align-items:flex-start;gap:10px;">
                  <span class="repo-dot" style="background:${repoColor(t.repo)};margin-top:6px;"></span>
                  <div style="min-width:0;">
                    <div style="font-weight:600;font-size:13.5px;overflow-wrap:anywhere;">${esc(t.title)}</div>
                    <div class="muted mono" style="font-size:12px;margin-top:2px;">${esc(t.repo)} · ${esc(t.id)} · ${esc(t.branch || "—")}</div>
                  </div>
                </div>
                <div class="mono muted tnum" style="font-size:12px;">${esc(t.account || "auto")} · ${esc(t.elapsed || "—")}</div>
                <div class="row-gap" style="justify-content:flex-end;">${priorityBadgeHtml(t.priority)}${statusChipHtml(t.state, t.kind)}</div>
              </button>`;
            }).join("")}
          </div>`).join("")}
        </div>`;
      }

      /* ==================== RENDER: SLIDE-OVER DETAIL DRAWER ==================== */
      function closeDetailDrawer() {
        state.drawerOpen = false;
        state.mobView = "list";
        state.reworkOpen = false;
        $("detailDrawer").classList.add("closed");
        syncMobileShell();
        renderWorkArea();
      }

      function renderDetailDrawer() {
        const drawer = $("detailDrawer");
        if (!state.drawerOpen || !state.selectedId) {
          drawer.classList.add("closed");
          return;
        }
        drawer.classList.remove("closed");

        const tasks = (state.studio && state.studio.tasks) || [];
        const baseTask = tasks.find(t => t.id === state.selectedId) || null;
        const det = state.detail;
        const t = (det && det.task) ? Object.assign({}, baseTask || {}, det.task) : baseTask;
        if (!t) {
          closeDetailDrawer();
          return;
        }

        // Sync tabs aria-selected
        ["tabStream", "tabDiff", "tabPlan", "tabProof"].forEach(id => {
          const el = $(id);
          if (el) el.setAttribute("aria-selected", String(el.getAttribute("data-tab") === state.dtab));
        });

        $("taskHero").innerHTML = `
          <div class="row-gap" style="justify-content:space-between;flex-wrap:nowrap;">
            <div class="row-gap" style="min-width:0;flex-wrap:nowrap;">
              <span class="repo-dot" style="background:${repoColor(t.repo)}"></span>
              <strong class="trunc" style="font-size:13px;">${esc(t.repo)}</strong>
              <span class="muted">/</span>
              <span class="mono" style="font-size:12px;">${esc(t.id)}</span>
              ${priorityBadgeHtml(t.priority)}
            </div>
            <div class="row-gap" style="flex-wrap:nowrap;">
              ${statusChipHtml(t.state, t.kind)}
              <button type="button" class="btn btn-ghost btn-sm desktop-only" data-act="close-drawer" aria-label="Đóng chi tiết">✕</button>
            </div>
          </div>
          <h2 class="task-title">${esc(t.title)}</h2>
          <div class="meta-strip mono tnum">
            <span>Nhánh: ${esc(t.branch || "—")}</span>
            <span>Acc: ${esc(t.account || "auto")}</span>
            <span>${t.tokens ? `${Math.round(t.tokens / 1000)}k tok` : "0 tok"}</span>
            <button type="button" class="btn btn-ghost btn-sm" style="padding:0 8px;" data-act="copy-val" data-val="${esc(t.branch || t.id)}">Copy nhánh</button>
          </div>
          ${t.blockedReason ? `<div class="k-card-why">${esc(t.blockedReason)}</div>` : ""}
        `;

        // Body per selected tab
        const scrollEl = $("drawerScroll");
        const prevScroll = scrollEl.scrollTop;
        const body = $("drawerBody");
        $("jumpLatestWrap").classList.add("hidden");

        if (state.dtab === "stream") {
          const events = (det && det.stream && det.stream.events) || [];
          const notes = parseNotes(t.contextNotes);
          if (!events.length) {
            body.innerHTML = `<div class="card" style="text-align:center;padding:24px;">
              <div class="muted">${t.kind === "manual" ? "Phiên Terminal mở tay — log nằm trực tiếp trong terminal của bạn." : "Chưa có log công cụ cho phiên này."}</div>
              ${notes.length ? `<div class="timeline-out" style="text-align:left;margin-top:12px;">Ghi chú Steer:\n${esc(notes.join("\n"))}</div>` : ""}
            </div>`;
          } else {
            body.innerHTML = events.map((ev, idx) => {
              const key = `${t.id}:${idx}`;
              const open = state.expandedSteps.has(key);
              const f = formatStreamEvent(ev, idx);
              return `<div class="timeline-item">
                <span class="timeline-dot${idx === events.length - 1 && t.state === "running" ? " live" : ""}"></span>
                <button type="button" class="timeline-btn" aria-expanded="${open}" data-act="toggle-step" data-key="${esc(key)}">
                  <div style="min-width:0;flex:1;">
                    <div class="trunc" style="font-size:13px;font-weight:600;">${esc(f.label)}</div>
                    ${f.preview ? `<div class="trunc muted" style="font-size:12px;margin-top:2px;">${esc(f.preview)}</div>` : ""}
                  </div>
                  <span class="mono muted tnum" style="font-size:11.5px;flex:none;">${esc([f.clock, f.dur].filter(Boolean).join(" · "))} ${open ? "▾" : "▸"}</span>
                </button>
                ${open ? `<div class="timeline-out">${esc(f.detail)}</div>` : ""}
              </div>`;
            }).join("");
            if (state.pinnedBottom) scrollEl.scrollTop = scrollEl.scrollHeight;
            else scrollEl.scrollTop = prevScroll;
          }
        } else if (state.dtab === "diff") {
          renderDiffTab(body, det);
        } else if (state.dtab === "plan") {
          const sp = parseSpec(t.spec);
          const notes = parseNotes(t.contextNotes);
          body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;">
            <div>
              <div class="field-label">Mô tả đặc tả (Spec)</div>
              <div class="spec-card">${sp.description ? esc(sp.description) : `<span class="muted">Chưa có đặc tả.</span>`}</div>
            </div>
            ${sp.acceptance.length ? `<div>
              <div class="field-label">Tiêu chí nghiệm thu (${sp.acceptance.length})</div>
              <ul class="accept-list">
                ${sp.acceptance.map(a => `<li><span class="accept-ic">✓</span><span>${esc(a)}</span></li>`).join("")}
              </ul>
            </div>` : ""}
            ${sp.extra ? `<div>
              <div class="field-label">Thông số bổ sung</div>
              <div class="timeline-out">${esc(JSON.stringify(sp.extra, null, 2))}</div>
            </div>` : ""}
            <div>
              <div class="field-label">Ghi chú Steer đã gửi</div>
              ${notes.length
                ? `<ul class="accept-list">${notes.map(n => `<li><span class="accept-ic" style="color:var(--c-primary)">→</span><span>${esc(n)}</span></li>`).join("")}</ul>`
                : `<div class="muted" style="font-size:13px;">Chưa có ghi chú Steer nào.</div>`}
            </div>
          </div>`;
        } else {
          const ho = (det && det.handover) || {};
          const pf = (det && det.proof) || { images: [] };
          const imgs = pf.images || [];
          body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;">
            <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <div>
                <strong>Biên nhận aaf handover</strong>
                <div class="muted" style="font-size:12.5px;margin-top:2px;">${esc(ho.verdict || ho.status || ho.note || "Chưa có biên nhận")}</div>
              </div>
              <div class="tnum" style="font-size:22px;font-weight:700;">${ho.score != null ? `${esc(ho.score)}/100` : "—"}</div>
            </div>
            ${imgs.length ? `<div style="display:flex;flex-direction:column;gap:10px;">
              <div class="field-label">Ảnh nghiệm thu thật (${imgs.length})</div>
              ${imgs.map(img => `<button type="button" class="btn" style="flex-direction:column;height:auto;padding:8px;" data-act="open-proof" data-url="${esc(img.url)}" data-name="${esc(img.name)}">
                <img src="${esc(img.url)}" alt="${esc(img.name)}" loading="lazy" style="max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--border);" />
                <span class="mono muted" style="font-size:12px;">${esc(img.name)}</span>
              </button>`).join("")}
            </div>` : `<div class="muted" style="font-size:13px;">Chưa có ảnh proof PNG gắn cho task này.</div>`}
          </div>`;
        }

        renderContextActions(t);

        // Composer lock state (preserves draft)
        const locked = t.kind === "manual" || t.state === "done" || t.state === "cancelled";
        $("steerInput").classList.toggle("hidden", locked);
        $("btnSteerSend").classList.toggle("hidden", locked);
        $("steerLabel").classList.toggle("hidden", locked);
        $("steerLockedNote").classList.toggle("hidden", !locked);
        if (locked) {
          $("steerLockedNote").textContent = t.kind === "manual"
            ? "Phiên mở tay Terminal — chỉ đọc, không gửi Steer từ web."
            : t.state === "cancelled"
              ? "Task đã huỷ — tạo task mới nếu muốn chạy lại."
              : "Task đã hoàn tất — muốn làm tiếp hãy tạo task mới.";
        }
      }

      function renderDiffTab(body, det) {
        const diff = (det && det.diff) || { available: false, reason: "Đang tải…" };
        if (!diff.available || !diff.patch) {
          body.innerHTML = `<div class="card" style="text-align:center;padding:24px;"><span class="muted">${esc(diff.reason || "Chưa có thay đổi git diff.")}</span></div>`;
          return;
        }
        const filesHtml = (diff.files || []).map(f => {
          const parts = String(f.path || "").split("/");
          const base = parts.pop() || f.path;
          const dir = parts.join("/");
          return `<div style="padding:7px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center;">
            <div style="min-width:0;">
              <div class="mono trunc" style="font-size:12.5px;font-weight:600;">${esc(base)}</div>
              ${dir ? `<div class="mono muted trunc" style="font-size:11.5px;">${esc(dir)}</div>` : ""}
            </div>
            <span class="mono tnum" style="font-size:12px;flex:none;"><span style="color:var(--t-success)">+${f.add}</span> <span style="color:var(--t-err)">-${f.del}</span></span>
          </div>`;
        }).join("");

        let oldLn = 0, newLn = 0;
        const rows = diff.patch.split("\n").slice(0, 600).map(ln => {
          let cls = "", n1 = "", n2 = "";
          if (ln.startsWith("@@")) {
            cls = "diff-hdr";
            const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(ln);
            if (m) { oldLn = parseInt(m[1], 10); newLn = parseInt(m[2], 10); }
          } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
            cls = "diff-add"; n2 = String(newLn++);
          } else if (ln.startsWith("-") && !ln.startsWith("---")) {
            cls = "diff-del"; n1 = String(oldLn++);
          } else if (!ln.startsWith("diff ") && !ln.startsWith("index ") && !ln.startsWith("---") && !ln.startsWith("+++")) {
            n1 = String(oldLn++); n2 = String(newLn++);
          }
          return `<tr class="${cls}"><td class="diff-ln diff-old-col tnum">${n1}</td><td class="diff-ln tnum">${n2}</td><td class="diff-code">${esc(ln)}</td></tr>`;
        }).join("");

        body.innerHTML = `
          <div class="row-gap" style="justify-content:space-between;margin-bottom:10px;">
            <span class="muted" style="font-size:12px;">${(diff.files || []).length} file${diff.truncated ? " (đã cắt ở 200KB)" : ""}</span>
            <button type="button" class="btn btn-sm" data-act="toggle-wrap" aria-pressed="${state.diffWrap}">${state.diffWrap ? "Tắt xuống dòng" : "Xuống dòng (Wrap)"}</button>
          </div>
          ${filesHtml ? `<div style="margin-bottom:12px;">${filesHtml}</div>` : ""}
          <div class="diff-box${state.diffWrap ? " diff-wrap" : ""}"><table class="diff-table"><tbody>${rows}</tbody></table></div>
        `;
      }

      function renderContextActions(t) {
        const box = $("contextActions");
        if (t.kind === "manual") { box.innerHTML = ""; return; }
        if (t.state === "blocked") {
          box.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
            ${t.isHeadLock && t.ttyHint ? `<div class="timeline-out" style="margin:0;">${esc(t.ttyHint)}</div>` : ""}
            <div class="row-gap">
              ${t.isHeadLock && t.ttyHint ? `<button type="button" class="btn btn-primary" style="flex:1" data-act="copy-val" data-val="${esc(t.ttyHint)}">Copy lệnh TTY</button>` : ""}
              ${t.needsPlanApproval ? `<button type="button" class="btn btn-primary" style="flex:1" data-act="approve-plan" data-id="${esc(t.id)}">Duyệt kế hoạch</button>` : ""}
              <button type="button" class="btn" style="flex:1" data-act="unblock" data-id="${esc(t.id)}">Unblock → Ready</button>
            </div>
          </div>`;
          return;
        }
        if (t.state === "review") {
          if (state.reworkOpen) {
            const draft = state.drafts.get("rework:" + t.id) || "";
            box.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
              <label for="reworkInput" class="field-label">Lý do yêu cầu sửa (--reason bắt buộc)</label>
              <div class="row-gap">
                <input id="reworkInput" class="field" style="flex:1" type="text" value="${esc(draft)}" placeholder="Mô tả điểm cần sửa…" />
                <button type="button" class="btn btn-primary" data-act="submit-rework" data-id="${esc(t.id)}">Gửi</button>
                <button type="button" class="btn" data-act="cancel-rework">Huỷ</button>
              </div>
            </div>`;
            return;
          }
          box.innerHTML = `<div class="row-gap"><button type="button" class="btn" style="flex:1" data-act="open-rework">Yêu cầu sửa (Rework)</button></div>`;
          return;
        }
        if (t.state === "running" && t.latestRunId) {
          box.innerHTML = `<div class="row-gap" style="justify-content:space-between;">
            <span class="muted" style="font-size:12.5px;">Đang chạy trong worktree</span>
            <button type="button" class="btn btn-danger" data-act="confirm-stop" data-run="${esc(t.latestRunId)}" data-id="${esc(t.id)}">Dừng khẩn cấp</button>
          </div>`;
          return;
        }
        box.innerHTML = "";
      }

      /* ==================== RENDER: ACCOUNTS TAB (100% CC-SWITCHER PARITY) ==================== */
      function accBadgeHtml(p) {
        if (p.isFrozen) return `<span class="badge b-frozen">Đóng băng</span>`;
        if (p.isActive) return `<span class="badge b-active">Đang dùng</span>`;
        if (p.isParallelActive) return `<span class="badge b-parallel">Chạy song song</span>`;
        return `<span class="badge b-ready">Sẵn sàng</span>`;
      }

      function meterHtml(label, pct, extra) {
        const v = Math.max(0, Math.min(100, Number(pct) || 0));
        const cls = v <= 15 ? "low" : v <= 40 ? "mid" : "";
        return `<div class="meter">
          <div class="row"><span>${esc(label)}</span><b>Còn ${v}%</b></div>
          <div class="sub">${extra ? esc(extra) : "&nbsp;"}</div>
          <div class="bar" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}">
            <i class="${cls}" style="width:${v}%"></i>
          </div>
        </div>`;
      }

      function issueText(reason, mm, idle) {
        if (reason === "token_expired" && idle) return 'chưa dùng gần đây nên token đã hết hạn (bình thường). Bấm "Đăng nhập lại" khi muốn chuyển sang tài khoản này.';
        if (reason === "wrong_account") return `sai tài khoản: thư mục đang đăng nhập ${mm ? mm.actual : "?"}, cần ${mm ? mm.expected : "?"}. Bấm "Đăng nhập lại" bên dưới.`;
        if (reason === "token_expired") return 'token hết hạn. Bấm "Đăng nhập lại" bên dưới.';
        if (reason === "throttled") return "endpoint quota đang giới hạn (429), sẽ thử lại sau.";
        if (reason === "network") return "lỗi mạng khi lấy quota, sẽ thử lại sau.";
        if (reason === "no_credentials") return 'chưa có đăng nhập trong Keychain. Bấm "Đăng nhập lại" bên dưới.';
        return "chưa làm mới được.";
      }

      function needsLogin(p) {
        return p.vendor === "anthropic" && (p.quotaStale || Boolean(p.accountMismatch)) && p.quotaIssue !== "throttled" && p.quotaIssue !== "network";
      }

      function factsHtml(rows) {
        return `<dl class="facts">${rows.filter(Boolean).map(r => {
          const val = r[2] === "two" ? String(r[1]).replace(" · ", "\n") : String(r[1]);
          return `<dt>${esc(r[0])}</dt><dd class="${r[2] === "two" ? "two" : ""}">${esc(val)}</dd>`;
        }).join("")}</dl>`;
      }

      function pShort(id, profiles) {
        const p = (profiles || []).find(x => x.id === id);
        return p ? (p.shortLabel || splitName(p.name).title) : id;
      }

      function effBadgeHtml(r, profiles) {
        const e = r.effective || {};
        if (e.kind === "assigned") return `<span class="badge b-active">${esc(pShort(e.account, profiles))}</span>`;
        if (e.kind === "unpinned") return `<span class="badge b-ready">~/.claude mặc định</span>`;
        if (e.kind === "missing") return `<span class="badge b-frozen">Không thấy repo</span>`;
        if (e.kind === "blocked") return `<span class="badge b-frozen">Tạm dừng</span>`;
        return `<span class="badge b-frozen">Không rõ</span>`;
      }

      function renderAccounts() {
        const root = $("accountsInner");
        if (state.loadingAccounts && !state.accounts) {
          root.innerHTML = `<div class="grid g4"><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div></div>
            <div class="grid g4"><div class="skel" style="height:310px"></div><div class="skel" style="height:310px"></div><div class="skel" style="height:310px"></div><div class="skel" style="height:310px"></div></div>`;
          return;
        }

        const d = state.accounts;
        if (!d || d.ok === false) {
          root.innerHTML = `<div class="card" style="padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <strong>Không đọc được trạng thái CC-Switcher</strong>
            <span class="muted">${esc((d && d.error) || "Chưa có dữ liệu")}</span>
            <button type="button" class="btn btn-primary" data-act="acc-refresh">Thử lại</button>
          </div>`;
          return;
        }

        const caps = d.capabilities || { allowOAuthLogin: true, isRemote: false };
        const profiles = d.profiles || [];
        const claudeProfiles = profiles.filter(p => p.vendor === "anthropic");
        const backupOrder = d.backupOrder || [];
        const backupProfiles = backupOrder.length
          ? backupOrder.map(id => profiles.find(p => p.id === id)).filter(Boolean)
          : profiles.filter(p => p.vendor !== "anthropic");
        const claudeIds = d.claudeAccounts || claudeProfiles.map(p => p.id);
        const repos = d.repoAssignments || [];
        const history = d.history || [];
        const active = d.activeProfile || profiles.find(p => p.isActive) || profiles[0] || {};
        const ab = d.antiBan || { cooldownMinutes: 15, claudeCooldownRemainSec: 0, rateLimitFreezeSec: 18000 };
        const usage = d.usage || { totalCostUsd: 0, totalRequests: 0 };
        const health = d.health || { daemon: { running: true }, telegram: { configured: false }, ccSwitchDb: { exists: true } };

        const probs = [];
        if (health.daemon && !health.daemon.running) probs.push("daemon tắt");
        if (health.telegram && !health.telegram.configured) probs.push("Telegram chưa cấu hình");
        if (health.ccSwitchDb && !health.ccSwitchDb.exists) probs.push("thiếu cc-switch.db");
        if (health.quotaSyncError) probs.push("lỗi đọc quota");

        const cl = cooldownLeftSec();
        const frozenTag = id => {
          const p = profiles.find(x => x.id === id);
          return p && p.isFrozen ? " (đóng băng 429)" : "";
        };

        // Build Repo grouped by Account cards
        const repoByAccCards = claudeIds.map(id => {
          const p = profiles.find(x => x.id === id) || { id, name: id };
          const items = repos.filter(x => x.pinnedInFile && x.account === id);
          const listHtml = items.length
            ? items.map(x => {
                const e = x.effective || {};
                const tagText = e.kind === "blocked" ? "tạm dừng tới giờ reset"
                  : e.kind === "missing" ? "không thấy thư mục"
                  : x.source === "app" ? "app"
                  : x.lastUsedAtMs ? `dùng ${ago(x.lastUsedAtMs)}` : "chưa dùng";
                return `<li><span>${esc(x.name)}</span><span class="tag${x.differs ? " warn" : ""}">${esc(tagText)}</span></li>`;
              }).join("")
            : `<li class="muted" style="justify-content:center;">Chưa có repo nào gán</li>`;
          const subLine = p.isFrozen
            ? `Đang khóa 429${p.resetTimeFormatted ? ` tới ${p.resetTimeFormatted}` : ""}`
            : `Còn ${p.remainingPct != null ? p.remainingPct : "—"}% quota 5 giờ${p.weeklyRemainingPct != null ? ` · tuần ${p.weeklyRemainingPct}%` : ""}`;
          return `<div class="card${p.isFrozen ? " frozen" : ""}">
            <div class="acc-head">
              <div class="acc-head-info">
                <div class="acc-name">${esc(pShort(id, profiles))}</div>
                <div class="acc-mail">${esc(subLine)}</div>
              </div>
              <div class="acc-head-badges"><span class="badge ${items.length ? "b-parallel" : "b-ready"}">${items.length} repo</span></div>
            </div>
            <ul class="repos-mini">${listHtml}</ul>
          </div>`;
        });

        const looseRepos = repos.filter(x => !x.pinnedInFile || claudeIds.indexOf(x.account) < 0);
        if (looseRepos.length) {
          repoByAccCards.push(`<div class="card">
            <div class="acc-head">
              <div class="acc-head-info"><div class="acc-name">Chưa ghim tài khoản</div></div>
              <div class="acc-head-badges"><span class="badge b-fallback">${looseRepos.length} repo</span></div>
            </div>
            <ul class="repos-mini">${looseRepos.map(x => `<li><span>${esc(x.name)}</span><span class="tag warn">${esc(x.pinnedInFile ? `account lạ: ${x.account}` : "chưa ghim → ~/.claude")}</span></li>`).join("")}</ul>
          </div>`);
        }

        // Build Claude account cards
        const claudeCardsHtml = claudeProfiles.map(p => {
          const n = splitName(p.name);
          const resetLeft = p.resetAtMs ? (p.resetAtMs - Date.now()) / 1000 : 0;
          const soft = !p.isActive && !p.isParallelActive && p.quotaIssue === "token_expired";
          const qObj = p.quota || {};
          const meters = p.quotaStale
            ? `<div class="acc-note" role="${soft ? "status" : "alert"}">Số liệu cũ (${esc(ago(qObj.updatedAtMs))}) — ${esc(issueText(p.quotaIssue, p.accountMismatch, soft))}</div>`
            : `${meterHtml("Quota 5 giờ", p.remainingPct, p.resetAtMs ? `reset ${fmtTime(p.resetAtMs)}` : "")}
               ${p.weeklyRemainingPct !== null && p.weeklyRemainingPct !== undefined
                 ? meterHtml("Quota 7 ngày", p.weeklyRemainingPct, p.weeklyResetFormatted ? `reset ${p.weeklyResetFormatted}` : "")
                 : ""}`;

          const factBlock = factsHtml([
            ["Đã dùng (5 giờ)", p.usedPct == null ? "—" : `${p.usedPct}%`],
            ["Reset tuần", p.weeklyResetAtMs ? `${p.weeklyResetFormatted} · còn ${fmtDur((p.weeklyResetAtMs - Date.now()) / 1000)}` : "—", "two"],
            ["Reset / mở khóa", p.resetAtMs ? `${fmtTime(p.resetAtMs)} · còn ${fmtDur(resetLeft)}` : "Chưa có mốc", "two"],
            p.isFrozen && p.frozenUntilMs ? ["Đóng băng tới", fmtTime(p.frozenUntilMs, true)] : null,
            ["Repo đang gán", String(p.assignedRepoCount || 0)],
            ["Số liệu quota", qObj.live ? `live · ${ago(qObj.updatedAtMs)}` : (qObj.source ? `${qObj.source} · ${ago(qObj.updatedAtMs)}` : "chưa có số liệu live")],
          ]);

          const loginButton = needsLogin(p)
            ? (caps.allowOAuthLogin
                ? `<button type="button" class="btn" data-act="acc-login" data-profile="${esc(p.id)}">Đăng nhập lại</button>`
                : `<button type="button" class="btn" disabled title="OAuth chỉ mở trên Mac :4317">OAuth (:4317)</button>`)
            : "";
